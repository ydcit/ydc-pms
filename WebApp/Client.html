          if (state.legacyImport.open && requestToken === state.legacyImport.requestToken) {
            setLegacyImportBusy(false, state.legacyImport.stage === 'REVIEW' ? 'Preview ready' : '');
          }
        });
    }

    function editLegacyImport() {
      if (state.legacyImport.busy) return;
      invalidateLegacyImportPreview();
      clearLegacyImportAlert();
      setLegacyImportStage('PREPARE', true);
    }

    function legacyExecutionCounts(source) {
      var counts = source || {};
      var completed = legacyImportNumeric(counts, ['completed']);
      var imported = legacyImportNumeric(counts, ['imported', 'created', 'saved']);
      var resumed = legacyImportNumeric(counts, ['resumed']);
      var successful = completed;
      if (successful === null && (imported !== null || resumed !== null)) successful = (imported || 0) + (resumed || 0);
      return {
        imported: successful,
        skipped: legacyImportNumeric(counts, ['skipped', 'unchanged', 'alreadyCompleted']),
        failed: legacyImportNumeric(counts, ['failed', 'errors', 'rejected']),
        processed: legacyImportNumeric(counts, ['processed', 'processedCount', 'totalProcessed'])
      };
    }

    function absorbLegacyImportBatch(batch) {
      var execution = state.legacyImport.execution;
      var rows = legacyImportRows(batch, true);
      rows.forEach(function (row, index) {
        var tag = legacyImportRowTag(row);
        var key = tag || ('ROW-' + execution.chunks + '-' + index + '-' + legacyResultStatus(row) + '-' + legacyImportReason(row));
        if (Object.prototype.hasOwnProperty.call(execution.rowIndex, key)) {
          execution.rows[execution.rowIndex[key]] = row;
          return;
        }
        execution.rowIndex[key] = execution.rows.length;
        execution.rows.push(row);
      });
      execution.totalRows = execution.rows.length;

      // The production endpoint exposes per-call counts plus token-lifetime
      // cumulative totals. Prefer cumulative so every continuation is exact.
      var totalsSource = legacyImportObject(batch, ['cumulative', 'totals', 'totalCounts', 'aggregateCounts', 'aggregate']);
      var batchSource = legacyImportObject(batch, ['batchCounts', 'deltaCounts', 'delta']);
      var genericSource = legacyImportObject(batch, ['counts', 'summary']);
      var rowCounts = { imported: 0, skipped: 0, failed: 0, processed: execution.rows.length };
      execution.rows.forEach(function (row) {
        var status = legacyResultStatus(row);
        if (status === 'IMPORTED' || status === 'RESUMED') rowCounts.imported += 1;
        else if (status === 'FAILED') rowCounts.failed += 1;
        else rowCounts.skipped += 1;
      });

      if (totalsSource) {
        var totals = legacyExecutionCounts(totalsSource);
        ['imported', 'skipped', 'failed', 'processed'].forEach(function (key) {
          if (totals[key] !== null) execution[key] = totals[key];
        });
      } else if (rows.length) {
        execution.imported = rowCounts.imported;
        execution.skipped = rowCounts.skipped;
        execution.failed = rowCounts.failed;
        execution.processed = rowCounts.processed;
      } else {
        var reported = legacyExecutionCounts(batchSource || genericSource || batch);
        var cumulative = batch.countsAreCumulative === true || batch.cumulative === true;
        ['imported', 'skipped', 'failed', 'processed'].forEach(function (key) {
          if (reported[key] === null) return;
          execution[key] = cumulative ? Math.max(execution[key], reported[key]) : execution[key] + reported[key];
        });
      }

      var explicitProcessed = legacyImportNumeric(batch, ['processed', 'processedCount', 'totalProcessed']);
      if (explicitProcessed !== null) execution.processed = Math.max(execution.processed, explicitProcessed);
      execution.lastResponse = batch;
    }

    function legacyImportHasMore(result) {
      if (!result) return false;
      if (result.hasMore === true || result.more === true || normalizeText(result.hasMore).toLowerCase() === 'true') return true;
      if (result.done === false || result.complete === false) return true;
      return asNumber(pick(result, ['remaining', 'remainingCount'], 0), 0) > 0;
    }

    function executeLegacyImportChunk() {
      var execution = state.legacyImport.execution;
      execution.chunks += 1;
      if (execution.chunks > LEGACY_IMPORT_MAX_CHUNKS) {
        throw clientError('The import did not finish within the safe continuation limit. Retry to continue with the same confirmation token.', 'LEGACY_IMPORT_CONTINUATION_LIMIT');
      }
      setLegacyImportBusy(true, 'Importing batch ' + execution.chunks + '... ' + formatNumber(execution.processed) + ' processed');
      return serverCall('PMS_apiExecuteLegacyImport', state.legacyImport.request, state.legacyImport.confirmationToken)
        .then(function (result) {
          // An import writes records in bulk; nothing cached survives it.
          clearListCaches();
          if (!state.legacyImport.open) throw clientError('The import window was closed.', 'LEGACY_IMPORT_CLOSED');
          absorbLegacyImportBatch(result || {});
          if (legacyImportHasMore(result)) return executeLegacyImportChunk();
          state.legacyImport.execution.finished = true;
          return result || {};
        });
    }

    function appendLegacyResultRow(body, row) {
      var status = legacyResultStatus(row);
      var tableRow = document.createElement('tr');
      var tagCell = labelledCell('Asset tag');
      var resultCell = labelledCell('Result');
      var detailCell = labelledCell('Details');
      tagCell.textContent = legacyImportRowTag(row) || 'Unknown tag';
      resultCell.appendChild(statusChip(status, true));
      detailCell.textContent = legacyImportReason(row) || (status === 'IMPORTED' ? 'Legacy PMS record saved.' :
        status === 'RESUMED' ? 'An existing incomplete import was resumed and completed.' :
          status === 'FAILED' ? 'The record could not be imported.' : 'No change was required.');
      [tagCell, resultCell, detailCell].forEach(function (cell) { tableRow.appendChild(cell); });
      body.appendChild(tableRow);
    }

    function renderLegacyImportResults() {
      var execution = state.legacyImport.execution || { imported: 0, skipped: 0, failed: 0, processed: 0, rows: [], totalRows: 0 };
      byId('legacy-import-count-imported').textContent = formatNumber(execution.imported);
      byId('legacy-import-count-skipped').textContent = formatNumber(execution.skipped);
      byId('legacy-import-count-failed').textContent = formatNumber(execution.failed);
      byId('legacy-import-count-processed').textContent = formatNumber(execution.processed);

      var body = byId('legacy-import-results-body');
      body.replaceChildren();
      var resultPriority = { FAILED: 0, SKIPPED: 1, RESUMED: 2, IMPORTED: 3 };
      execution.rows.map(function (row, index) {
        var priority = resultPriority[legacyResultStatus(row)];
        return { row: row, index: index, priority: priority === undefined ? 1 : priority };
      }).sort(function (left, right) {
        return left.priority - right.priority || left.index - right.index;
      }).slice(0, LEGACY_IMPORT_TABLE_CAP).forEach(function (entry) { appendLegacyResultRow(body, entry.row); });
      if (!execution.rows.length) {
        var emptyRow = document.createElement('tr');
        var emptyCell = document.createElement('td');
        emptyCell.colSpan = 3;
        emptyCell.className = 'legacy-import-table__empty';
        emptyCell.textContent = 'The server returned aggregate results without row-level details.';
        emptyRow.appendChild(emptyCell);
        body.appendChild(emptyRow);
      }
      var truncated = byId('legacy-import-results-truncated');
      truncated.hidden = execution.totalRows <= LEGACY_IMPORT_TABLE_CAP;
      truncated.textContent = truncated.hidden ? '' : 'Showing the first ' + formatNumber(LEGACY_IMPORT_TABLE_CAP) +
        ' of ' + formatNumber(execution.totalRows) + ' result rows, with failures and skipped rows shown first.';

      var notice = byId('legacy-import-results-notice');
      notice.classList.remove('notice--info', 'notice--warning');
      if (execution.failed) {
        notice.classList.add('notice--warning');
        byId('legacy-import-results-message').textContent = 'Import completed with exceptions';
        byId('legacy-import-results-detail').textContent = formatNumber(execution.imported) + ' imported, ' +
          formatNumber(execution.skipped) + ' skipped, and ' + formatNumber(execution.failed) + ' failed. Review the rows below.';
      } else {
        notice.classList.add('notice--info');
        byId('legacy-import-results-message').textContent = 'Legacy PMS import complete';
        byId('legacy-import-results-detail').textContent = formatNumber(execution.imported) + ' records were imported' +
          (execution.skipped ? '; ' + formatNumber(execution.skipped) + ' were safely skipped.' : '.');
      }
      byId('legacy-import-results-subtitle').textContent = 'Processed across ' + formatNumber(execution.chunks) +
        ' server batch' + (execution.chunks === 1 ? '' : 'es') + '. The dashboard is refreshing.';
    }

    function executeLegacyImport() {
      if (!state.legacyImport.open || state.legacyImport.busy || state.legacyImport.stage !== 'REVIEW') return;
      var preview = state.legacyImport.preview;
      var typed = normalizeText(byId('legacy-import-confirmation-input').value);
      if (!preview || !state.legacyImport.confirmationToken || !preview.confirmationPhrase) {
        showLegacyImportAlert('Preview required', 'Run a fresh server preview before confirming this import.');
        return;
      }
      if (!byId('legacy-import-review-confirm').checked || typed !== preview.confirmationPhrase) {
        setFieldError('legacy-import-confirmation-input', 'legacy-import-confirmation-error', 'Review the preview, select the approval checkbox, and type the server phrase exactly.');
        byId('legacy-import-confirmation-input').focus();
        return;
      }
      clearLegacyImportAlert();
      clearFieldError('legacy-import-confirmation-input', 'legacy-import-confirmation-error');
      if (!state.legacyImport.execution || state.legacyImport.execution.finished) {
        state.legacyImport.execution = {
          imported: 0,
          skipped: 0,
          failed: 0,
          processed: 0,
          rows: [],
          totalRows: 0,
          rowIndex: {},
          chunks: 0,
          finished: false,
          lastResponse: null
        };
      }
      setLegacyImportBusy(true, 'Starting legacy PMS import...');
      Promise.resolve().then(executeLegacyImportChunk)
        .then(function () {
          if (!state.legacyImport.open) return;
          state.legacyImport.dirty = false;
          renderLegacyImportResults();
          setLegacyImportBusy(false, 'Import finished');
          setLegacyImportStage('RESULTS', true);
          return loadBootstrap({ silent: true })
            .then(function () {
              byId('legacy-import-results-subtitle').textContent = 'The dashboard now reflects the completed import.';
              byId('legacy-import-state').textContent = 'Dashboard refreshed';
            })
            .catch(function () {
              byId('legacy-import-results-subtitle').textContent = 'The import finished. Refresh the dashboard to load the latest totals.';
              byId('legacy-import-state').textContent = 'Import finished; dashboard refresh pending';
            });
        })
        .catch(function (error) {
          if (!state.legacyImport.open) return;
          setLegacyImportBusy(false, 'Import paused');
          state.legacyImport.dirty = true;
          var processed = state.legacyImport.execution ? state.legacyImport.execution.processed : 0;
          var code = errorCode(error);
          var needsFreshPreview = [
            'IMPORT_TOKEN_EXPIRED', 'IMPORT_TOKEN_INVALID', 'IMPORT_PREVIEW_STALE',
            'ROLLOVER_BLOCKED', 'TRACKER_YEAR_MISMATCH'
          ].indexOf(code) >= 0;
          if (needsFreshPreview) {
            state.legacyImport.confirmationToken = '';
            if (state.legacyImport.preview) state.legacyImport.preview.confirmationToken = '';
            updateLegacyImportConfirmState();
            showLegacyImportAlert('Fresh preview required' + (processed ? ' after ' + formatNumber(processed) + ' processed' : ''),
              errorMessage(error) + ' Select Edit list, then run the server preview again before importing the remaining assets.');
            return;
          }
          showLegacyImportAlert(processed ? 'Import paused after ' + formatNumber(processed) + ' processed' : 'Import could not start',
            errorMessage(error) + (processed ? ' Confirm again to retry with the same protected import token.' : ''));
        });
    }

    function trapLegacyImportFocus(event) {
      if (!state.legacyImport.open) return;
      if (event.key === 'Escape') {
        event.preventDefault();
        requestCloseLegacyImport(false);
        return;
      }
      if (event.key !== 'Tab') return;
      var focusable = modalFocusable(byId('legacy-import-modal'));
      if (!focusable.length) return;
      var first = focusable[0];
      var last = focusable[focusable.length - 1];
      if (event.shiftKey && document.activeElement === first) {
        event.preventDefault();
        last.focus();
      } else if (!event.shiftKey && document.activeElement === last) {
        event.preventDefault();
        first.focus();
      }
    }

    function renderRollover(rollover) {
      var panel = byId('rollover-panel');
      if (!userIsAdmin()) {
        panel.hidden = true;
        return;
      }
      panel.hidden = false;
      var metrics = state.bootstrap.metrics || {};
      var status = rollover || {};
      var currentYear = asNumber(pick(status, ['currentYear', 'trackerYear', 'oldYear'], pick(metrics, ['year', 'currentYear'], new Date().getFullYear())), new Date().getFullYear());
      var nextYear = asNumber(pick(status, ['nextYear', 'targetYear'], currentYear + 1), currentYear + 1);
      byId('tracker-year-chip').textContent = 'Tracker year ' + currentYear;
      byId('rollover-year').value = String(nextYear);
      renderReconciliationStatus(status, currentYear);
      resetRolloverReview();
    }

    function reconciliationLabel(status) {
      var labels = {
        RUNNING: 'Automatic retry running',
        COMPLETED: 'Synchronized',
        COMPLETED_WITH_FAILURES: 'Needs attention',
        MANUAL_RETRY_REQUIRED: 'Manual retry required',
        FAILED: 'Retry required',
        FAILURE: 'Retry required'
      };
      return labels[status] || (status ? status.replace(/_/g, ' ').toLowerCase().replace(/^./, function (character) { return character.toUpperCase(); }) : 'Synchronized');
    }

    function reconciliationNeedsRetry(status) {
      return status.indexOf('FAIL') >= 0 || status.indexOf('MANUAL_RETRY') >= 0;
    }

    function renderReconciliationStatus(rollover, currentYear) {
      var status = rollover || {};
      var reconciliation = status.reconciliation || {};
      var reconciliationStatus = normalizeText(pick(reconciliation, ['status'], '')).toUpperCase();
      var rawPending = pick(status, ['pendingSync'], null);
      var pendingKnown = rawPending !== null && rawPending !== undefined && Number.isFinite(Number(rawPending));
      var pending = pendingKnown ? Math.max(0, asNumber(rawPending, 0)) : null;
      var needsRetry = reconciliationNeedsRetry(reconciliationStatus);
      var retryVisible = (pending !== null && pending > 0) || needsRetry;
      var retryButton = byId('retry-pending-sync');
      var chip = byId('sync-status-chip');
      var title = byId('sync-recovery-title');
      var detail = byId('sync-recovery-detail');
      var recovery = byId('sync-recovery');
      var validYear = Number.isInteger(Number(currentYear)) && Number(currentYear) >= 2000 && Number(currentYear) <= 9999;

      retryButton.hidden = !retryVisible;
      retryButton.disabled = !validYear;
      retryButton.dataset.trackerYear = validYear ? String(currentYear) : '';
      retryButton.title = validYear ? 'Retry tracker synchronization for ' + currentYear : 'Tracker years must match before synchronization can be retried';

      chip.className = 'status-chip ';
      recovery.classList.remove('sync-recovery--attention', 'sync-recovery--running', 'sync-recovery--success');
      if (!pendingKnown) {
        title.textContent = 'Synchronization status unavailable';
        detail.textContent = 'The two operational tracker sheets do not currently report the same tracker year.';
        chip.textContent = 'Year mismatch';
        chip.className += 'status-chip--danger';
        recovery.classList.add('sync-recovery--attention');
        return;
      }

      title.textContent = pending === 1 ? '1 record pending synchronization' : formatNumber(pending) + ' records pending synchronization';
      if (reconciliationStatus === 'RUNNING') {
        detail.textContent = pending > 0
          ? 'Automatic reconciliation is running in batches. You can retry now if a record needs immediate recovery.'
          : 'The final reconciliation batch is finishing. Refresh the dashboard for the latest result.';
        chip.className += 'status-chip--info';
        recovery.classList.add('sync-recovery--running');
      } else if (needsRetry) {
        detail.textContent = pending > 0
          ? 'Some completed records have not updated their tracker status and remarks. Retry the pending synchronization.'
          : 'The last recovery job reported a failure. Retry to confirm the tracker is synchronized.';
        chip.className += 'status-chip--danger';
        recovery.classList.add('sync-recovery--attention');
      } else if (pending > 0) {
        detail.textContent = 'Completed PMS records are waiting to update their tracker status and remarks.';
        chip.className += 'status-chip--warning';
        recovery.classList.add('sync-recovery--attention');
      } else {
        detail.textContent = 'All completed PMS records for this tracker year are synchronized.';
        chip.className += 'status-chip--success';
        recovery.classList.add('sync-recovery--success');
      }
      chip.textContent = reconciliationStatus ? reconciliationLabel(reconciliationStatus) : (pending > 0 ? 'Pending' : 'Synchronized');
    }

    function retryPendingSynchronization() {
      var button = byId('retry-pending-sync');
      var trackerYear = Number(button.dataset.trackerYear);
      if (!Number.isInteger(trackerYear) || trackerYear < 2000 || trackerYear > 9999) {
        showToast('Retry unavailable', 'Both tracker sheets must use the same valid tracker year.', 'danger');
        return;
      }
      setBusy(true, 'Retrying pending tracker synchronization…');
      serverCall('PMS_apiRetryReconciliation', trackerYear)
        .then(function (result) {
          var reconciliation = result.reconciliation || {};
          var pending = asNumber(pick(reconciliation, ['pendingRemaining'], 0), 0);
          showToast(
            pending > 0 ? 'Synchronization retry started' : 'Tracker synchronized',
            pending > 0 ? formatNumber(pending) + ' record' + (pending === 1 ? ' remains' : 's remain') + ' pending; remaining batches will continue automatically.' : 'No completed records are waiting to update the tracker.',
            pending > 0 ? 'warning' : 'success',
            8500
          );
          return loadBootstrap({ silent: true });
        })
        .catch(function (error) {
          showToast('Synchronization retry failed', errorMessage(error), 'danger', 9000);
        })
        .finally(function () { setBusy(false); });
    }

    function resetRolloverReview() {
      state.dryRun = null;
      byId('rollover-review').hidden = true;
      byId('rollover-reviewed').checked = false;
      byId('rollover-confirmation').value = '';
      byId('rollover-execute').disabled = true;
      byId('rollover-stats').replaceChildren();
    }

    function runRolloverDryRun() {
      var nextYear = Number(byId('rollover-year').value);
      if (!Number.isInteger(nextYear) || nextYear < 2000 || nextYear > 9999) {
        showToast('Invalid year', 'Enter a valid four-digit tracker year.', 'danger');
        byId('rollover-year').focus();
        return;
      }
      setBusy(true, 'Running rollover safety checks…');
      serverCall('PMS_apiRolloverDryRun', nextYear)
        .then(function (result) {
          state.dryRun = result;
          renderRolloverDryRun(result);
          showToast('Safety check complete', 'No workbook changes were made.', 'success');
        })
        .catch(function (error) {
          resetRolloverReview();
          showToast('Safety check failed', errorMessage(error), 'danger');
        })
        .finally(function () { setBusy(false); });
    }

    function renderRolloverDryRun(result) {
      var nextYear = asNumber(result.nextYear, Number(byId('rollover-year').value));
      byId('rollover-review').hidden = false;
      byId('rollover-summary').textContent = 'The tracker can move from ' + result.currentYear + ' to ' + nextYear + '. This preview expires in ' + asNumber(result.expiresInSeconds, 0) + ' seconds.';
      byId('rollover-confirmation-phrase').textContent = 'START ' + nextYear;
      byId('rollover-confirmation').value = '';
      byId('rollover-reviewed').checked = false;
      byId('rollover-execute').disabled = true;

      var stats = byId('rollover-stats');
      stats.replaceChildren();
      if (result.capacity) {
        [
          ['Workbook cells', formatNumber(result.capacity.allocatedCells) + ' / ' + formatNumber(result.capacity.limitCells)],
          ['Workbook capacity used', asNumber(result.capacity.utilizationPercent, 0) + '%']
        ].forEach(function (pair) {
          var wrapper = document.createElement('div');
          var term = document.createElement('dt');
          var description = document.createElement('dd');
          term.textContent = pair[0];
          description.textContent = pair[1];
          wrapper.appendChild(term);
          wrapper.appendChild(description);
          stats.appendChild(wrapper);
        });
      }
      toArray(result.sections).forEach(function (section) {
        var completed = section.completedByCycle || {};
        var remarks = section.remarksByCycle || {};
        var values = [
          ['Section', sectionLabel(section.section) || normalizeText(section.sheetName)],
          ['Eligible assets', formatNumber(section.assetCount)],
          ['Completed T1 / T2 / T3', [completed.T1 || 0, completed.T2 || 0, completed.T3 || 0].join(' / ')],
          ['Remarks T1 / T2 / T3', [remarks.T1 || 0, remarks.T2 || 0, remarks.T3 || 0].join(' / ')]
        ];
        values.forEach(function (pair) {
          var wrapper = document.createElement('div');
          var term = document.createElement('dt');
          var description = document.createElement('dd');
          term.textContent = pair[0];
          description.textContent = pair[1];
          wrapper.appendChild(term);
          wrapper.appendChild(description);
          stats.appendChild(wrapper);
        });
      });
      byId('rollover-review').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function updateRolloverConfirmation() {
      if (!state.dryRun) {
        byId('rollover-execute').disabled = true;
        return;
      }
      var phrase = 'START ' + state.dryRun.nextYear;
      byId('rollover-execute').disabled = !byId('rollover-reviewed').checked || normalizeText(byId('rollover-confirmation').value).toUpperCase() !== phrase;
    }

    function executeRollover() {
      if (!state.dryRun || byId('rollover-execute').disabled) return;
      var nextYear = Number(state.dryRun.nextYear);
      var token = normalizeText(state.dryRun.confirmationToken);
      setBusy(true, 'Opening ' + nextYear + ' and preserving prior-year records…');
      serverCall('PMS_apiExecuteRollover', nextYear, token)
        .then(function (result) {
          showToast('New PMS year opened', normalizeText(result.message) || ('The operational tracker is ready for ' + result.newYear + '.'), 'success', 9000);
          return loadBootstrap({ silent: true });
        })
        .catch(function (error) {
          showToast('Rollover stopped', errorMessage(error), 'danger', 9000);
        })
        .finally(function () { setBusy(false); });
    }

    /* ------------------------------------------------------------------------
       Danger zone: clearing pilot data

       Same shape as the rollover above it, for the same reason: a destructive
       action is previewed, the preview hands back a token, and the token plus a
       typed phrase are what authorise the write. Nothing here is reachable
       without being an administrator, and nothing is reachable without having
       first been shown the numbers.
       ------------------------------------------------------------------------ */

    function renderDangerZone() {
      var panel = byId('danger-zone');
      if (!panel) return;
      panel.hidden = !userIsAdmin();
      resetResetReview();
      renderLastReset(null);
    }

    function renderLastReset(lastReset) {
      var holder = byId('reset-last-run');
      if (!holder) return;
      var entry = lastReset || state.lastReset;
      state.lastReset = entry || null;
      var at = entry ? normalizeText(entry.at) : '';
      holder.hidden = !at;
      if (!at) return;
      holder.textContent = 'Last cleared ' + formatDate(at.slice(0, 10)) +
        (entry.by ? ' by ' + normalizeText(entry.by) : '') +
        (entry.rowsCleared === undefined ? '' : ' · ' + formatNumber(asNumber(entry.rowsCleared, 0)) + ' rows');
    }

    function resetResetReview() {
      state.resetPreview = null;
      var review = byId('reset-review');
      if (!review) return;
      review.hidden = true;
      byId('reset-reviewed').checked = false;
      byId('reset-confirmation').value = '';
      byId('reset-execute').disabled = true;
      byId('reset-error').hidden = true;
      byId('reset-stats').replaceChildren();
      byId('reset-kept').replaceChildren();
    }

    function runResetPreview() {
      setBusy(true, 'Counting what would be cleared…');
      serverCall('PMS_apiResetPreview')
        .then(function (result) {
          state.resetPreview = result;
          renderResetPreview(result);
        })
        .catch(function (error) {
          resetResetReview();
          showToast('Preview failed', errorMessage(error), 'danger');
        })
        .finally(function () { setBusy(false); });
    }

    function renderResetPreview(result) {
      byId('reset-review').hidden = false;
      byId('reset-confirmation-phrase').textContent = normalizeText(result.phrase) || 'RESET';
      byId('reset-confirmation').value = '';
      byId('reset-reviewed').checked = false;
      byId('reset-execute').disabled = true;
      byId('reset-error').hidden = true;

      var totals = result.totals || {};
      var rows = asNumber(totals.rows, 0);
      var cells = asNumber(totals.trackerCells, 0);
      byId('reset-summary-title').textContent = rows || cells
        ? 'This cannot be undone'
        : 'There is nothing to clear';
      byId('reset-summary').textContent = rows || cells
        ? formatNumber(rows) + ' row' + (rows === 1 ? '' : 's') + ' and ' + formatNumber(cells) +
          ' tracker cell' + (cells === 1 ? '' : 's') + ' would be cleared. Numbering restarts at 1. ' +
          'This confirmation expires in ' + asNumber(result.expiresInSeconds, 0) + ' seconds.'
        : 'The records, tickets and tracker cells are already empty.';

      // One tile per sheet, then one per tracker, so the numbers are attributable
      // rather than a single total nobody can check.
      var stats = byId('reset-stats');
      stats.replaceChildren();
      toArray(result.sheets).forEach(function (sheet) {
        stats.appendChild(statTile(
          normalizeText(sheet.sheetName),
          sheet.present ? formatNumber(asNumber(sheet.rows, 0)) + ' rows' : 'Not created yet'
        ));
      });
      toArray(result.trackers).forEach(function (tracker) {
        // Cells, not assets: one asset can hold up to six filled cycle cells, so
        // "18 of 12 assets" would read as nonsense. The asset count is stated
        // alongside because it is the reassuring half of the sentence.
        var cells = asNumber(tracker.filledCells, 0);
        stats.appendChild(statTile(
          normalizeText(tracker.sheetName) + ' · ' + (tracker.trackerYear || '—'),
          formatNumber(cells) + ' cell' + (cells === 1 ? '' : 's') + ' to clear · ' +
            formatNumber(asNumber(tracker.assets, 0)) + ' assets kept'
        ));
      });

      var kept = byId('reset-kept');
      kept.replaceChildren();
      toArray(result.kept).forEach(function (line) {
        var item = document.createElement('li');
        item.textContent = normalizeText(line);
        kept.appendChild(item);
      });

      renderLastReset(result.lastReset);
      byId('reset-review').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    /** A labelled figure, the same shape the rollover report uses. */
    function statTile(label, value) {
      var wrapper = document.createElement('div');
      var term = document.createElement('dt');
      term.textContent = label;
      var detail = document.createElement('dd');
      detail.textContent = value;
      wrapper.appendChild(term);
      wrapper.appendChild(detail);
      return wrapper;
    }

    function updateResetConfirmation() {
      if (!state.resetPreview) {
        byId('reset-execute').disabled = true;
        return;
      }
      var phrase = normalizeText(state.resetPreview.phrase).toUpperCase() || 'RESET';
      var typed = normalizeText(byId('reset-confirmation').value).toUpperCase();
      byId('reset-execute').disabled = !byId('reset-reviewed').checked || typed !== phrase;
    }

    function executeReset() {
      if (!state.resetPreview || byId('reset-execute').disabled) return;
      var token = normalizeText(state.resetPreview.confirmationToken);
      var phrase = normalizeText(byId('reset-confirmation').value);
      setBusy(true, 'Clearing test data…');
      serverCall('PMS_apiExecuteReset', token, phrase)
        .then(function (result) {
          resetResetReview();
          renderLastReset({
            at: new Date().toISOString(),
            by: userEmail(),
            rowsCleared: asNumber(result.rowsCleared, 0)
          });
          // Everything on screen was built from the data that just went.
          clearListCaches();
          showToast('Test data cleared', normalizeText(result.message) || 'The workbook is back to a clean state.', 'success', 9000);
          return loadBootstrap({ silent: true });
        })
        .catch(function (error) {
          var target = byId('reset-error');
          target.hidden = false;
          target.textContent = errorMessage(error);
          byId('reset-execute').disabled = true;
        })
        .finally(function () { setBusy(false); });
    }

    /* ------------------------------------------------------------------------
       Asset combobox.

       Replaces the native <datalist>, which cannot be styled and whose popup
       the browser positions independently of the field. This renders an ARIA
       listbox anchored to the control, with keyboard navigation and a capped
       visible window so a section with a thousand assets stays responsive.
       ------------------------------------------------------------------------ */

    var ASSET_LIST_LIMIT = 50;

    function assetCombobox() {
      return {
        wrap: byId('asset-combobox'),
        input: byId('asset-tag'),
        panel: byId('asset-listbox')
      };
    }

    function assetCompletedForCycle(asset, derived) {
      if (!derived) return false;
      if (asset.trackerYear && asset.trackerYear !== derived.year) return false;
      var cycles = toArray(asset && asset.completedCycles).map(function (cycle) { return normalizeText(cycle).toUpperCase(); });
      return cycles.indexOf(derived.cycleId.toUpperCase()) >= 0 || cycles.indexOf(derived.cycle.toUpperCase()) >= 0;
    }

    function inferredInfraAssetType(tag) {
      var match = /-([A-Z]+)-\d+[A-Z0-9]*$/.exec(normalizeTag(tag));
      if (!match) return '';
      return {
        AP: 'Access Point',
        SW: 'Switch',
        FW: 'Firewall',
        SVR: 'Server'
      }[match[1]] || '';
    }

    function assetMatchesInfraType(asset) {
      if (!isInfraSection()) return true;
      var selectedType = normalizeText(byId('infra-asset-type').value);
      if (!selectedType) return true;
      var inferred = inferredInfraAssetType(asset.tag);
      // Unknown and future prefixes stay visible; the server is authoritative.
      return !inferred || inferred === selectedType;
    }

    function availableAssets() {
      var derived = deriveCycle(byId('maintenance-date').value);
      return state.assets.filter(function (asset) {
        if (state.loadedAssetTag && asset.tag === state.loadedAssetTag) return true;
        return !assetCompletedForCycle(asset, derived) && assetMatchesInfraType(asset);
      });
    }

    function hasAnyOpenAssetCycle() {
      // A technician may enter a valid historical maintenance date. Current
      // tracker flags only block their matching tracker year and cycle after
      // the date is selected, so the modal stays available whenever assets exist.
      return state.assets.length > 0;
    }

    function renderAssetOptions() {
      state.combobox.activeIndex = -1;
      var available = availableAssets();
      var derived = deriveCycle(byId('maintenance-date').value);
      byId('asset-help').textContent = available.length
        ? ('Search ' + formatNumber(available.length) + ' eligible INPROD assets for ' + (derived ? derived.cycleId : 'the selected cycle') + ' in ' + sectionLabel(sectionKey()) + '.')
        : ('No INPROD assets match the selected cycle' + (isInfraSection() && byId('infra-asset-type').value ? ' and asset type' : '') + '.');
      renderAssetList();
    }

    /** Prefix matches rank above substring matches, then location matches. */
    function matchingAssets(query) {
      var term = normalizeTag(query);
      var eligible = availableAssets();
      if (!term) return eligible;
      var starts = [];
      var contains = [];
      eligible.forEach(function (asset) {
        var position = asset.tag.indexOf(term);
        if (position === 0) starts.push(asset);
        else if (position > 0) contains.push(asset);
        else if (String(asset.location || '').toUpperCase().indexOf(term) >= 0) contains.push(asset);
      });
      return starts.concat(contains);
    }

    function renderAssetList(query) {
      var parts = assetCombobox();
      var matches = matchingAssets(query === undefined ? parts.input.value : query);
      state.combobox.matches = matches;
      parts.panel.replaceChildren();

      if (!matches.length) {
        var empty = document.createElement('p');
        empty.className = 'combobox__empty';
        empty.textContent = availableAssets().length
          ? 'No asset matches that search.'
          : 'No assets are awaiting PMS for this cycle and asset type.';
        parts.panel.appendChild(empty);
        return;
      }

      var shown = matches.slice(0, ASSET_LIST_LIMIT);
      if (matches.length > shown.length) {
        var count = document.createElement('p');
        count.className = 'combobox__count';
        count.textContent = 'Showing ' + shown.length + ' of ' + formatNumber(matches.length);
        parts.panel.appendChild(count);
      }

      var selectedTag = state.selectedAsset ? state.selectedAsset.tag : '';
      shown.forEach(function (asset, index) {
        var option = document.createElement('button');
        option.type = 'button';
        option.className = 'combobox__option';
        option.id = 'asset-option-' + index;
        option.tabIndex = -1;
        option.setAttribute('role', 'option');
        option.setAttribute('aria-selected', asset.tag === selectedTag ? 'true' : 'false');
        option.dataset.index = String(index);

        var tag = document.createElement('span');
        tag.className = 'combobox__option-tag';
        tag.textContent = asset.tag;
        var meta = document.createElement('span');
        meta.className = 'combobox__option-meta';
        meta.textContent = asset.location || 'Location not recorded';
        option.appendChild(tag);
        option.appendChild(meta);

        // mousedown rather than click: this keeps focus in the input so the
        // blur validator cannot fire before the selection is committed.
        option.addEventListener('mousedown', function (event) {
          event.preventDefault();
          commitAsset(asset.tag);
        });
        parts.panel.appendChild(option);
      });
    }

    /**
     * Measures the panel against the viewport. The panel is position: fixed so
     * the modal's scroll container cannot clip it, which means its coordinates
     * have to be recomputed whenever the field moves.
     */
    function positionAssetPanel() {
      if (!state.combobox.open) return;
      var parts = assetCombobox();
      var rect = parts.wrap.getBoundingClientRect();
      var panel = parts.panel;
      var gap = 6;
      var margin = 12;
      var spaceBelow = window.innerHeight - rect.bottom - margin;
      var spaceAbove = rect.top - margin;
      var flipUp = spaceBelow < 170 && spaceAbove > spaceBelow;
      var available = Math.max(120, Math.min(288, flipUp ? spaceAbove : spaceBelow));

      panel.style.left = Math.round(rect.left) + 'px';
      panel.style.width = Math.round(rect.width) + 'px';
      panel.style.maxHeight = Math.round(available) + 'px';
      if (flipUp) {
        panel.style.top = 'auto';
        panel.style.bottom = Math.round(window.innerHeight - rect.top + gap) + 'px';
      } else {
        panel.style.bottom = 'auto';
        panel.style.top = Math.round(rect.bottom + gap) + 'px';
      }
    }

    function openAssetList(refilter) {
      var parts = assetCombobox();
      if (refilter !== false) renderAssetList();
      parts.panel.hidden = false;
      parts.wrap.classList.add('is-open');
      parts.input.setAttribute('aria-expanded', 'true');
      state.combobox.open = true;
      positionAssetPanel();
      // Capture phase so scrolling the modal body repositions the panel too.
      window.addEventListener('scroll', positionAssetPanel, true);
      window.addEventListener('resize', positionAssetPanel);
    }

    function closeAssetList() {
      var parts = assetCombobox();
      parts.panel.hidden = true;
      parts.wrap.classList.remove('is-open');
      parts.input.setAttribute('aria-expanded', 'false');
      parts.input.removeAttribute('aria-activedescendant');
      state.combobox.open = false;
      state.combobox.activeIndex = -1;
      window.removeEventListener('scroll', positionAssetPanel, true);
      window.removeEventListener('resize', positionAssetPanel);
    }

    function highlightAssetOption(index) {
      var parts = assetCombobox();
      var options = parts.panel.querySelectorAll('.combobox__option');
      if (!options.length) return;
      var bounded = Math.max(0, Math.min(options.length - 1, index));
      options.forEach(function (option) { option.classList.remove('is-active'); });
      var active = options[bounded];
      active.classList.add('is-active');
      active.scrollIntoView({ block: 'nearest' });
      parts.input.setAttribute('aria-activedescendant', active.id);
      state.combobox.activeIndex = bounded;
    }

    function commitAsset(tag) {
      byId('asset-tag').value = tag;
      closeAssetList();
      selectAsset(tag, true);
      markDirty();
    }

    function onAssetKeydown(event) {
      var key = event.key;
      if (key === 'ArrowDown' || key === 'ArrowUp') {
        event.preventDefault();
        if (!state.combobox.open) {
          openAssetList();
          highlightAssetOption(key === 'ArrowDown' ? 0 : state.combobox.matches.length - 1);
          return;
        }
        highlightAssetOption(state.combobox.activeIndex + (key === 'ArrowDown' ? 1 : -1));
        return;
      }
      if (key === 'Enter' && state.combobox.open && state.combobox.activeIndex >= 0) {
        event.preventDefault();
        var chosen = state.combobox.matches[state.combobox.activeIndex];
        if (chosen) commitAsset(chosen.tag);
        return;
      }
      if (key === 'Escape' && state.combobox.open) {
        event.preventDefault();
        event.stopPropagation();
        closeAssetList();
      }
    }

    function renderInfraAssetTypeOptions() {
      var select = byId('infra-asset-type');
      var current = normalizeText(select.value);
      select.replaceChildren();
      var placeholder = document.createElement('option');
      placeholder.value = '';
      placeholder.textContent = 'Select an IT-IS asset type';

        option.textContent = assetType;
        select.appendChild(option);
      });

    function applyQuestionnaireMode() {
      var infra = isInfraSection();
      renderInfraAssetTypeOptions();
      byId('infra-asset-type-field').hidden = !infra;
      byId('infra-asset-type').required = infra;
      byId('service-desk-peripherals').hidden = infra;

      byId('review-asset-type-row').hidden = !infra;

        : 'Add every tagged peripheral included in this maintenance. Every field on this step is optional — you can continue without entering any tags.';
      byId('step-3-description').textContent = infra
        ? 'All four checks need an answer: tick each one, or mark it Not done and say why.'
        : 'Tick each check, or mark it Not done and say why. Every item needs an answer.';
