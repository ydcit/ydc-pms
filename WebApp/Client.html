<script>
  (function () {
    'use strict';

    var state = {
      bootstrap: null,
      user: {},
      profile: {},
      config: {},
      sections: [],
      assets: [],
      assetMap: new Map(),
      peripherals: [],
      serviceDeskChecklistGroups: [],
      infraChecklistGroups: [],
      checklistGroups: [],
      infraAssetTypes: [],
      evidenceConfig: {},
      infraEvidence: { firmware: null, backup: null },
      peripheralValues: {},
      checklistValues: {},
      currentStep: 1,
      recordId: '',
      idempotencyKey: '',
      selectedAsset: null,
      loadedAssetTag: '',
      // Open repairs on a loaded record's asset, read fresh from the server with
      // the record. Takes precedence over the bootstrap asset list for that one
      // tag, which was accurate when the page loaded and may not be now.
      recordAssetTickets: { tag: '', tickets: [] },
      dirty: false,
      modalOpen: false,
      busy: false,
      combobox: { open: false, activeIndex: -1, matches: [] },
      tickets: {
        open: false, view: 'list', page: 1, totalPages: 1, direction: 'DESC',
        status: 'ACTIVE', token: 0, searchTimer: null, lastFocus: null,
        currentId: '', sourceRecordId: '', statuses: [], statusLabels: null,
        // Asset picker for the create form. Loaded per section on demand rather
        // than at bootstrap, and cached here so reopening the form is instant.
        assetCache: {}, assets: [], assetSection: '', assetsLoading: false,
        assetCombobox: { open: false, activeIndex: -1, matches: [] },
        // Server responses by request signature, so paging back is free.
        cache: {}
      },
      archive: {
        open: false, page: 1, totalPages: 1, direction: 'DESC',
        token: 0, searchTimer: null, lastFocus: null, cache: {}
      },
      listsWarmed: false,
      legacyImport: {
        open: false,
        stage: 'PREPARE',
        dirty: false,
        busy: false,
        requestToken: 0,
        lastFocus: null,
        request: null,
        preview: null,
        confirmationToken: '',
        execution: null
      },
      rolloverLoading: false,
      lastFocus: null,
      dryRun: null,
      // The reset preview, held only long enough to confirm against. It carries
      // the server's token, so losing it means starting the preview again.
      resetPreview: null,
      lastReset: null,
      submittedCompletion: '',
      // Tickets filed from the questionnaire's assessment step, listed back to
      // the technician so the same finding is not raised twice.
      recordTickets: []
    };

    var FALLBACK_SECTIONS = [
      { key: 'INFRA_SECURITY', label: 'Infrastructure & Security' },
      { key: 'SERVICE_DESK', label: 'Service Desk' }
    ];

    var FALLBACK_PERIPHERALS = [
      { key: 'nuc', label: 'Yubikey' },
      { key: 'nucAdaptor', label: 'Laptop charger' },
      { key: 'monitor', label: 'Monitor' },
      { key: 'keyboard', label: 'Keyboard' },
      { key: 'mouse', label: 'Mouse' },
      { key: 'ups', label: 'UPS' },
      { key: 'powerAdaptor', label: 'Power adaptor' },
      { key: 'headset', label: 'Headset' },
      { key: 'typeCAdaptor', label: 'Type-C adaptor' },
      { key: 'webcam', label: 'Webcam' }
    ];

    var FALLBACK_CHECKLIST = [
      {
        key: 'hardware',
        label: 'Hardware inspection',
        description: 'Physical components and connected hardware',
        items: [
          { key: 'physicalInspection', label: 'Physical inspection completed' },
          { key: 'displayChecked', label: 'Display checked' },
          { key: 'keyboardMouseChecked', label: 'Keyboard and mouse checked' },
          { key: 'portsTested', label: 'Ports tested' },
          { key: 'batteryChargerChecked', label: 'Battery and charger checked' },
          { key: 'cameraAudioChecked', label: 'Camera and audio checked' }
        ]
      },
      {
        key: 'system',
        label: 'System health',
        description: 'Operating system, storage, and performance',
        items: [
          { key: 'osUpdated', label: 'Operating system updated' },
          { key: 'storageChecked', label: 'Storage checked' },
          { key: 'performanceChecked', label: 'Performance checked' },
          { key: 'startupVerified', label: 'Startup verified' }
        ]
      },
      {
        key: 'security',
        label: 'Security controls',
        description: 'Endpoint protection and access controls',
        items: [
          { key: 'antivirusVerified', label: 'Antivirus verified' },
          { key: 'firewallVerified', label: 'Firewall verified' },
          { key: 'diskEncryptionVerified', label: 'Disk encryption verified' },
          { key: 'screenLockVerified', label: 'Screen lock verified' }
        ]
      },
      {
        key: 'network',
        label: 'Network connectivity',
        description: 'Wired and wireless connectivity',
        items: [
          { key: 'ethernetTested', label: 'Ethernet port tested' },
          { key: 'wifiChecked', label: 'Wi-Fi adapter checked' }
        ]
      },
      {
        key: 'applications',
        label: 'Required applications',
        description: 'Business software readiness',
        items: [
          { key: 'requiredSoftwareVerified', label: 'Required software verified' }
        ]
      },
      {
        key: 'maintenance',
        label: 'Maintenance and cleaning',
        description: 'Housekeeping and final health checks',
        items: [
          { key: 'temporaryFilesCleaned', label: 'Temporary files cleaned' },
          { key: 'deviceCleaned', label: 'Device cleaned' },
          { key: 'healthCheckCompleted', label: 'Health check completed' }
        ]
      }
    ];

    var FALLBACK_INFRA_ASSET_TYPES = [
      'Switch',
      'Firewall',
      'Access Point',
      'OMADA Controller',
      'Server',
      'FortiAnalyzer'
    ];

    var FALLBACK_INFRA_CHECKLIST = [
      {
        key: 'physical',
        label: 'Physical Checking',
        description: 'Cabling, power, and supporting equipment',
        items: [
          { key: 'infraPowerCables', label: 'Power Cables Checked' },
          { key: 'infraDataCables', label: 'Data Cables Checked' },
          { key: 'infraPowerSupplyUps', label: 'Power Supply / UPS Checked' }
        ]
      },
      {
        key: 'digital',
        label: 'Digital Checking',
        description: 'Firmware currency and device readiness',
        items: [
          { key: 'infraFirmwareLatest', label: 'Firmware Version at latest' }
        ]
      }
    ];

    var DEFAULT_EVIDENCE_BYTES = 10 * 1024 * 1024;
    var LEGACY_IMPORT_FILE_MAX_BYTES = 2 * 1024 * 1024;
    var LEGACY_IMPORT_MAX_LOCAL_TAGS = 1500;
    var LEGACY_IMPORT_TABLE_CAP = 250;
    var LEGACY_IMPORT_MAX_CHUNKS = 200;
    var DEFAULT_EVIDENCE_ACCEPT = '.pdf,.png,.jpg,.jpeg,.webp,application/pdf,image/png,image/jpeg,image/webp';
    var FALLBACK_EVIDENCE = {
      firmware: {
        key: 'firmware',
        label: 'Latest Firmware Version Evidence',
        maxBytes: DEFAULT_EVIDENCE_BYTES,
        accept: DEFAULT_EVIDENCE_ACCEPT
      },
      backup: {
        key: 'backup',
        label: 'Configurations / Backup / Checkpoints Evidence',
        maxBytes: DEFAULT_EVIDENCE_BYTES,
        accept: DEFAULT_EVIDENCE_ACCEPT
      }
    };

    function byId(id) {
      return document.getElementById(id);
    }

    function toArray(value) {
      return Array.isArray(value) ? value : [];
    }

    function pick(source, keys, fallback) {
      var object = source || {};
      for (var i = 0; i < keys.length; i += 1) {
        if (object[keys[i]] !== undefined && object[keys[i]] !== null) {
          return object[keys[i]];
        }
      }
      return fallback;
    }

    function asNumber(value, fallback) {
      var number = Number(value);
      return Number.isFinite(number) ? number : (fallback || 0);
    }

    function clampPercent(value) {
      return Math.max(0, Math.min(100, Math.round(asNumber(value, 0))));
    }

    function normalizeText(value) {
      return String(value === undefined || value === null ? '' : value).trim();
    }

    function normalizeTag(value) {
      return normalizeText(value).toUpperCase();
    }

    /**
     * Builds an icon node from the sprite in Index.html so dynamically created
     * markup uses the same stroke set as the static markup.
     */
    function iconSvg(name) {
      var ns = 'http://www.w3.org/2000/svg';
      var svg = document.createElementNS(ns, 'svg');
      svg.setAttribute('class', 'icon');
      svg.setAttribute('aria-hidden', 'true');
      var use = document.createElementNS(ns, 'use');
      use.setAttribute('href', '#i-' + name);
      svg.appendChild(use);
      return svg;
    }

    /**
     * A table cell that knows what column it belongs to.
     *
     * On a phone the tables become stacked cards, and a cell with no visible
     * column header above it is just an unlabelled value. The label is carried on
     * the cell so the card layout can render it from CSS, which keeps one set of
     * row-building code serving both shapes.
     *
     * Cells holding only controls are created without a label, because "Actions"
     * printed beside a button reads as noise.
     */
    function labelledCell(label) {
      var cell = document.createElement('td');
      if (label) cell.dataset.label = label;
      else cell.className = 'is-controls';
      return cell;
    }

    function parseServerValue(value) {
      var parsed = value;
      if (typeof parsed === 'string') {
        try {
          parsed = JSON.parse(parsed);
        } catch (ignore) {
          return parsed;
        }
      }
      return parsed;
    }

    function clientError(message, code) {
      var error = new Error(normalizeText(message) || 'The request could not be completed.');
      error.code = normalizeText(code) || 'PMS_ERROR';
      return error;
    }

    function errorCode(error) {
      if (!error) return '';
      var code = normalizeText(error.code || error.errorCode);
      if (!code && error.name && error.name !== 'Error') code = normalizeText(error.name);
      if (!code && /IDENTITY_UNAVAILABLE/i.test(normalizeText(error.message || error))) {
        code = 'IDENTITY_UNAVAILABLE';
      }
      return code.toUpperCase();
    }

    function unwrapServerResponse(value) {
      var parsed = parseServerValue(value);
      if (parsed && parsed.ok === false) {
        throw clientError(parsed.message || parsed.error, parsed.code);
      }
      if (parsed && parsed.data !== undefined && parsed.ok === true) {
        return parsed.data;
      }
      return parsed || {};
    }

    function errorMessage(error) {
      if (!error) return 'Something went wrong. Please try again.';
      var message = normalizeText(error.message || error);
      return message || 'Something went wrong. Please try again.';
    }

    function serverCall(functionName) {
      var args = Array.prototype.slice.call(arguments, 1);
      return new Promise(function (resolve, reject) {
        if (!window.google || !google.script || !google.script.run) {
          reject(new Error('This page must be opened from the deployed Google Apps Script web app.'));
          return;
        }

        var runner = google.script.run
          .withSuccessHandler(function (response) {
            try {
              resolve(unwrapServerResponse(response));
            } catch (error) {
              reject(error);
            }
          })
          .withFailureHandler(function (error) {
            reject(clientError(errorMessage(error), errorCode(error)));
          });

        if (typeof runner[functionName] !== 'function') {
          reject(new Error('The requested server function is unavailable: ' + functionName));
          return;
        }

        runner[functionName].apply(runner, args);
      });
    }

    function setBusy(isBusy, message) {
      state.busy = Boolean(isBusy);
      var overlay = byId('busy-overlay');
      overlay.hidden = !state.busy;
      byId('busy-message').textContent = normalizeText(message) || 'Working…';
      document.querySelectorAll('button').forEach(function (button) {
        if (button.closest('#busy-overlay')) return;
        if (state.busy) {
          if (button.dataset.wasDisabled === undefined) {
            button.dataset.wasDisabled = button.disabled ? 'true' : 'false';
          }
          button.disabled = true;
        } else if (button.dataset.wasDisabled !== undefined) {
          button.disabled = button.dataset.wasDisabled === 'true';
          delete button.dataset.wasDisabled;
        }
      });
      if (!state.busy) updateFooterActions();
    }

    function showToast(title, message, type, duration) {
      var toast = document.createElement('div');
      toast.className = 'toast toast--' + (type || 'info');
      toast.setAttribute('role', type === 'danger' ? 'alert' : 'status');

      var content = document.createElement('div');
      var heading = document.createElement('strong');
      var detail = document.createElement('span');
      heading.textContent = normalizeText(title);
      detail.textContent = normalizeText(message);
      content.appendChild(heading);
      if (detail.textContent) content.appendChild(detail);

      var close = document.createElement('button');
      close.type = 'button';
      close.setAttribute('aria-label', 'Dismiss notification');
      close.appendChild(iconSvg('close'));
      close.addEventListener('click', function () { toast.remove(); });

      toast.appendChild(content);
      toast.appendChild(close);
      byId('toast-region').appendChild(toast);
      window.setTimeout(function () {
        if (toast.isConnected) toast.remove();
      }, duration || 6500);
    }

    var FATAL_TITLES = {
      ACCESS_NOT_PROVISIONED: 'Your account is not on the PMS access list',
      ACCOUNT_DISABLED: 'Your PMS account is inactive',
      ACCESS_DENIED: 'Access denied',
      IDENTITY_UNAVAILABLE: 'We could not read your Google account',
      BOOTSTRAP_INCOMPLETE: 'PMS loaded with an incomplete response'
    };

    function showFatal(error) {
      var code = errorCode(error);
      byId('boot-screen').hidden = true;
      byId('register-view').hidden = true;
      byId('dashboard-view').hidden = true;
      byId('topbar').hidden = true;
      byId('fatal-title').textContent = FATAL_TITLES[code] || "We couldn't load your workspace";
      byId('fatal-message').textContent = errorMessage(error) || 'Please refresh and try again.';
      byId('retry-bootstrap').textContent = 'Try again';
      byId('fatal-state').hidden = false;
      byId('fatal-title').focus && byId('fatal-title').focus();
    }

    function initials(name, email) {
      var words = normalizeText(name).split(/\s+/).filter(Boolean);
      if (words.length > 1) return (words[0][0] + words[words.length - 1][0]).toUpperCase();
      if (words.length === 1) return words[0].slice(0, 2).toUpperCase();
      return normalizeText(email).slice(0, 2).toUpperCase() || 'IT';
    }

    function normalizeSections(value) {
      var source = value;
      if (!Array.isArray(source) && source && typeof source === 'object') {
        source = Object.keys(source).map(function (key) {
          var entry = source[key];
          return typeof entry === 'string' ? { key: key, label: entry } : Object.assign({ key: key }, entry);
        });
      }
      var normalized = toArray(source).map(function (entry) {
        if (typeof entry === 'string') return { key: entry, label: entry };
        return {
          key: normalizeText(pick(entry, ['key', 'id', 'value', 'sectionKey'], '')),
          label: normalizeText(pick(entry, ['label', 'name', 'displayName', 'section'], ''))
        };
      }).filter(function (entry) { return entry.key; });
      return normalized.length ? normalized : FALLBACK_SECTIONS.slice();
    }

    function normalizePeripherals(value) {
      var source = value;
      if (!Array.isArray(source) && source && typeof source === 'object') {
        source = Object.keys(source).map(function (key) {
          var entry = source[key];
          return typeof entry === 'string' ? { key: key, label: entry } : Object.assign({ key: key }, entry);
        });
      }
      var normalized = toArray(source).map(function (entry) {
        if (typeof entry === 'string') return { key: entry, label: entry };
        return {
          key: normalizeText(pick(entry, ['key', 'id', 'value'], '')),
          label: normalizeText(pick(entry, ['label', 'name', 'title'], ''))
        };
      }).filter(function (entry) { return entry.key; });
      return normalized.length ? normalized : FALLBACK_PERIPHERALS.slice();
    }

    function normalizeChecklist(value, fallback) {
      var source = value;
      if (!Array.isArray(source) && source && typeof source === 'object') {
        source = Object.keys(source).map(function (key) {
          var group = source[key];
          return Object.assign({ key: key }, Array.isArray(group) ? { items: group } : group);
        });
      }

      var groups = toArray(source).map(function (group, groupIndex) {
        var items = pick(group, ['items', 'checks', 'questions'], []);
        return {
          key: normalizeText(pick(group, ['key', 'id', 'categoryKey'], 'group' + groupIndex)),
          label: normalizeText(pick(group, ['label', 'name', 'title', 'category'], 'Checklist')),
          description: normalizeText(pick(group, ['description', 'helpText', 'subtitle'], '')),
          items: toArray(items).map(function (item, itemIndex) {
            if (typeof item === 'string') {
              return { key: item, label: item };
            }
            return {
              key: normalizeText(pick(item, ['key', 'id', 'value'], 'item' + itemIndex)),
              label: normalizeText(pick(item, ['label', 'name', 'title', 'text'], 'Checklist item')),
              groupKey: pick(item, ['groupKey'], '')
            };
          }).filter(function (item) { return item.key; })
        };
      }).filter(function (group) { return group.items.length; });

      if (!groups.length && Array.isArray(value)) {
        var flat = value.filter(function (item) {
          return item && !Array.isArray(item.items) && pick(item, ['key', 'id'], '');
        });
        if (flat.length) {
          var grouped = {};
          flat.forEach(function (item) {
            var category = normalizeText(pick(item, ['category', 'group', 'categoryLabel'], 'Checklist'));
            if (!grouped[category]) grouped[category] = [];
            grouped[category].push(item);
          });
          groups = Object.keys(grouped).map(function (category, index) {
            return {
              key: 'group' + index,
              label: category,
              description: '',
              items: grouped[category].map(function (item) {
                return {
                  key: normalizeText(pick(item, ['key', 'id'], '')),
                  label: normalizeText(pick(item, ['label', 'name', 'title', 'text'], 'Checklist item')),
                  groupKey: pick(item, ['groupKey'], '')
                };
              })
            };
          });
        }
      }

      return groups.length ? groups : (fallback || FALLBACK_CHECKLIST).slice();
    }

    function normalizeStringOptions(value, fallback) {
      var seen = {};
      var options = toArray(value).map(function (entry) {
        return normalizeText(typeof entry === 'string' ? entry : pick(entry, ['label', 'name', 'value', 'title'], ''));
      }).filter(function (entry) {
        var key = entry.toUpperCase();
        if (!entry || seen[key]) return false;
        seen[key] = true;
        return true;
      });
      return options.length ? options : (fallback || []).slice();
    }

    function normalizeAccept(value) {
      if (Array.isArray(value)) return value.map(normalizeText).filter(Boolean).join(',');
      return normalizeText(value) || DEFAULT_EVIDENCE_ACCEPT;
    }

    function normalizeEvidenceConfig(value) {
      var source = value && typeof value === 'object' ? value : {};
      var sharedMax = asNumber(pick(source, ['maxBytes', 'maximumBytes', 'fileSizeLimit'], DEFAULT_EVIDENCE_BYTES), DEFAULT_EVIDENCE_BYTES);
      var sharedAccept = normalizeAccept(pick(source, ['accept', 'acceptedTypes', 'mimeTypes'], DEFAULT_EVIDENCE_ACCEPT));
      var normalized = {};
      Object.keys(FALLBACK_EVIDENCE).forEach(function (kind) {
        var fallback = FALLBACK_EVIDENCE[kind];
        var item = source[kind] || source[fallback.key] || {};
        normalized[kind] = {
          key: kind,
          label: normalizeText(pick(item, ['label', 'name', 'title'], fallback.label)) || fallback.label,
          maxBytes: Math.max(1, asNumber(pick(item, ['maxBytes', 'maximumBytes', 'fileSizeLimit'], sharedMax), sharedMax)),
          accept: normalizeAccept(pick(item, ['accept', 'acceptedTypes', 'mimeTypes'], sharedAccept))
        };
      });
      return normalized;
    }

    function questionnaireConfig(kind) {
      var questionnaires = state.config.questionnaires || {};
      if (kind === 'infra') {
        return questionnaires.infraSecurity || questionnaires.INFRA_SECURITY || questionnaires.infra || {};
      }
      return questionnaires.serviceDesk || questionnaires.SERVICE_DESK || {};
    }

    function normalizedCompletedCycles(asset) {
      var value = pick(asset, ['completedCycles', 'cycles'], []);
      var output = [];
      if (Array.isArray(value)) {
        value.forEach(function (entry) {
          var cycle = normalizeText(typeof entry === 'string' ? entry : pick(entry, ['cycleId', 'cycle', 'key'], ''));
          var completed = typeof entry === 'object' ? pick(entry, ['completed', 'checked', 'done'], true) : true;
          if (cycle && completed !== false) output.push(cycle.toUpperCase());
        });
      } else if (value && typeof value === 'object') {
        Object.keys(value).forEach(function (key) {
          var entry = value[key];
          var completed = typeof entry === 'object' ? pick(entry, ['completed', 'checked', 'done'], true) : entry;
          if (completed === true || normalizeText(completed).toUpperCase() === 'COMPLETED') output.push(normalizeText(key).toUpperCase());
        });
      } else {
        normalizeText(value).split(/[|,;\s]+/).filter(Boolean).forEach(function (cycle) { output.push(cycle.toUpperCase()); });
      }
      return output.filter(function (cycle, index) { return output.indexOf(cycle) === index; });
    }

    function normalizeAssets(value) {
      var seen = new Set();
      return toArray(value).map(function (asset) {
        if (typeof asset === 'string') {
          return { tag: normalizeTag(asset), status: 'INPROD', location: '', sourceTab: '', completedCycles: [] };
        }
        return {
          tag: normalizeTag(pick(asset, ['tag', 'assetTag', 'asset', 'id'], '')),
          status: normalizeText(pick(asset, ['status', 'equipmentStatus'], 'INPROD')).toUpperCase(),
          location: normalizeText(pick(asset, ['location', 'masterLocation'], '')),
          sourceTab: normalizeText(pick(asset, ['sourceTab', 'sheetName', 'source'], '')),
          row: pick(asset, ['row', 'sourceRow'], null),
          trackerYear: asNumber(pick(asset, ['trackerYear', 'year'], 0), 0),
          // Absent on the healthy majority, which is why it is defaulted here
          // rather than being sent as an empty array for every asset.
          openTickets: toArray(pick(asset, ['openTickets'], [])),
          completedCycles: normalizedCompletedCycles(asset)
        };
      }).filter(function (asset) {
        if (!asset.tag || seen.has(asset.tag)) return false;
        seen.add(asset.tag);
        return true;
      });
    }

    function sectionKey() {
      return normalizeText(pick(state.profile, ['sectionKey', 'section', 'itSection'], pick(state.user, ['sectionKey', 'section'], '')));
    }

    function isInfraSection() {
      return sectionKey().toUpperCase() === 'INFRA_SECURITY';
    }

    function sectionLabel(key) {
      var match = state.sections.find(function (section) { return section.key === key; });
      return match ? match.label : normalizeText(key).replace(/_/g, ' ');
    }

    function userName() {
      return normalizeText(pick(state.profile, ['name', 'displayName', 'technicianName'], pick(state.user, ['name', 'displayName'], '')));
    }

    function userEmail() {
      return normalizeText(pick(state.user, ['email', 'technicianEmail'], pick(state.profile, ['email'], '')));
    }

    function userIsAdmin() {
      var role = normalizeText(pick(state.profile, ['role'], pick(state.user, ['role'], ''))).toUpperCase();
      return Boolean(state.profile.isAdmin || state.user.isAdmin || role === 'ADMIN' || role === 'PMS_ADMIN');
    }

    function initializeSchema() {
      var serviceDesk = questionnaireConfig('serviceDesk');
      var infra = questionnaireConfig('infra');
      state.sections = normalizeSections(state.config.sections);
      state.peripherals = normalizePeripherals(pick(serviceDesk, ['peripherals'], state.config.peripherals));
      state.serviceDeskChecklistGroups = normalizeChecklist(pick(serviceDesk, ['checklist'], state.config.checklist), FALLBACK_CHECKLIST);
      state.infraChecklistGroups = normalizeChecklist(pick(infra, ['checklist'], state.config.infraChecklist || FALLBACK_INFRA_CHECKLIST), FALLBACK_INFRA_CHECKLIST);
      state.checklistGroups = isInfraSection() ? state.infraChecklistGroups : state.serviceDeskChecklistGroups;
      state.infraAssetTypes = normalizeStringOptions(pick(infra, ['assetTypes', 'types'], state.config.infraAssetTypes), FALLBACK_INFRA_ASSET_TYPES);
      state.evidenceConfig = normalizeEvidenceConfig(pick(infra, ['evidence'], state.config.evidence));
      state.assets = normalizeAssets(state.bootstrap.assets);
      state.assetMap = new Map();
      state.assets.forEach(function (asset) { state.assetMap.set(asset.tag, asset); });
      resetFormData();
      applyQuestionnaireMode();
      renderRegistrationOptions();
      renderLegacyImportOptions();
      renderTicketSectionOptions();
      renderAssetOptions();
      renderPeripheralSchema();
      renderChecklistSchema();
      renderEvidenceUI();
    }

    /**
     * The tickets dialog's IT-section filter, populated from the configured
     * sections rather than from whichever sections happen to appear in the
     * current query's results. The previous approach derived options from
     * payload.filters.sections (only sections a ticket in the current result
     * set actually belongs to) and hid the whole control below two sections —
     * so with tickets concentrated in one section so far, the filter was
     * either missing every other section or hidden outright. Tickets are
     * visible across sections by default (TICKET_VISIBILITY), so the filter
     * should always offer every section regardless of today's ticket mix.
     */
    function renderTicketSectionOptions() {
      var select = byId('tickets-section');
      if (!select) return;
      fillSelect(select, 'All sections', state.sections.map(function (section) {
        return { value: section.key, label: section.label };
      }));
    }

    function applyBootstrap(data) {
      state.bootstrap = data || {};
      state.user = state.bootstrap.user || {};
      state.profile = state.bootstrap.profile || {};
      state.config = state.bootstrap.config || {};
      if (!userEmail()) {
        // The server guarantees a non-empty email or throws, so reaching this
        // point means the response was truncated or reshaped in transit. Report
        // what actually arrived instead of blaming Google sign-in.
        var topKeys = Object.keys(state.bootstrap || {}).join(', ') || '(empty)';
        var userKeys = Object.keys(state.user || {}).join(', ') || '(empty)';
        throw clientError(
          'PMS loaded but the response carried no account email. Response fields: [' + topKeys + ']. ' +
            'User fields: [' + userKeys + ']. Run PMS_diagnoseSignIn in the Apps Script editor and share the output.',
          'BOOTSTRAP_INCOMPLETE'
        );
      }
      initializeSchema();
      renderIdentity();
      byId('boot-screen').hidden = true;
      byId('fatal-state').hidden = true;

      var registered = state.bootstrap.registered === true || Boolean(sectionKey());
      if (!registered) {
        byId('topbar').hidden = true;
        byId('dashboard-view').hidden = true;
        byId('register-view').hidden = false;
        window.setTimeout(function () { byId('register-name').focus(); }, 0);
        return;
      }

      byId('register-view').hidden = true;
      byId('topbar').hidden = false;
      byId('dashboard-view').hidden = false;
      renderDashboard();
    }

    function loadBootstrap(options) {
      var settings = options || {};
      if (!settings.silent) {
        byId('boot-screen').hidden = false;
        byId('boot-screen').setAttribute('aria-busy', 'true');
        byId('fatal-state').hidden = true;
      }
      return serverCall('PMS_apiBootstrap')
        .then(function (data) {
          applyBootstrap(data);
          return data;
        })
        .catch(function (error) {
          if (settings.silent) {
            showToast('Refresh failed', errorMessage(error), 'danger');
          } else {
            showFatal(error);
          }
          throw error;
        });
    }

    function renderRegistrationOptions() {
      var select = byId('register-section');
      while (select.options.length > 1) select.remove(1);
      state.sections.forEach(function (section) {
        var option = document.createElement('option');
        option.value = section.key;
        option.textContent = section.label;
        select.appendChild(option);
      });
      byId('register-name').value = userName();
      byId('register-email').value = userEmail();
    }

    function renderIdentity() {
      var name = userName() || 'YDC technician';
      var email = userEmail();
      var currentSection = sectionLabel(sectionKey());
      byId('header-name').textContent = name;
      byId('header-email').textContent = email;
      byId('header-avatar').textContent = initials(name, email);
      byId('header-section').textContent = currentSection;
      byId('header-section').hidden = !sectionKey();
      byId('user-summary').hidden = false;
      byId('form-technician-name').textContent = name;
      byId('form-technician-email').textContent = email;
      byId('form-technician-section').textContent = currentSection || '—';
    }

    function onRegister(event) {
      event.preventDefault();
      var displayName = normalizeText(byId('register-name').value).replace(/\s+/g, ' ');
      var section = byId('register-section').value;
      clearFieldError('register-name', 'register-name-error');
      clearFieldError('register-section', 'register-error');
      if (!displayName) {
        setFieldError('register-name', 'register-name-error', 'Enter the name that should appear on your PMS records.');
        byId('register-name').focus();
        return;
      }
      if (displayName.length > 120) {
        setFieldError('register-name', 'register-name-error', 'Display name must be 120 characters or fewer.');
        byId('register-name').focus();
        return;
      }
      if (!section || !state.sections.some(function (item) { return item.key === section; })) {
        setFieldError('register-section', 'register-error', 'Select your assigned IT section.');
        byId('register-section').focus();
        return;
      }
      byId('register-name').value = displayName;
      setBusy(true, 'Saving your profile…');
      serverCall('PMS_apiRegister', { displayName: displayName, section: section })
        .then(function () { return loadBootstrap({ silent: true }); })
        .then(function () {
          showToast('Workspace ready', 'Your profile has been saved. Future visits will open your dashboard automatically.', 'success');
          byId('main-content').focus();
        })
        .catch(function (error) {
          var fatalCodes = [
            'IDENTITY_UNAVAILABLE', 'ACCESS_NOT_PROVISIONED', 'ACCOUNT_DISABLED',
            'ACCESS_DENIED', 'BOOTSTRAP_INCOMPLETE'
          ];
          if (fatalCodes.indexOf(errorCode(error)) >= 0) {
            showFatal(error);
            return;
          }
          var targetName = /name/i.test(errorMessage(error));
          setFieldError(targetName ? 'register-name' : 'register-section', targetName ? 'register-name-error' : 'register-error', errorMessage(error));
        })
        .finally(function () { setBusy(false); });
    }

    function currentManilaDate() {
      try {
        var parts = new Intl.DateTimeFormat('en-CA', {
          timeZone: 'Asia/Manila',
          year: 'numeric',
          month: '2-digit',
          day: '2-digit'
        }).formatToParts(new Date());
        var values = {};
        parts.forEach(function (part) { values[part.type] = part.value; });
        return values.year + '-' + values.month + '-' + values.day;
      } catch (ignore) {
        var now = new Date();
        return now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
      }
    }

    function parseDateParts(value) {
      var match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(normalizeText(value));
      if (!match) return null;
      var year = Number(match[1]);
      var month = Number(match[2]);
      var day = Number(match[3]);
      var test = new Date(Date.UTC(year, month - 1, day));
      if (test.getUTCFullYear() !== year || test.getUTCMonth() !== month - 1 || test.getUTCDate() !== day) return null;
      return { year: year, month: month, day: day };
    }

    function deriveCycle(value) {
      var parts = parseDateParts(value);
      if (!parts) return null;
      var cycle;
      var startMonth;
      var endMonth;
      var endDay;
      if (parts.month <= 4) {
        cycle = 'T1'; startMonth = 1; endMonth = 4; endDay = 30;
      } else if (parts.month <= 8) {
        cycle = 'T2'; startMonth = 5; endMonth = 8; endDay = 31;
      } else {
        cycle = 'T3'; startMonth = 9; endMonth = 12; endDay = 31;
      }
      return {
        year: parts.year,
        cycle: cycle,
        cycleId: parts.year + '-' + cycle,
        start: parts.year + '-' + String(startMonth).padStart(2, '0') + '-01',
        deadline: parts.year + '-' + String(endMonth).padStart(2, '0') + '-' + String(endDay).padStart(2, '0')
      };
    }

    function formatDate(value, options) {
      var parts = parseDateParts(value);
      if (!parts) return normalizeText(value) || '—';
      var date = new Date(Date.UTC(parts.year, parts.month - 1, parts.day, 12));
      return new Intl.DateTimeFormat('en-US', options || { year: 'numeric', month: 'short', day: 'numeric' }).format(date);
    }

    function dayDifference(from, to) {
      var a = parseDateParts(from);
      var b = parseDateParts(to);
      if (!a || !b) return null;
      return Math.ceil((Date.UTC(b.year, b.month - 1, b.day) - Date.UTC(a.year, a.month - 1, a.day)) / 86400000);
    }

    function renderDashboard() {
      var metrics = state.bootstrap.metrics || {};
      var summary = metrics.summary || metrics.current || metrics;
      var today = currentManilaDate();
      var derived = deriveCycle(today);
      var cycle = normalizeText(pick(summary, ['cycle', 'currentCycle'], pick(metrics, ['cycle', 'currentCycle'], derived.cycle)));
      var year = asNumber(pick(summary, ['year', 'maintenanceYear', 'currentYear'], pick(metrics, ['year', 'currentYear'], derived.year)), derived.year);
      var deadline = normalizeText(pick(summary, ['deadline', 'cycleDeadline'], pick(metrics, ['deadline', 'cycleDeadline'], deriveCycle(year + (cycle === 'T1' ? '-01-01' : cycle === 'T2' ? '-05-01' : '-09-01')).deadline)));
      var daysRemaining = pick(summary, ['daysRemaining', 'daysToDeadline'], null);
      if (daysRemaining === null || daysRemaining === undefined) daysRemaining = dayDifference(today, deadline);

      var eligible = asNumber(pick(summary, ['eligible', 'eligibleAssets', 'totalEligible'], state.assets.length), state.assets.length);
      var completed = asNumber(pick(summary, ['completed', 'completedAssets', 'totalCompleted'], 0), 0);
      var pending = asNumber(pick(summary, ['pending', 'pendingAssets', 'totalPending'], Math.max(eligible - completed, 0)), 0);
      var complianceValue = pick(summary, ['compliance', 'compliancePct', 'compliancePercent', 'percentage'], eligible ? completed / eligible * 100 : null);
      var compliance = complianceValue === null ? null : Math.max(0, Math.min(100, Math.round(asNumber(complianceValue, 0) * 10) / 10));

      byId('dashboard-eyebrow').textContent = sectionLabel(sectionKey()) || 'PMS workspace';
      byId('dashboard-title').textContent = 'Maintenance overview';
      byId('dashboard-welcome').textContent = 'Welcome back, ' + (userName() || 'technician') + '. Track this cycle’s preventive maintenance coverage.';
      var hasOpenAsset = hasAnyOpenAssetCycle();
      [byId('new-record-button'), byId('empty-new-record')].forEach(function (button) {
        button.disabled = !hasOpenAsset;
        button.title = hasOpenAsset ? 'Open the preventive maintenance questionnaire' : 'No INPROD assets are available in your IT section';
      });
      // Legacy import is open to every registered user, scoped to their own
      // section and the currently open tracker year unless they are an admin.
      byId('open-legacy-import').hidden = false;
      byId('cycle-badge').textContent = cycle;
      byId('cycle-banner-title').textContent = year + ' ' + cycle + ' preventive maintenance';
      byId('cycle-date-range').textContent = formatDate(deriveCycle(year + (cycle === 'T1' ? '-01-01' : cycle === 'T2' ? '-05-01' : '-09-01')).start, { month: 'long', day: 'numeric' }) + ' – ' + formatDate(deadline, { month: 'long', day: 'numeric', year: 'numeric' });
      byId('cycle-days').textContent = daysRemaining === null ? '—' : String(Math.abs(daysRemaining));
      byId('cycle-days-label').textContent = daysRemaining !== null && daysRemaining < 0 ? 'days overdue' : daysRemaining === 1 ? 'day remaining' : 'days remaining';
      byId('header-cycle').textContent = year + ' ' + cycle;
      byId('header-cycle').hidden = false;
      byId('cycle-banner-eyebrow').textContent = (year === derived.year && cycle === derived.cycle)
        ? 'Current PMS cycle'
        : 'Viewing PMS cycle';
      renderDashboardCycleOptions(metrics.cycleOptions, year + '-' + cycle);

      byId('metric-eligible').textContent = formatNumber(eligible);
      byId('metric-completed').textContent = formatNumber(completed);
      byId('metric-pending').textContent = formatNumber(pending);
      byId('metric-compliance').textContent = compliance === null ? 'N/A' : formatPercent(compliance);
      byId('metric-findings').textContent = formatNumber(pick(summary, ['withFindings', 'findings', 'assetsWithFindings'], 0));
      byId('metric-follow-up').textContent = formatNumber(pick(summary, ['followUpRequired', 'followUp', 'requiresFollowUp'], 0));
      byId('metric-pms-not-performed').textContent = formatNumber(pick(summary, ['pmsNotPerformed'], 0));
      byId('metric-mine').textContent = formatNumber(pick(summary, ['myCompleted', 'completedByMe', 'technicianCompleted'], 0));
      byId('pending-detail').textContent = daysRemaining !== null && daysRemaining < 0 && pending > 0 ? 'Overdue assets' : 'Assets remaining';
      byId('coverage-ratio').textContent = completed + ' of ' + eligible + ' eligible assets';
      byId('coverage-percent').textContent = compliance === null ? 'N/A' : formatPercent(compliance);
      setProgress(byId('coverage-progress'), byId('coverage-progress-fill'), compliance || 0);

      renderLocations(pick(summary, ['completionByLocation', 'byLocation', 'locations'], pick(metrics, ['completionByLocation', 'byLocation', 'locations'], [])));
      renderRecent(state.bootstrap.recentRecords || []);
      renderRollover(state.bootstrap.rollover || null);
      // The server defers rollover status because it is expensive. Fetch it once
      // the dashboard is on screen so it never delays first paint.
      if (state.bootstrap.rolloverDeferred && userIsAdmin()) loadRolloverStatus();
      renderDangerZone();
      // Ticket counts are also deferred, for the same reason.
      loadTicketSummary();
      warmListCaches();
    }

    /**
     * Populates the dashboard's cycle filter from the metrics response.
     *
     * cycleOptions is discovered server-side from stored records, so it only
     * ever lists a cycle something actually happened in — plus the current
     * one, always, even with zero history. The currently displayed cycle is
     * added defensively if the metrics response predates this field.
     */
    function renderDashboardCycleOptions(options, selectedCycleId) {
      var select = byId('dashboard-cycle-select');
      if (!select) return;
      var list = toArray(options).slice();
      if (!list.some(function (item) { return item.cycleId === selectedCycleId; })) {
        var parts = /^(\d{4})-(T[123])$/.exec(selectedCycleId);
        if (parts) list = list.concat([{ year: Number(parts[1]), cycle: parts[2], cycleId: selectedCycleId }]);
      }
      select.replaceChildren();
      list.forEach(function (item) {
        var option = document.createElement('option');
        option.value = item.cycleId;
        option.textContent = item.year + ' · ' + item.cycle;
        select.appendChild(option);
      });
      select.value = selectedCycleId;
    }

    /** Reloads dashboard metrics for the cycle chosen in the filter. */
    function changeDashboardCycle() {
      var match = /^(\d{4})-(T[123])$/.exec(byId('dashboard-cycle-select').value);
      if (!match) return;
      setBusy(true, 'Loading cycle…');
      serverCall('PMS_apiDashboard', {
        year: Number(match[1]),
        cycle: match[2],
        section: userIsAdmin() ? 'ALL' : sectionKey()
      })
        .then(function (data) {
          state.bootstrap.metrics = data.metrics;
          renderDashboard();
        })
        .catch(function (error) {
          showToast('Could not load cycle', errorMessage(error), 'danger');
        })
        .finally(function () { setBusy(false); });
    }

    /* ------------------------------------------------------------------------
       List caches

       Both dialogs page, sort, filter and search server-side, so every one of
       those actions used to be a round trip that ended in a spreadsheet read.
       The server now caches its own projection, but the round trip itself still
       costs the best part of a second, and going back to a page you just looked
       at should not cost anything at all.

       Payloads are held per request signature: change anything about the request
       and it is a different entry. Nothing is served beyond LIST_CACHE_TTL, and
       any write clears the lot, so a stale page cannot outlive the thing it
       describes.
       ------------------------------------------------------------------------ */

    var LIST_CACHE_TTL = 45000;

    function listCacheKey(request) {
      var source = request || {};
      // Built from sorted keys so two equivalent requests share one entry
      // regardless of the order the fields were assembled in.
      return Object.keys(source).sort().map(function (key) {
        return key + '=' + normalizeText(source[key]);
      }).join('&');
    }

    function readListCache(store, request) {
      var entry = store[listCacheKey(request)];
      if (!entry) return null;
      if (Date.now() - entry.at > LIST_CACHE_TTL) return null;
      return entry.payload;
    }

    function writeListCache(store, request, payload) {
      store[listCacheKey(request)] = { at: Date.now(), payload: payload };
    }

    /**
     * Forgets every cached page.
     *
     * Called after anything that writes, because a completed record or a moved
     * ticket changes rows, counts and totals across pages this cache cannot
     * reason about individually.
     */
    function clearListCaches() {
      state.archive.cache = {};
      state.tickets.cache = {};
    }

    /**
     * Fetches the first page of both dialogs in the background.
     *
     * Deliberately after the dashboard has painted and behind a delay: it is the
     * difference between a dialog that opens instantly and one that opens on a
     * spinner, but it must never be the reason first paint was slow. Failures are
     * swallowed whole; nothing on screen depends on this.
     */
    function warmListCaches() {
      if (state.listsWarmed) return;
      state.listsWarmed = true;
      window.setTimeout(function () {
        loadCompletedRecords({ page: 1 }, { silent: true }).catch(function () {});
        window.setTimeout(function () {
          loadTickets({ page: 1 }, { silent: true }).catch(function () {});
        }, 400);
      }, 900);
    }

    function loadRolloverStatus() {
      if (state.rolloverLoading) return;
      state.rolloverLoading = true;
      serverCall('PMS_apiRolloverStatus')
        .then(function (data) {
          renderRollover((data && data.rollover) || null);
        })
        .catch(function (error) {
          byId('sync-recovery-title').textContent = 'Synchronization status unavailable';
          byId('sync-recovery-detail').textContent = errorMessage(error);
          byId('sync-status-chip').textContent = 'Unknown';
        })
        .finally(function () { state.rolloverLoading = false; });
    }

    function formatNumber(value) {
      return new Intl.NumberFormat('en-US').format(asNumber(value, 0));
    }

    function formatPercent(value) {
      var number = Math.round(asNumber(value, 0) * 10) / 10;
      return number.toLocaleString('en-US', { maximumFractionDigits: 1 }) + '%';
    }

    function setProgress(container, fill, value) {
      var percent = clampPercent(value);
      container.setAttribute('aria-valuenow', String(percent));
      fill.style.width = percent + '%';
      fill.classList.toggle('is-complete', percent === 100);
    }

    function renderLocations(value) {
      var locations = value;
      if (!Array.isArray(locations) && locations && typeof locations === 'object') {
        locations = Object.keys(locations).map(function (name) {
          var entry = locations[name];
          return typeof entry === 'number' ? { location: name, completed: entry } : Object.assign({ location: name }, entry);
        });
      }
      locations = toArray(locations);
      var list = byId('location-list');
      list.replaceChildren();
      byId('location-empty').hidden = locations.length !== 0;
      byId('location-count').textContent = locations.length ? locations.length + (locations.length === 1 ? ' location' : ' locations') : '';

      locations.slice(0, 10).forEach(function (entry) {
        var eligible = asNumber(pick(entry, ['eligible', 'total'], 0), 0);
        var completed = asNumber(pick(entry, ['completed', 'done'], 0), 0);
        var percent = clampPercent(pick(entry, ['compliance', 'percent', 'percentage'], eligible ? completed / eligible * 100 : 0));
        var row = document.createElement('div');
        row.className = 'location-row';
        var top = document.createElement('div');
        top.className = 'location-row__top';
        var name = document.createElement('span');
        name.className = 'location-row__name';
        name.textContent = normalizeText(pick(entry, ['location', 'name', 'label'], 'Unspecified')) || 'Unspecified';
        var count = document.createElement('span');
        count.className = 'location-row__count';
        count.textContent = completed + ' / ' + eligible + ' · ' + percent + '%';
        top.appendChild(name);
        top.appendChild(count);
        var progress = document.createElement('div');
        progress.className = 'progress-track';
        progress.setAttribute('role', 'progressbar');
        progress.setAttribute('aria-label', name.textContent + ' completion');
        progress.setAttribute('aria-valuemin', '0');
        progress.setAttribute('aria-valuemax', '100');
        progress.setAttribute('aria-valuenow', String(percent));
        var fill = document.createElement('span');
        fill.className = 'progress-fill';
        fill.style.width = percent + '%';
        if (percent === 100) fill.classList.add('is-complete');
        progress.appendChild(fill);
        row.appendChild(top);
        row.appendChild(progress);
        list.appendChild(row);
      });
    }

    function completionDecision(value) {
      var text = normalizeText(value).toUpperCase();
      var percentMatch = text.match(/(\d{1,3})%/);
      var percent = percentMatch ? percentMatch[1] + '% · ' : '';
      var decision;
      if (text.indexOf('SYNC REQUIRED') >= 0) decision = { label: 'SYNC REQUIRED', className: 'status-chip--warning' };
      else if (text.indexOf('SYNC FAILED') >= 0) decision = { label: 'SYNC FAILED', className: 'status-chip--danger' };
      else if (text.indexOf('COMPLETED') >= 0 && text.indexOf('INCOMPLETE') < 0) decision = { label: 'COMPLETED', className: 'status-chip--success' };
      else if (text.indexOf('SYNCING') >= 0) decision = { label: 'SYNCING', className: 'status-chip--info' };
      else decision = { label: 'INCOMPLETE', className: 'status-chip--warning' };
      decision.display = percent + decision.label;
      return decision;
    }

    function renderRecent(records) {
      var rows = toArray(records);
      var body = byId('recent-records-body');
      body.replaceChildren();
      byId('recent-table-wrap').hidden = rows.length === 0;
      byId('recent-empty').hidden = rows.length !== 0;

      rows.forEach(function (record) {
        var id = normalizeText(pick(record, ['recordId', 'id'], ''));
        var maintenanceDate = normalizeText(pick(record, ['maintenanceDate', 'performedOn', 'date'], ''));
        var assetTag = normalizeText(pick(record, ['assetTag', 'asset'], ''));
        var result = normalizeText(pick(record, ['assessmentResult', 'result'], '')) || 'Not assessed';
        var completionText = normalizeText(pick(record, ['pmsCompletion', 'completion', 'status'], 'INCOMPLETE'));
        var decision = completionDecision(completionText);
        var row = document.createElement('tr');

        var idCell = labelledCell('Record');
        var idStrong = document.createElement('strong');
        idStrong.textContent = id || '—';
        idCell.appendChild(idStrong);

        var dateCell = labelledCell('Performed on');
        dateCell.textContent = formatDate(maintenanceDate);
        var assetCell = labelledCell('Asset tag');
        var assetStrong = document.createElement('strong');
        assetStrong.textContent = assetTag || '—';
        assetCell.appendChild(assetStrong);
        var resultCell = labelledCell('Assessment');
        resultCell.textContent = result;
        var statusCell = labelledCell('PMS completion');
        var chip = document.createElement('span');
        chip.className = 'status-chip ' + decision.className;
        chip.textContent = decision.display;
        chip.title = completionText;
        statusCell.appendChild(chip);
        var actionCell = labelledCell('');
        var editable = record.editable !== undefined ? Boolean(record.editable) : decision.label === 'INCOMPLETE';
        if (id && editable) {
          var action = document.createElement('button');
          action.className = 'table-action';
          action.type = 'button';
          action.textContent = decision.label === 'INCOMPLETE' ? 'Resume' : 'Open';
          action.dataset.recordId = id;
          action.addEventListener('click', function () { openExistingRecord(id); });
          actionCell.appendChild(action);
        }

        row.appendChild(idCell);
        row.appendChild(dateCell);
        row.appendChild(assetCell);
        row.appendChild(resultCell);
        row.appendChild(statusCell);
        row.appendChild(actionCell);
        body.appendChild(row);
      });
    }

    /* ------------------------------------------------------------------------
       Completed maintenance archive.

       Server-paged rather than loaded whole: an administrator's archive grows
       without bound, and the bootstrap payload has already proven to be the
       size-sensitive part of this app.
       ------------------------------------------------------------------------ */

    var ARCHIVE_DIRECTION_LABELS = {
      maintenanceDate: ['Oldest first', 'Newest first'],
      submittedAt: ['Oldest first', 'Newest first'],
      assetTag: ['A to Z', 'Z to A'],
      location: ['A to Z', 'Z to A'],
      cycleId: ['Oldest first', 'Newest first'],
      technicianName: ['A to Z', 'Z to A'],
      assessmentResult: ['A to Z', 'Z to A']
    };

    function openArchiveModal() {
      if (state.archive.open || state.modalOpen || state.legacyImport.open) return;
      state.archive.lastFocus = document.activeElement;
      state.archive.open = true;
      byId('archive-modal').hidden = false;
      syncBodyModalState();
      loadCompletedRecords({ page: 1 }).catch(function () {});
      window.setTimeout(function () { byId('archive-search').focus(); }, 0);
    }

    function closeArchiveModal() {
      if (!state.archive.open) return;
      state.archive.open = false;
      byId('archive-modal').hidden = true;
      syncBodyModalState();
      var target = state.archive.lastFocus;
      if (target && typeof target.focus === 'function') target.focus();
    }

    function trapArchiveFocus(event) {
      // The questionnaire owns the keyboard whenever it is layered on top.
      if (!state.archive.open || state.modalOpen || state.legacyImport.open) return;
      if (event.key === 'Escape') {
        event.preventDefault();
        closeArchiveModal();
        return;
      }
      if (event.key !== 'Tab') return;
      var focusable = Array.prototype.slice.call(byId('archive-modal').querySelectorAll(
        'button:not([disabled]), input:not([disabled]), select:not([disabled]), [href], [tabindex]:not([tabindex="-1"])'
      )).filter(function (element) { return !element.hidden && element.offsetParent !== null; });
      if (!focusable.length) return;
      var first = focusable[0];
      var last = focusable[focusable.length - 1];
      if (event.shiftKey && document.activeElement === first) {
        event.preventDefault();
        last.focus();
      } else if (!event.shiftKey && document.activeElement === last) {
        event.preventDefault();
        first.focus();
      }
    }

    function archiveRequest(overrides) {
      var request = {
        page: state.archive.page,
        pageSize: byId('archive-page-size').value,
        sort: byId('archive-sort').value,
        direction: state.archive.direction,
        search: byId('archive-search').value,
        year: byId('archive-year').value,
        cycle: byId('archive-cycle').value,
        section: byId('archive-section').value
      };
      return Object.assign(request, overrides || {});
    }

    function jumpToArchivePage() {
      var input = byId('archive-page-input');
      var requested = Math.round(asNumber(input.value, state.archive.page));
      var target = Math.max(1, Math.min(state.archive.totalPages, requested));
      input.value = String(target);
      if (target === state.archive.page) return;
      loadCompletedRecords({ page: target });
    }

    function renderArchiveDirection() {
      var labels = ARCHIVE_DIRECTION_LABELS[byId('archive-sort').value] || ['Ascending', 'Descending'];
      var ascending = state.archive.direction === 'ASC';
      byId('archive-direction-label').textContent = ascending ? labels[0] : labels[1];
      byId('archive-direction').setAttribute('aria-pressed', ascending ? 'true' : 'false');
      var use = byId('archive-direction').querySelector('use');
      if (use) use.setAttribute('href', ascending ? '#i-arrow-up' : '#i-arrow-down');
    }

    function setArchiveBusy(isBusy) {
      byId('archive-loading').hidden = !isBusy;
      if (isBusy) {
        byId('archive-table-wrap').hidden = true;
        byId('archive-empty').hidden = true;
      }
      ['archive-prev', 'archive-next', 'archive-refresh', 'archive-page-input'].forEach(function (id) {
        byId(id).disabled = isBusy;
      });
    }

    /**
     * Loads a page of completed records.
     *
     * options.silent fetches into the cache without touching the screen, which is
     * what the background warm-up uses. options.refresh skips both caches, this
     * one and the server's, which is what the Refresh button is for.
     */
    function loadCompletedRecords(overrides, options) {
      var settings = options || {};
      var request = archiveRequest(overrides);
      if (settings.refresh) request.refresh = true;
      state.archive.page = asNumber(request.page, 1) || 1;

      if (!settings.refresh) {
        var cached = readListCache(state.archive.cache, request);
        if (cached) {
          // A cache hit must still count as the newest request, or a slower
          // response already in flight would overwrite it when it lands.
          state.archive.token += 1;
          if (!settings.silent) renderCompletedRecords(cached);
          return Promise.resolve(cached);
        }
      }

      state.archive.token += 1;
      var token = state.archive.token;
      if (!settings.silent) setArchiveBusy(true);
      return serverCall('PMS_apiCompletedRecords', request)
        .then(function (data) {
          // Cached even when superseded: the response is still a true answer to
          // the request that asked for it, and the user may come back to it.
          writeListCache(state.archive.cache, request, data);
          // Ignore a slower in-flight response that a newer request superseded.
          if (settings.silent || token !== state.archive.token) return data;
          renderCompletedRecords(data);
          return data;
        })
        .catch(function (error) {
          // A background warm-up says nothing on screen, and a superseded
          // response is not this request's business. Neither rejects: most
          // callers are event handlers with nowhere to put a rejection.
          if (settings.silent) {
            console.warn('Completed records could not be pre-fetched: ' + errorMessage(error));
            return;
          }
          if (token !== state.archive.token) return;
          setArchiveBusy(false);
          byId('archive-empty').hidden = false;
          byId('archive-empty-title').textContent = 'Completed maintenance could not be loaded';
          byId('archive-empty-message').textContent = errorMessage(error);
          showToast('Completed list failed', errorMessage(error), 'danger');
        });
    }

    function syncArchiveOptions(filters, isAdmin) {
      var options = filters || {};
      fillSelect(byId('archive-year'), 'All years', toArray(options.years).map(function (year) {
        return { value: String(year), label: String(year) };
      }));
      fillSelect(byId('archive-cycle'), 'All cycles', toArray(options.cycles).map(function (cycle) {
        return { value: cycle, label: cycle };
      }));
      byId('archive-section-wrap').hidden = !isAdmin;
      if (isAdmin) {
        fillSelect(byId('archive-section'), 'All sections', toArray(options.sections).map(function (key) {
          return { value: key, label: sectionLabel(key) };
        }));
      }
    }

    /** Repopulates a select while preserving the current selection if still valid. */
    function fillSelect(select, allLabel, items) {
      var previous = select.value;
      select.replaceChildren();
      var all = document.createElement('option');
      all.value = '';
      all.textContent = allLabel;
      select.appendChild(all);
      items.forEach(function (item) {
        var option = document.createElement('option');
        option.value = item.value;
        option.textContent = item.label;
        select.appendChild(option);
      });
      select.value = items.some(function (item) { return item.value === previous; }) ? previous : '';
    }

    function renderCompletedRecords(data) {
      var payload = data || {};
      var rows = toArray(payload.rows);
      var isAdmin = payload.scope === 'ALL_SECTIONS';
      state.archive.page = asNumber(payload.page, 1) || 1;
      state.archive.totalPages = asNumber(payload.totalPages, 1) || 1;

      setArchiveBusy(false);
      syncArchiveOptions(payload.filters, isAdmin);

      byId('archive-eyebrow').textContent = isAdmin ? 'Completed maintenance · all sections' : 'Completed maintenance · your records';
      byId('archive-title').textContent = isAdmin ? 'Completed assets' : 'Assets you have maintained';
      byId('archive-sort-technician').hidden = !isAdmin;
      if (!isAdmin && byId('archive-sort').value === 'technicianName') {
        byId('archive-sort').value = 'maintenanceDate';
      }
      if (normalizeText(payload.sort)) byId('archive-sort').value = payload.sort;
      state.archive.direction = payload.direction === 'ASC' ? 'ASC' : 'DESC';
      renderArchiveDirection();
      byId('archive-summary').textContent = payload.totalInScope
        ? (formatNumber(payload.total) + ' completed record' + (payload.total === 1 ? '' : 's') +
           ' · ' + formatNumber(payload.uniqueAssets) + ' unique asset' + (payload.uniqueAssets === 1 ? '' : 's') +
           (payload.total !== payload.totalInScope ? ' (filtered from ' + formatNumber(payload.totalInScope) + ')' : ''))
        : (isAdmin ? 'No maintenance has been completed yet.' : 'You have not completed any maintenance yet.');

      document.querySelectorAll('.archive-col-technician').forEach(function (cell) {
        cell.hidden = !isAdmin;
      });

      var body = byId('archive-body');
      body.replaceChildren();
      rows.forEach(function (record) {
        body.appendChild(archiveRow(record, isAdmin));
      });

      var hasRows = rows.length > 0;
      byId('archive-table-wrap').hidden = !hasRows;
      byId('archive-empty').hidden = hasRows;

      if (!hasRows) {
        var filtered = Boolean(payload.totalInScope);
        byId('archive-empty-title').textContent = filtered ? 'No matches' : 'No completed maintenance yet';
        byId('archive-empty-message').textContent = filtered
          ? 'No completed record matches the current search or filters.'
          : (isAdmin
            ? 'Completed records will be listed here once technicians finish maintenance.'
            : 'Records you complete will be listed here.');
      }

      var showingAll = payload.pageSizeMode === 'ALL';
      byId('archive-range').textContent = payload.total
        ? ('Showing ' + formatNumber(payload.rangeStart) + '–' + formatNumber(payload.rangeEnd) +
           ' of ' + formatNumber(payload.total) +
           (showingAll ? '' : ' · page ' + state.archive.page + ' of ' + state.archive.totalPages))
        : 'No records to show';

      var truncated = Boolean(payload.truncated);
      byId('archive-truncated').hidden = !truncated;
      if (truncated) {
        byId('archive-truncated').textContent = 'Showing the first ' + formatNumber(payload.cap) +
          ' records. Narrow the search or use a page size to see the rest.';
      }

      // With "All" selected there is a single page, so paging controls are noise.
      byId('archive-jump').hidden = showingAll || state.archive.totalPages <= 1;
      byId('archive-prev').hidden = showingAll;
      byId('archive-next').hidden = showingAll;
      byId('archive-prev').disabled = state.archive.page <= 1;
      byId('archive-next').disabled = state.archive.page >= state.archive.totalPages;
      byId('archive-page-input').max = String(state.archive.totalPages);
      byId('archive-page-input').value = String(state.archive.page);
      byId('archive-page-total').textContent = 'of ' + formatNumber(state.archive.totalPages);
    }

    function archiveRow(record, isAdmin) {
      var row = document.createElement('tr');

      var assetCell = labelledCell('Asset tag');
      var assetWrap = document.createElement('div');
      assetWrap.className = 'archive-asset';
      var tag = document.createElement('strong');
      tag.textContent = normalizeText(record.assetTag) || '—';
      assetWrap.appendChild(tag);
      var id = normalizeText(record.recordId);
      if (id) {
        var small = document.createElement('small');
        small.textContent = id;
        assetWrap.appendChild(small);
      }
      assetCell.appendChild(assetWrap);

      var locationCell = labelledCell('Location');
      locationCell.textContent = normalizeText(record.location) || 'Not recorded';
      if (record.locationDiscrepancy) {
        var flag = document.createElement('span');
        flag.className = 'location-flag';
        flag.title = 'Observed location differed from the asset master';
        flag.appendChild(iconSvg('alert-triangle'));
        locationCell.appendChild(flag);
      }

      var dateCell = labelledCell('Performed on');
      dateCell.textContent = formatDate(record.maintenanceDate);

      var cycleCell = labelledCell('Cycle');
      var cycleChip = document.createElement('span');
      cycleChip.className = 'status-chip status-chip--neutral';
      cycleChip.textContent = normalizeText(record.cycleId) || '—';
      cycleCell.appendChild(cycleChip);

      var technicianCell = labelledCell('Technician');
      technicianCell.className = 'archive-col-technician';
      technicianCell.hidden = !isAdmin;
      if (isAdmin) {
        var technician = document.createElement('div');
        technician.className = 'archive-asset';
        var name = document.createElement('span');
        name.textContent = normalizeText(record.technicianName) || '—';
        technician.appendChild(name);
        var section = document.createElement('small');
        section.textContent = sectionLabel(normalizeText(record.section));
        technician.appendChild(section);
        technicianCell.appendChild(technician);
      }

      var resultCell = labelledCell('Assessment');
      resultCell.className = 'archive-col-assessment';
      var resultWrap = document.createElement('div');
      resultWrap.className = 'assessment-cell';
      resultWrap.appendChild(assessmentTag(record.assessmentResult));
      // Tickets belong next to the assessment that found them: the row reads
      // "Follow-up required" and then says what is tracking it. Closed ones are
      // included, because a repair that was completed is the answer to "what
      // happened about this" rather than something to hide.
      var assetTickets = toArray(record.assetTickets);
      if (assetTickets.length) {
        resultWrap.appendChild(ticketLinkList(assetTickets, asNumber(record.totalTicketCount, assetTickets.length)));
      }
      resultCell.appendChild(resultWrap);

      var openTicketCount = asNumber(record.openTicketCount, 0);
      var actionCell = labelledCell('');
      var actions = document.createElement('div');
      actions.className = 'table-actions';
      // The server refuses to open another technician's record, including for
      // administrators, so only offer the action where it will succeed.
      var ownRecord = normalizeText(record.technicianEmail).toLowerCase() === userEmail().toLowerCase();
      if (id && ownRecord) {
        var open = document.createElement('button');
        open.className = 'table-action';
        open.type = 'button';
        open.textContent = 'View';
        open.addEventListener('click', function () {
          // Close the archive first so the two dialogs never stack.
          closeArchiveModal();
          openExistingRecord(id);
        });
        actions.appendChild(open);
      }
      // Anything other than a clean "No findings" result is a candidate for a
      // repair ticket, so the action is offered right where findings are read.
      // Where one is already open the wording changes rather than disappearing:
      // a second, unrelated fault on the same asset is still worth filing.
      if (id && recordHasFindings(record.assessmentResult)) {
        var fileTicket = document.createElement('button');
        fileTicket.className = 'table-action table-action--accent';
        fileTicket.type = 'button';
        fileTicket.textContent = openTicketCount ? 'File another' : 'File ticket';
        fileTicket.title = openTicketCount
          ? normalizeText(record.assetTag) + ' already has an open ticket. File a second one only for a different fault.'
          : 'Open a findings ticket for ' + normalizeText(record.assetTag);
        fileTicket.addEventListener('click', function () { fileTicketFromRecord(record); });
        actions.appendChild(fileTicket);
      }
      actionCell.appendChild(actions);

      [assetCell, locationCell, dateCell, cycleCell, technicianCell, resultCell, actionCell]
        .forEach(function (cell) { row.appendChild(cell); });
      return row;
    }

    /*
      How an assessment result reads as a colour. Keyed on the configured
      wording, with anything unrecognised falling through to neutral rather than
      guessing, so a result added to the config later is merely uncoloured
      instead of miscoloured.
    */
    var ASSESSMENT_TONE = {
      'NO FINDINGS': 'assessment-tag--clear',
      'FINDINGS RESOLVED': 'assessment-tag--resolved',
      'FOLLOW-UP REQUIRED': 'assessment-tag--followup',
      'PMS NOT PERFORMED': 'assessment-tag--notperformed'
    };

    function assessmentTag(result) {
      var text = normalizeText(result);
      var tag = document.createElement('span');
      var tone = ASSESSMENT_TONE[text.toUpperCase()] || '';
      tag.className = 'assessment-tag' + (tone ? ' ' + tone : '');
      tag.textContent = text || 'Not assessed';
      return tag;
    }

    /**
     * Clickable chips for the tickets raised against one asset.
     *
     * Open ones are amber and come first; closed ones are green, because a
     * repair that was completed is good news rather than a warning. The total is
     * passed separately so the list can say what it is not showing: the server
     * caps how many tickets travel per row but always counts them all.
     */
    function ticketLinkList(tickets, total) {
      var list = document.createElement('div');
      list.className = 'ticket-links';
      var shown = toArray(tickets);
      shown.forEach(function (ticket) {
        var id = normalizeText(ticket.ticketId);
        if (!id) return;
        var status = normalizeText(ticket.statusLabel) || ticketLabel(ticket.status);
        var isOpen = ticket.isActive !== false;
        var chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'ticket-link ' + (isOpen ? 'ticket-link--open' : 'ticket-link--closed');
        chip.title = (normalizeText(ticket.summary) || id) + ' · ' + status +
          (isOpen ? '' : ' · no longer open');
        var label = document.createElement('span');
        label.className = 'ticket-link__id';
        label.textContent = id;
        chip.appendChild(label);
        var statusText = document.createElement('span');
        statusText.className = 'ticket-link__status';
        statusText.textContent = status;
        chip.appendChild(statusText);
        chip.addEventListener('click', function () { openTicketFromArchive(id); });
        list.appendChild(chip);
      });

      var hidden = asNumber(total, shown.length) - shown.length;
      if (hidden > 0) {
        var more = document.createElement('span');
        more.className = 'ticket-links__more';
        more.textContent = '+' + formatNumber(hidden) + ' more';
        more.title = 'Open the tickets list to see the rest of this asset\u2019s history.';
        list.appendChild(more);
      }
      return list;
    }

    /**
     * Jumps from a completed record to the ticket tracking its repair.
     *
     * The archive is closed first so the two dialogs never stack, and the tickets
     * dialog opens straight into the detail view rather than fetching a list
     * nobody asked for.
     */
    function openTicketFromArchive(ticketId) {
      var id = normalizeText(ticketId);
      if (!id) return;
      closeArchiveModal();
      if (!state.tickets.open) openTicketsModal('detail');
      openTicketDetail(id);
    }

    function recordHasFindings(assessmentResult) {
      var result = normalizeText(assessmentResult);
      if (!result) return false;
      return !/^no findings$/i.test(result);
    }

    /* ------------------------------------------------------------------------
       Findings tickets

       Server-paged like the archive. The list, a ticket's detail with its full
       change history, and the create form are three views inside one dialog
       rather than nested modals, so there is only ever one focus trap active.
       ------------------------------------------------------------------------ */

    var TICKET_STATUS_CHIP = {
      OPEN: 'status-chip--warning',
      IN_PROGRESS: 'status-chip--info',
      DEFERRED: 'status-chip--warning',
      ON_HOLD: 'status-chip--neutral',
      RESOLVED: 'status-chip--success',
      CANCELLED: 'status-chip--neutral'
    };
    // Open, On hold and Cancelled are retired. A ticket filed before that change
    // keeps its status and still shows under Needs attention or All.
    var TICKET_TABS = [
      { value: 'ACTIVE', label: 'Needs attention' },
      { value: 'IN_PROGRESS', label: 'In progress' },
      { value: 'DEFERRED', label: 'Deferred' },
      { value: 'RESOLVED', label: 'Closed' },
      { value: '', label: 'All' }
    ];
    var TICKET_DIRECTION_LABELS = {
      updatedAt: ['Oldest first', 'Newest first'],
      createdAt: ['Oldest first', 'Newest first'],
      status: ['A to Z', 'Z to A'],
      assetTag: ['A to Z', 'Z to A'],
      section: ['A to Z', 'Z to A'],
      ticketId: ['Oldest first', 'Newest first']
    };

    /*
      Statuses read the way the server labels them, so RESOLVED shows as "Closed"
      in one place rather than being special-cased everywhere. The map arrives
      with any ticket list or detail; the fallback covers a first paint.
    */
    /*
      Mirrors the server's STATUS_LABELS, retired statuses included. The server
      map normally arrives with a ticket list, but opening a ticket straight from
      a completed record skips the list, and without the retired entries here that
      path fell through to sentence case and read "On hold" where the same status
      reads "On Hold" everywhere else.
    */
    var TICKET_STATUS_LABELS = {
      IN_PROGRESS: 'In Progress',
      DEFERRED: 'Deferred',
      RESOLVED: 'Closed',
      OPEN: 'Open',
      ON_HOLD: 'On Hold',
      CANCELLED: 'Cancelled'
    };

    function ticketLabel(value) {
      var token = normalizeText(value).toUpperCase().replace(/[\s-]+/g, '_');
      var labels = state.tickets.statusLabels || {};
      if (labels[token]) return labels[token];
      if (TICKET_STATUS_LABELS[token]) return TICKET_STATUS_LABELS[token];
      var text = normalizeText(value).replace(/_/g, ' ').toLowerCase();
      return text ? text.charAt(0).toUpperCase() + text.slice(1) : '—';
    }

    function ticketChip(value, map, fallback) {
      var chip = document.createElement('span');
      chip.className = 'status-chip ' + (map[normalizeText(value).toUpperCase()] || fallback);
      chip.textContent = ticketLabel(value);
      return chip;
    }

    function openTicketsModal(view) {
      state.tickets.lastFocus = document.activeElement;
      state.tickets.open = true;
      byId('tickets-modal').hidden = false;
      syncBodyModalState();
      showTicketsView(view || 'list');
      if (!view || view === 'list') loadTickets({ page: 1 }).catch(function () {});
      window.setTimeout(function () {
        var target = state.tickets.view === 'list' ? byId('tickets-search') : byId('ticket-create-asset');
        if (target) target.focus();
      }, 0);
    }

    function closeTicketsModal() {
      if (!state.tickets.open) return;
      state.tickets.open = false;
      byId('tickets-modal').hidden = true;
      syncBodyModalState();
      var target = state.tickets.lastFocus;
      if (target && typeof target.focus === 'function') target.focus();
    }

    function trapTicketsFocus(event) {
      // The questionnaire owns the keyboard whenever it is layered on top.
      if (!state.tickets.open || state.modalOpen) return;
      if (event.key === 'Escape') {
        event.preventDefault();
        if (state.tickets.view === 'list') closeTicketsModal();
        else showTicketsView('list');
        return;
      }
      if (event.key !== 'Tab') return;
      var focusable = Array.prototype.slice.call(byId('tickets-modal').querySelectorAll(
        'button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [href], [tabindex]:not([tabindex="-1"])'
      )).filter(function (element) { return !element.hidden && element.offsetParent !== null; });
      if (!focusable.length) return;
      var first = focusable[0];
      var last = focusable[focusable.length - 1];
      if (event.shiftKey && document.activeElement === first) {
        event.preventDefault();
        last.focus();
      } else if (!event.shiftKey && document.activeElement === last) {
        event.preventDefault();
        first.focus();
      }
    }

    function showTicketsView(view) {
      state.tickets.view = view;
      byId('tickets-list-view').hidden = view !== 'list';
      byId('tickets-detail-view').hidden = view !== 'detail';
      byId('tickets-create-view').hidden = view !== 'create';
      // The toolbar and pager only make sense for the list.
      byId('tickets-toolbar').hidden = view !== 'list';
      byId('ticket-tabs').hidden = view !== 'list';
      byId('tickets-pager').hidden = view !== 'list';
      byId('tickets-new').hidden = view !== 'list';
      document.querySelectorAll('.archive-toolbar--secondary').forEach(function (element) {
        if (element.closest('#tickets-modal')) element.hidden = view !== 'list';
      });
      byId('tickets-dialog-body').scrollTop = 0;
    }

    function ticketsRequest(overrides) {
      var request = {
        page: state.tickets.page,
        pageSize: byId('tickets-page-size').value,
        sort: byId('tickets-sort').value,
        direction: state.tickets.direction,
        status: state.tickets.status,
        section: byId('tickets-section').value,
        search: byId('tickets-search').value
      };
      return Object.assign(request, overrides || {});
    }

    function renderTicketsDirection() {
      var labels = TICKET_DIRECTION_LABELS[byId('tickets-sort').value] || ['Ascending', 'Descending'];
      var ascending = state.tickets.direction === 'ASC';
      byId('tickets-direction-label').textContent = ascending ? labels[0] : labels[1];
      byId('tickets-direction').setAttribute('aria-pressed', ascending ? 'true' : 'false');
      var use = byId('tickets-direction').querySelector('use');
      if (use) use.setAttribute('href', ascending ? '#i-arrow-up' : '#i-arrow-down');
    }

    function setTicketsBusy(isBusy) {
      byId('tickets-loading').hidden = !isBusy;
      if (isBusy) {
        byId('tickets-table-wrap').hidden = true;
        byId('tickets-empty').hidden = true;
      }
      ['tickets-prev', 'tickets-next', 'tickets-refresh', 'tickets-page-input'].forEach(function (id) {
        byId(id).disabled = isBusy;
      });
    }
