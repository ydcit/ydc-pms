      byId('modal-progress').setAttribute('aria-label', infra ? 'Infrastructure PMS completion progress' : 'Questionnaire checklist progress');
    }

    function evidenceInput(kind) {
      return byId(kind + '-evidence-file');
    }

    function evidenceFile(kind) {
      var input = evidenceInput(kind);
      return input && input.files && input.files.length ? input.files[0] : null;
    }

    function evidenceDescriptor(value, kind) {
      var source = value && typeof value === 'object' ? value : null;
      if (!source) return null;
      if (source.descriptor && typeof source.descriptor === 'object') source = source.descriptor;
      if (source.evidence && typeof source.evidence === 'object') {
        source = source.evidence[kind] || source.evidence;
      }
      if (!source || typeof source !== 'object') return null;
      var descriptor = Object.assign({}, source);
      descriptor.fileId = normalizeText(pick(source, ['fileId', 'id'], ''));
      descriptor.fileName = normalizeText(pick(source, ['fileName', 'name', 'title'], ''));
      descriptor.url = normalizeText(pick(source, ['url', 'webViewLink', 'fileUrl'], ''));
      descriptor.mimeType = normalizeText(pick(source, ['mimeType', 'contentType'], ''));
      descriptor.sizeBytes = asNumber(pick(source, ['sizeBytes', 'size'], 0), 0);
      return descriptor.fileId && descriptor.url ? descriptor : null;
    }

    function recordEvidence(source, kind) {
      if (source.evidence && source.evidence[kind]) return evidenceDescriptor(source.evidence[kind], kind);
      var direct = source[kind + 'Evidence'] || source['evidence' + kind.charAt(0).toUpperCase() + kind.slice(1)];
      if (direct) return evidenceDescriptor(direct, kind);
      var prefix = kind === 'firmware' ? 'firmwareEvidence' : 'backupEvidence';
      var flattened = {
        fileId: source[prefix + 'FileId'],
        fileName: source[prefix + 'FileName'],
        url: source[prefix + 'Url'],
        mimeType: source[prefix + 'MimeType'],
        sizeBytes: source[prefix + 'SizeBytes'],
        sha256: source[prefix + 'Sha256'],
        uploadedAt: source[prefix + 'UploadedAt'],
        uploadedBy: source[prefix + 'UploadedBy'],
        signature: source[prefix + 'Signature']
      };
      return evidenceDescriptor(flattened, kind);
    }

    function safeEvidenceUrl(value) {
      var url = normalizeText(value);
      if (!/^https:\/\//i.test(url)) return '';
      try {
        return new URL(url).protocol === 'https:' ? url : '';
      } catch (ignore) {
        return '';
      }
    }

    function formatBytes(value) {
      var bytes = Math.max(0, asNumber(value, 0));
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(bytes < 10 * 1024 ? 1 : 0) + ' KiB';
      return (bytes / (1024 * 1024)).toFixed(1) + ' MiB';
    }

    function evidenceConfig(kind) {
      return state.evidenceConfig[kind] || FALLBACK_EVIDENCE[kind];
    }

    function fileMatchesAccept(file, accept) {
      var tokens = normalizeAccept(accept).toLowerCase().split(',').map(normalizeText).filter(Boolean);
      var name = normalizeText(file.name).toLowerCase();
      var mime = normalizeText(file.type).toLowerCase();
      return tokens.some(function (token) {
        if (token.charAt(0) === '.') return name.slice(-token.length) === token;
        if (token.slice(-2) === '/*') return mime.indexOf(token.slice(0, -1)) === 0;
        return mime === token;
      });
    }

    function setEvidenceError(kind, message) {
      var card = byId(kind + '-evidence-card');
      var error = byId(kind + '-evidence-error');
      error.textContent = normalizeText(message);
      error.hidden = !error.textContent;
      card.classList.toggle('has-error', Boolean(error.textContent));
      evidenceInput(kind).setAttribute('aria-invalid', error.textContent ? 'true' : 'false');
    }

    function clearEvidenceError(kind) {
      setEvidenceError(kind, '');
      evidenceInput(kind).removeAttribute('aria-invalid');
    }

    function validateEvidenceFile(kind, showError) {
      var file = evidenceFile(kind);
      if (!file) return true;
      var config = evidenceConfig(kind);
      var message = '';
      if (file.size <= 0) message = 'Choose a non-empty evidence file.';
      else if (file.size > config.maxBytes) message = 'The selected file exceeds the ' + formatBytes(config.maxBytes) + ' limit.';
      else if (!fileMatchesAccept(file, config.accept)) message = 'Choose a supported evidence file type.';
      if (message && showError) setEvidenceError(kind, message);
      if (!message) clearEvidenceError(kind);
      return !message;
    }

    function evidenceReady(kind) {
      var selected = evidenceFile(kind);
      return Boolean((selected && validateEvidenceFile(kind, false)) || state.infraEvidence[kind]);
    }

    function evidenceReadyCount() {
      return ['firmware', 'backup'].filter(evidenceReady).length;
    }

    function renderEvidenceKind(kind) {
      var config = evidenceConfig(kind);
      var descriptor = state.infraEvidence[kind];
      var file = evidenceFile(kind);
      var card = byId(kind + '-evidence-card');
      var current = byId(kind + '-evidence-current');
      var link = byId(kind + '-evidence-link');
      var url = descriptor ? safeEvidenceUrl(descriptor.url) : '';
      byId(kind + '-evidence-label').textContent = config.label;
      evidenceInput(kind).accept = config.accept;
      byId(kind + '-evidence-help').textContent = 'Supported document, image, archive, or configuration file. Maximum ' + formatBytes(config.maxBytes) + '.';
      current.hidden = !descriptor;
      if (descriptor) {
        link.textContent = descriptor.fileName || 'Open current evidence';
        if (url) {
          link.href = url;
          link.removeAttribute('aria-disabled');
        } else {
          link.removeAttribute('href');
          link.setAttribute('aria-disabled', 'true');
        }
      }
      card.classList.toggle('has-selection', Boolean(file || descriptor));
      byId(kind + '-evidence-clear').hidden = !file;
      if (file) {
        byId(kind + '-evidence-file-name').textContent = file.name;
        byId(kind + '-evidence-file-meta').textContent = formatBytes(file.size) + (descriptor ? ' - replacement selected' : ' - ready to upload');
      } else if (descriptor) {
        byId(kind + '-evidence-file-name').textContent = descriptor.fileName || 'Evidence attached';
        byId(kind + '-evidence-file-meta').textContent = (descriptor.sizeBytes ? formatBytes(descriptor.sizeBytes) + ' - ' : '') + 'saved with this draft';
      } else {
        byId(kind + '-evidence-file-name').textContent = 'No file selected';
        byId(kind + '-evidence-file-meta').textContent = 'Required when completing PMS';
      }
    }

    function renderEvidenceUI() {
      if (!byId('firmware-evidence-card')) return;
      ['firmware', 'backup'].forEach(renderEvidenceKind);
      byId('review-evidence').textContent = evidenceReadyCount() + ' of 2 ready';
      updateChecklistProgress();
    }

    function clearEvidenceSelection(kind) {
      evidenceInput(kind).value = '';
      clearEvidenceError(kind);
      renderEvidenceUI();
      markDirty();
    }

    function onEvidenceFileChange(event) {
      var kind = event.currentTarget.dataset.evidenceKind;
      if (!validateEvidenceFile(kind, true)) event.currentTarget.value = '';
      renderEvidenceUI();
      markDirty();
    }

    function renderPeripheralSchema() {
      var grid = byId('peripheral-grid');
      grid.replaceChildren();
      state.peripherals.forEach(function (peripheral) {
        var field = document.createElement('div');
        field.className = 'peripheral-field';
        field.dataset.peripheralKey = peripheral.key;
        var label = document.createElement('label');
        var inputId = 'peripheral-' + safeId(peripheral.key);
        label.setAttribute('for', inputId);
        label.textContent = peripheral.label;

        var chipInput = document.createElement('div');
        chipInput.className = 'chip-input';
        chipInput.addEventListener('click', function () { input.focus(); });
        var input = document.createElement('input');
        input.id = inputId;
        input.type = 'text';
        input.autocomplete = 'off';
        input.placeholder = 'Add asset tag';
        input.dataset.peripheralKey = peripheral.key;
        input.setAttribute('aria-label', 'Add ' + peripheral.label + ' asset tag');
        input.addEventListener('keydown', onPeripheralKeydown);
        input.addEventListener('blur', function () { commitPeripheralInput(input); });
        input.addEventListener('input', function () {
          if (input.value.indexOf(',') >= 0) commitPeripheralInput(input);
          markDirty();
        });
        chipInput.appendChild(input);

        var warning = document.createElement('p');
        warning.className = 'peripheral-warning';
        warning.id = inputId + '-warning';
        warning.setAttribute('aria-live', 'polite');

        field.appendChild(label);
        field.appendChild(chipInput);
        field.appendChild(warning);
        grid.appendChild(field);
      });
      renderAllPeripheralChips();
    }

    function safeId(value) {
      return normalizeText(value).replace(/[^a-zA-Z0-9_-]/g, '-');
    }

    function onPeripheralKeydown(event) {
      if (event.key === 'Enter' || event.key === ',') {
        event.preventDefault();
        commitPeripheralInput(event.currentTarget);
      } else if (event.key === 'Backspace' && !event.currentTarget.value) {
        var key = event.currentTarget.dataset.peripheralKey;
        var values = state.peripheralValues[key] || [];
        if (values.length) {
          values.pop();
          renderPeripheralChips(key);
          markDirty();
        }
      }
    }

    function commitPeripheralInput(input) {
      var key = input.dataset.peripheralKey;
      var tags = input.value.split(',').map(normalizeTag).filter(Boolean);
      if (!tags.length) return;
      if (!state.peripheralValues[key]) state.peripheralValues[key] = [];
      tags.forEach(function (tag) {
        if (state.peripheralValues[key].indexOf(tag) < 0) state.peripheralValues[key].push(tag);
      });
      input.value = '';
      renderPeripheralChips(key);
      markDirty();
    }

    function renderAllPeripheralChips() {
      state.peripherals.forEach(function (peripheral) { renderPeripheralChips(peripheral.key); });
    }

    function renderPeripheralChips(key) {
      var field = document.querySelector('[data-peripheral-key="' + CSS.escape(key) + '"]');
      if (!field) return;
      var chipInput = field.querySelector('.chip-input');
      var input = chipInput.querySelector('input');
      chipInput.querySelectorAll('.tag-chip').forEach(function (chip) { chip.remove(); });
      var unverified = 0;
      (state.peripheralValues[key] || []).forEach(function (tag) {
        var verified = state.assetMap.has(tag);
        if (!verified) unverified += 1;
        var chip = document.createElement('span');
        chip.className = 'tag-chip' + (verified ? '' : ' tag-chip--unverified');
        chip.title = verified ? 'Matched in your section asset list' : 'Unverified peripheral tag';
        var label = document.createElement('span');
        label.textContent = tag;
        var remove = document.createElement('button');
        remove.type = 'button';
        remove.appendChild(iconSvg('close'));
        remove.setAttribute('aria-label', 'Remove ' + tag);
        remove.addEventListener('click', function (event) {
          event.stopPropagation();
          state.peripheralValues[key] = state.peripheralValues[key].filter(function (value) { return value !== tag; });
          renderPeripheralChips(key);
          markDirty();
          input.focus();
        });
        chip.appendChild(label);
        chip.appendChild(remove);
        chipInput.insertBefore(chip, input);
      });
      var warning = field.querySelector('.peripheral-warning');
      warning.textContent = unverified ? unverified + (unverified === 1 ? ' tag is' : ' tags are') + ' not in the available section asset list and will be flagged.' : '';
    }

    function renderChecklistSchema() {
      var container = byId('checklist-groups');
      container.replaceChildren();
      state.checklistGroups.forEach(function (group) {
        var wrapper = document.createElement('section');
        wrapper.className = 'checklist-group';
        wrapper.dataset.checklistGroup = group.key;

        var header = document.createElement('div');
        header.className = 'checklist-group__header';
        var title = document.createElement('div');
        title.className = 'checklist-group__title';
        var strong = document.createElement('strong');
        strong.textContent = group.label;
        var description = document.createElement('span');
        description.textContent = group.description || group.items.length + ' checks';
        title.appendChild(strong);
        title.appendChild(description);

        var progressWrap = document.createElement('div');
        progressWrap.className = 'checklist-group__progress';
        var count = document.createElement('span');
        count.className = 'checklist-group__count';
        count.dataset.groupCount = group.key;
        count.textContent = '0 / ' + group.items.length;
        var progress = document.createElement('div');
        progress.className = 'progress-track';
        progress.setAttribute('role', 'progressbar');
        progress.setAttribute('aria-label', group.label + ' progress');
        progress.setAttribute('aria-valuemin', '0');
        progress.setAttribute('aria-valuemax', '100');
        progress.setAttribute('aria-valuenow', '0');
        progress.dataset.groupProgress = group.key;
        var fill = document.createElement('span');
        fill.className = 'progress-fill';
        progress.appendChild(fill);
        progressWrap.appendChild(count);
        progressWrap.appendChild(progress);
        header.appendChild(title);
        header.appendChild(progressWrap);

        var items = document.createElement('div');
        items.className = 'checklist-items';
        group.items.forEach(function (item) {
          var row = document.createElement('div');
          row.className = 'checklist-item';
          row.dataset.checklistItem = item.key;
          var label = document.createElement('label');
          label.className = 'checklist-item__check';
          var checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.dataset.checklistKey = item.key;
          checkbox.addEventListener('change', function () {
            setChecklistEntry(item.key, checkbox.checked ? { state: 'DONE', reason: '' } : { state: '', reason: '' });
            updateChecklistInputs();
            markDirty();
            updateChecklistProgress();
          });
          var itemLabel = document.createElement('span');
          itemLabel.className = 'checklist-item__label';
          itemLabel.textContent = item.label;
          label.appendChild(checkbox);
          label.appendChild(itemLabel);
          row.appendChild(label);

          /*
            Every check can be left unticked, but not silently: choosing "Not
            done" reveals a reason box, and the reason is what makes it an answer.
            Nothing is optional any more, so there is no per-item exemption.
          */
          var skipButton = document.createElement('button');
          skipButton.className = 'na-toggle';
          skipButton.type = 'button';
          skipButton.textContent = 'Not done';
          skipButton.setAttribute('aria-pressed', 'false');
          skipButton.setAttribute('aria-label', 'Record a reason why ' + item.label + ' was not done');
          skipButton.addEventListener('click', function () {
            var current = checklistEntry(item.key);
            if (current.state === 'NOT_DONE') {
              setChecklistEntry(item.key, { state: '', reason: '' });
            } else {
              setChecklistEntry(item.key, { state: 'NOT_DONE', reason: current.reason });
            }
            updateChecklistInputs();
            markDirty();
            updateChecklistProgress();
            var revealed = row.querySelector('.checklist-item__reason input');
            if (revealed && !revealed.closest('.checklist-item__reason').hidden) revealed.focus();
          });
          row.appendChild(skipButton);

          var reasonWrap = document.createElement('div');
          reasonWrap.className = 'checklist-item__reason';
          reasonWrap.hidden = true;
          var reasonInput = document.createElement('input');
          reasonInput.type = 'text';
          reasonInput.maxLength = 500;
          reasonInput.placeholder = 'Why was this not done?';
          reasonInput.setAttribute('aria-label', 'Reason ' + item.label + ' was not done');
          reasonInput.dataset.checklistReason = item.key;
          reasonInput.addEventListener('input', function () {
            setChecklistEntry(item.key, { state: 'NOT_DONE', reason: reasonInput.value });
            row.classList.remove('is-missing');
            markDirty();
            updateChecklistProgress();
          });
          reasonWrap.appendChild(reasonInput);
          row.appendChild(reasonWrap);
          items.appendChild(row);
        });

        wrapper.appendChild(header);
        wrapper.appendChild(items);
        container.appendChild(wrapper);
      });
      updateChecklistInputs();
      updateChecklistProgress();
    }

    /*
       A checklist answer is a state plus, when it was not done, the reason. The
       reason travels to the server inside the value itself, in the same grammar
       the sheet stores, so no new column or payload shape was needed.
       ---------------------------------------------------------------------- */

    function checklistEntry(key) {
      var entry = state.checklistValues[key];
      if (entry && typeof entry === 'object') {
        return { state: normalizeText(entry.state), reason: normalizeText(entry.reason) };
      }
      return parseChecklistValue(entry);
    }

    function setChecklistEntry(key, entry) {
      state.checklistValues[key] = {
        state: normalizeText(entry && entry.state),
        reason: normalizeText(entry && entry.reason)
      };
    }

    /** Mirrors PMS.Util.parseChecklistValue so a stored value round-trips. */
    function parseChecklistValue(value) {
      var text = normalizeText(value);
      if (!text) return { state: '', reason: '' };
      var upper = text.toUpperCase();
      if (upper === 'DONE' || upper === 'TRUE' || upper === 'CHECKED') return { state: 'DONE', reason: '' };
      if (upper === 'NA' || upper === 'N/A') return { state: 'NOT_DONE', reason: 'Not applicable' };
      var match = /^NOT\s*DONE\s*[:\-\u2013]?\s*([\s\S]*)$/i.exec(text);
      if (match) {
        var stated = normalizeText(match[1]);
        return { state: stated ? 'NOT_DONE' : '', reason: stated };
      }
      return { state: 'NOT_DONE', reason: text.slice(0, 500) };
    }

    /** Mirrors PMS.Util.formatChecklistValue. */
    function formatChecklistValue(entry) {
      if (entry.state === 'DONE') return 'DONE';
      var reason = normalizeText(entry.reason);
      return reason ? 'NOT DONE: ' + reason : '';
    }

    /** True when the item has an answer: ticked, or not done with a reason. */
    function checklistAnswered(key) {
      var entry = checklistEntry(key);
      return entry.state === 'DONE' || (entry.state === 'NOT_DONE' && Boolean(entry.reason));
    }

    function allChecklistItems() {
      return state.checklistGroups.reduce(function (items, group) { return items.concat(group.items); }, []);
    }

    /*
      Every item counts, and "completed" means answered rather than ticked: an
      item left unticked with a reason is a legitimate answer. That keeps the
      existing 100%-to-complete gate meaningful while allowing exceptions, and it
      matches how the server counts.
    */
    function calculateChecklistProgress(items) {
      var source = items || allChecklistItems();
      var completed = 0;
      var checked = 0;
      var notDone = 0;
      source.forEach(function (item) {
        var entry = checklistEntry(item.key);
        if (entry.state === 'DONE') {
          checked += 1;
          completed += 1;
        } else if (entry.state === 'NOT_DONE' && entry.reason) {
          notDone += 1;
          completed += 1;
        }
      });
      return {
        total: source.length,
        applicable: source.length,
        completed: completed,
        checked: checked,
        notDone: notDone,
        percent: source.length === 0 ? 100 : Math.round(completed / source.length * 100)
      };
    }

    function calculateFormProgress() {
      var checklist = calculateChecklistProgress();
      if (!isInfraSection()) return checklist;
      var evidenceCompleted = evidenceReadyCount();
      var applicable = checklist.applicable + 2;
      var completed = checklist.completed + evidenceCompleted;
      return {
        total: checklist.total + 2,
        applicable: applicable,
        completed: completed,
        checked: checklist.checked,
        notDone: checklist.notDone,
        evidenceCompleted: evidenceCompleted,
        percent: applicable ? Math.round(completed / applicable * 100) : 0
      };
    }

    function updateChecklistInputs() {
      allChecklistItems().forEach(function (item) {
        var row = document.querySelector('[data-checklist-item="' + CSS.escape(item.key) + '"]');
        if (!row) return;
        var entry = checklistEntry(item.key);
        var notDone = entry.state === 'NOT_DONE';
        var checkbox = row.querySelector('input[type="checkbox"]');
        checkbox.checked = entry.state === 'DONE';
        checkbox.disabled = notDone;
        row.classList.toggle('is-na', notDone);
        var skip = row.querySelector('.na-toggle');
        if (skip) {
          skip.classList.toggle('is-active', notDone);
          skip.setAttribute('aria-pressed', String(notDone));
        }
        var reasonWrap = row.querySelector('.checklist-item__reason');
        var reasonInput = reasonWrap ? reasonWrap.querySelector('input') : null;
        if (reasonWrap) reasonWrap.hidden = !notDone;
        if (reasonInput && reasonInput.value !== entry.reason) reasonInput.value = entry.reason;
      });
    }

    function updateChecklistProgress() {
      state.checklistGroups.forEach(function (group) {
        var progress = calculateChecklistProgress(group.items);
        var count = document.querySelector('[data-group-count="' + CSS.escape(group.key) + '"]');
        var track = document.querySelector('[data-group-progress="' + CSS.escape(group.key) + '"]');
        if (count) count.textContent = progress.completed + ' / ' + progress.applicable;
        if (track) setProgress(track, track.querySelector('.progress-fill'), progress.percent);
      });

      var overall = calculateFormProgress();
      var label = overall.completed + ' of ' + overall.applicable + ' answered';
      if (overall.notDone) label += ' · ' + overall.notDone + ' not done';
      byId('modal-progress-label').textContent = label;
      setProgress(byId('modal-progress'), byId('modal-progress-fill'), overall.percent);
      byId('review-checklist').textContent = label;
      byId('review-final-status').textContent = overall.percent + '% — ' + (overall.percent === 100 ? 'READY TO COMPLETE' : 'INCOMPLETE');
      byId('review-status-chip').textContent = overall.percent === 100 ? 'READY' : 'INCOMPLETE';
      byId('review-status-chip').className = 'status-chip ' + (overall.percent === 100 ? 'status-chip--success' : 'status-chip--warning');
      byId('review-hint').textContent = overall.percent === 100
        ? (isInfraSection() ? 'All required maintenance checks and evidence are ready. Finish the assessment and select Complete PMS.' : 'The checklist is complete. Finish the required assessment and select Complete PMS.')
        : (isInfraSection() ? 'Answer all four checks and attach both evidence files before finalizing PMS.' : 'Every checklist item needs an answer: tick it, or mark it Not done with a reason.');
      setProgress(byId('review-progress'), byId('review-progress-fill'), overall.percent);
      updateFooterActions();
    }

    /*
      Skip the whole checklist in one action, for the rare visit where PMS
      could not be performed on the asset at all. Reuses the exact per-item
      "Not done + reason" grammar every check already supports rather than
      inventing a second mechanism: every item is set to NOT_DONE with the one
      reason given here, the same shape setChecklistEntry/formatChecklistValue
      already read and write for a single item skipped by hand.
      ---------------------------------------------------------------------- */

    function toggleChecklistSkip() {
      var body = byId('checklist-skip-body');
      if (!body) return;
      var opening = body.hidden;
      body.hidden = !opening;
      byId('checklist-skip-toggle').setAttribute('aria-expanded', String(opening));
      if (opening) window.setTimeout(function () { byId('checklist-skip-reason').focus(); }, 0);
    }

    function applyChecklistSkip() {
      var reasonInput = byId('checklist-skip-reason');
      var reason = normalizeText(reasonInput.value);
      clearFieldError('checklist-skip-reason', 'checklist-skip-reason-error');
      if (!reason) {
        setFieldError('checklist-skip-reason', 'checklist-skip-reason-error', 'State why PMS could not be performed on this asset.');
        reasonInput.focus();
        return;
      }
      allChecklistItems().forEach(function (item) {
        setChecklistEntry(item.key, { state: 'NOT_DONE', reason: reason });
      });
      updateChecklistInputs();
      updateChecklistProgress();
      markDirty();
      reasonInput.value = '';
      byId('checklist-skip-body').hidden = true;
      byId('checklist-skip-toggle').setAttribute('aria-expanded', 'false');
      showToast('Checklist skipped', 'Every check was marked Not done: ' + reason, 'warning');
    }

    function resetChecklistSkip() {
      if (!byId('checklist-skip-body')) return;
      byId('checklist-skip-body').hidden = true;
      byId('checklist-skip-toggle').setAttribute('aria-expanded', 'false');
      byId('checklist-skip-reason').value = '';
      clearFieldError('checklist-skip-reason', 'checklist-skip-reason-error');
    }

    function resetFormData() {
      state.peripheralValues = {};
      state.checklistValues = {};
      state.peripherals.forEach(function (item) { state.peripheralValues[item.key] = []; });
      allChecklistItems().forEach(function (item) { setChecklistEntry(item.key, { state: '', reason: '' }); });
      state.currentStep = 1;
      state.recordId = '';
      state.idempotencyKey = createIdempotencyKey();
      state.selectedAsset = null;
      state.loadedAssetTag = '';
      state.recordAssetTickets = { tag: '', tickets: [] };
      state.infraEvidence = { firmware: null, backup: null };
      state.dirty = false;
      state.submittedCompletion = '';
      resetRecordTicket();
      resetChecklistSkip();
    }

    function createIdempotencyKey() {
      if (window.crypto && typeof window.crypto.randomUUID === 'function') return window.crypto.randomUUID();
      return 'pms-' + Date.now() + '-' + Math.random().toString(36).slice(2) + '-' + Math.random().toString(36).slice(2);
    }

    function clearFormControls() {
      byId('questionnaire-form').reset();
      byId('maintenance-date').max = currentManilaDate();
      byId('maintenance-date').value = currentManilaDate();
      byId('infra-asset-type').value = '';
      byId('asset-tag').value = '';
      closeAssetList();
      byId('observed-location').value = '';
      byId('asset-snapshot').hidden = true;
      byId('location-incorrect').checked = false;
      byId('location-incorrect').disabled = false;
      byId('observed-location-wrap').hidden = true;
      byId('assessment-result').value = '';
      byId('asset-findings').value = '';
      byId('action-taken').value = '';
      byId('recommendation').value = '';
      ['firmware', 'backup'].forEach(function (kind) {
        evidenceInput(kind).value = '';
        clearEvidenceError(kind);
      });
      byId('form-alert').hidden = true;
      byId('record-save-state').textContent = '';
      document.querySelectorAll('.field-error').forEach(function (error) {
        error.hidden = true;
        error.textContent = '';
      });
      document.querySelectorAll('.field.has-error, .search-input.has-error').forEach(function (field) { field.classList.remove('has-error'); });
      renderAllPeripheralChips();
      updateChecklistInputs();
      renderAssetOptions();
      renderEvidenceUI();
      updateChecklistProgress();
      updateDerivedCycle();
      updateReview();
    }

    function openNewRecord() {
      if (!hasAnyOpenAssetCycle()) {
        showToast('No eligible assets', 'No INPROD assets are available in your IT section.', 'warning');
        return;
      }
      resetFormData();
      clearFormControls();
      byId('questionnaire-title').textContent = 'New maintenance record';
      openModal();
    }

    function openExistingRecord(recordId) {
      setBusy(true, 'Loading maintenance record…');
      serverCall('PMS_apiGetRecord', recordId)
        .then(function (record) {
          resetFormData();
          clearFormControls();
          populateRecord(record);
          byId('questionnaire-title').textContent = 'Resume maintenance record';
          openModal();
        })
        .catch(function (error) {
          showToast('Record unavailable', errorMessage(error), 'danger');
        })
        .finally(function () { setBusy(false); });
    }

    function populateRecord(record) {
      var source = record.record || record;
      state.recordId = normalizeText(source.recordId || source.id);
      state.idempotencyKey = normalizeText(source.idempotencyKey) || createIdempotencyKey();
      state.submittedCompletion = normalizeText(source.pmsCompletion);
      state.loadedAssetTag = normalizeTag(source.assetTag);
      // Stored as it arrived. The server sends a counted object now, and
      // assetTicketsFor still understands a bare array from an older payload,
      // so coercing either way here would throw one of the two shapes away.
      state.recordAssetTickets = {
        tag: normalizeTag(source.assetTag),
        tickets: source.assetTickets || []
      };
      byId('questionnaire-form').reset();
      byId('maintenance-date').max = currentManilaDate();
      byId('maintenance-date').value = normalizeText(source.maintenanceDate);
      byId('infra-asset-type').value = normalizeText(source.assetType);
      byId('asset-tag').value = normalizeTag(source.assetTag);
      selectAsset(byId('asset-tag').value, false);
      byId('location-incorrect').checked = Boolean(source.locationDiscrepancy);
      byId('observed-location').value = normalizeText(source.observedLocation);
      updateObservedLocationVisibility();

      var savedPeripherals = source.peripherals || {};
      state.peripherals.forEach(function (peripheral) {
        var value = savedPeripherals[peripheral.key];
        if (Array.isArray(value)) {
          state.peripheralValues[peripheral.key] = value.map(normalizeTag).filter(Boolean);
        } else {
          state.peripheralValues[peripheral.key] = normalizeText(value).split(/\s*[|,;]\s*/).map(normalizeTag).filter(Boolean);
        }
      });

      var savedChecklist = source.checklist || {};
      allChecklistItems().forEach(function (item) {
        // Stored values carry their reason, so a resumed draft keeps it.
        setChecklistEntry(item.key, parseChecklistValue(savedChecklist[item.key]));
      });

      var assessment = source.assessment || {};
      state.infraEvidence.firmware = recordEvidence(source, 'firmware');
      state.infraEvidence.backup = recordEvidence(source, 'backup');
      byId('assessment-result').value = normalizeText(assessment.result || source.assessmentResult);
      byId('asset-findings').value = normalizeText(assessment.findings || source.findings || source.assetFindings);
      byId('action-taken').value = normalizeText(assessment.actionTaken || source.actionTaken);
      byId('recommendation').value = normalizeText(assessment.recommendation || source.recommendation);
      // A resumed draft may already have its findings ticket, so the panel must
      // not demand a second one.
      state.recordTickets = toArray(source.tickets).map(function (ticket) {
        return {
          ticketId: normalizeText(pick(ticket, ['ticketId'], '')),
          status: normalizeText(pick(ticket, ['status'], '')),
          summary: normalizeText(pick(ticket, ['summary'], ''))
        };
      }).filter(function (ticket) { return Boolean(ticket.ticketId); });
      renderRecordTicketsFiled();
      updateRecordTicketRequirement();
      renderAllPeripheralChips();
      renderEvidenceUI();
      updateChecklistInputs();
      updateChecklistProgress();
      updateDerivedCycle();
      updateReview();
      setStep(1, false);
      state.dirty = false;
      byId('record-save-state').textContent = state.recordId ? 'Editing ' + state.recordId : '';
    }

    function openModal() {
      if (state.modalOpen || state.archive.open || state.legacyImport.open) return;
      state.lastFocus = document.activeElement;
      state.modalOpen = true;
      state.dirty = false;
      byId('questionnaire-modal').hidden = false;
      syncBodyModalState();
      setStep(1, false);
      window.setTimeout(function () { byId('maintenance-date').focus(); }, 0);
    }

    function requestCloseModal(force) {
      if (!state.modalOpen) return;
      if (!force && state.dirty && !window.confirm('Close this questionnaire? Unsaved changes will be lost.')) return;
      state.modalOpen = false;
      state.dirty = false;
      byId('questionnaire-modal').hidden = true;
      syncBodyModalState();
      if (state.lastFocus && typeof state.lastFocus.focus === 'function') state.lastFocus.focus();
    }

    function markDirty() {
      if (state.modalOpen) state.dirty = true;
      updateReview();
    }

    function onFormInput(event) {
      if (event.target.closest('.form-step')) {
        markDirty();
        if (event.target.id === 'maintenance-date') updateDerivedCycle();
        if (event.target.id === 'asset-tag') {
          openAssetList();
          selectAsset(event.target.value, false);
        }
        // The ticket panel mirrors the assessment, so it follows these fields.
        if (event.target.id === 'assessment-result') {
          updateRecordTicketRequirement();
          updateFooterActions();
        }
        if (event.target.id === 'asset-findings' || event.target.id === 'recommendation') {
          renderRecordTicketDerived();
        }
        if (event.target.id === 'infra-asset-type') {
          clearFieldError('infra-asset-type', 'infra-asset-type-error');
          renderAssetOptions();
          if (state.selectedAsset && !assetMatchesInfraType(state.selectedAsset) && state.selectedAsset.tag !== state.loadedAssetTag) {
            byId('asset-tag').value = '';
            state.selectedAsset = null;
            byId('asset-snapshot').hidden = true;
          }
        }
        if (event.target.id === 'location-incorrect') updateObservedLocationVisibility();
        if (event.target.id === 'assessment-result') applyAssessmentShortcut();
      }
    }

    function updateDerivedCycle() {
      var date = byId('maintenance-date').value;
      var derived = deriveCycle(date);
      byId('form-maintenance-year').textContent = derived ? derived.year : '—';
      byId('form-cycle').textContent = derived ? derived.cycle : '—';
      byId('review-cycle').textContent = derived ? derived.cycleId : 'Not selected';
      clearFieldError('maintenance-date', 'maintenance-date-error');
      if (date && date > currentManilaDate()) {
        setFieldError('maintenance-date', 'maintenance-date-error', 'Maintenance date cannot be in the future.');
      }
      renderAssetOptions();
      if (state.selectedAsset && assetCompletedForCycle(state.selectedAsset, derived) && state.selectedAsset.tag !== state.loadedAssetTag) {
        byId('asset-tag').value = '';
        state.selectedAsset = null;
        byId('asset-snapshot').hidden = true;
      }
      updateReview();
    }

    function selectAsset(value, showError) {
      var tag = normalizeTag(value);
      var asset = state.assetMap.get(tag) || null;
      state.selectedAsset = asset;
      clearFieldError('asset-tag', 'asset-error');
      if (!asset) {
        byId('asset-snapshot').hidden = true;
        byId('review-asset').textContent = tag || 'Not selected';
        if (showError && tag) setFieldError('asset-tag', 'asset-error', 'Select an exact asset tag from the available INPROD list.');
        updateReview();
        return;
      }

      byId('asset-tag').value = asset.tag;
      byId('selected-asset-tag').textContent = asset.tag;
      byId('selected-asset-status').textContent = asset.status || 'INPROD';
      byId('selected-asset-location').textContent = asset.location || 'Not recorded';
      byId('selected-asset-source').textContent = asset.sourceTab || sectionLabel(sectionKey()) + ' asset master';
      byId('asset-snapshot').hidden = false;
      renderAssetTickets(asset.tag);
      byId('review-asset').textContent = asset.tag;
      if (!asset.location) {
        byId('location-incorrect').checked = true;
        byId('location-incorrect').disabled = true;
        byId('location-incorrect-control').querySelector('span').textContent = 'No master location is recorded; enter the observed location below';
      } else {
        byId('location-incorrect').disabled = false;
        byId('location-incorrect-control').querySelector('span').textContent = 'The asset is currently at a different location';
      }
      updateObservedLocationVisibility();
      updateReview();
    }

    /**
     * Open repairs known for one asset tag.
     *
     * Two sources, deliberately. A loaded record brings its asset's tickets down
     * with it and is the fresher of the two, so it wins for that tag; everything
     * else falls back to what the bootstrap asset list carried.
     */
    function assetTicketsFor(tag) {
      var key = normalizeTag(tag);
      var empty = { tickets: [], openCount: 0, closedCount: 0, total: 0 };
      if (!key) return empty;
      // A loaded record brings the asset's full ticket history, closed ones
      // included. The picker only carries what is open, which is all it needs to
      // warn with, so its entry is shaped into the same form here.
      if (state.recordAssetTickets.tag === key) {
        var loaded = state.recordAssetTickets.tickets || {};
        if (Array.isArray(loaded)) return countedTickets(loaded);
        return {
          tickets: toArray(loaded.tickets),
          openCount: asNumber(loaded.openCount, 0),
          closedCount: asNumber(loaded.closedCount, 0),
          total: asNumber(loaded.total, toArray(loaded.tickets).length)
        };
      }
      var asset = state.assetMap.get(key);
      return asset ? countedTickets(toArray(asset.openTickets)) : empty;
    }

    /** Wraps a bare ticket array in the counts the renderer expects. */
    function countedTickets(tickets) {
      var list = toArray(tickets);
      var open = 0;
      list.forEach(function (ticket) { if (ticket.isActive !== false) open += 1; });
      return { tickets: list, openCount: open, closedCount: list.length - open, total: list.length };
    }

    /**
     * Draws the outstanding-repair notice inside the asset snapshot.
     *
     * Text rather than links: the technician is part-way through a form, and
     * navigating to the tickets dialog from here would put it underneath the
     * questionnaire and risk the work in progress. The action required is
     * included because that is the part that changes what this visit should do.
     */
    function renderAssetTickets(tag) {
      var holder = byId('selected-asset-tickets');
      if (!holder) return;
      var entry = assetTicketsFor(tag);
      var tickets = toArray(entry.tickets);
      holder.replaceChildren();
      holder.hidden = !tickets.length;
      if (!tickets.length) return;

      /*
        Amber only while something is still open. Once every repair on the asset
        has been closed this is history, not a warning, and colouring it as one
        would train people to ignore the panel that matters.
      */
      var open = asNumber(entry.openCount, 0);
      holder.className = 'asset-tickets' + (open ? '' : ' asset-tickets--closed');

      var heading = document.createElement('p');
      heading.className = 'asset-tickets__title';
      heading.appendChild(iconSvg(open ? 'alert-triangle' : 'check-circle'));
      var headingText = document.createElement('span');
      headingText.textContent = open
        ? (open === 1
          ? 'This asset has an open repair ticket'
          : 'This asset has ' + formatNumber(open) + ' open repair tickets')
        : (tickets.length === 1
          ? 'This asset has one closed repair ticket'
          : 'This asset has ' + formatNumber(asNumber(entry.total, tickets.length)) + ' closed repair tickets');
      heading.appendChild(headingText);
      holder.appendChild(heading);

      var list = document.createElement('ul');
      list.className = 'asset-tickets__list';
      tickets.forEach(function (ticket) {
        var isOpen = ticket.isActive !== false;
        var item = document.createElement('li');
        if (!isOpen) item.className = 'is-closed';
        var head = document.createElement('div');
        head.className = 'asset-tickets__head';
        var id = document.createElement('strong');
        id.textContent = normalizeText(ticket.ticketId) || '—';
        head.appendChild(id);
        var status = document.createElement('span');
        status.className = 'status-chip ' + (isOpen ? 'status-chip--info' : 'status-chip--success');
        status.textContent = normalizeText(ticket.statusLabel) || ticketLabel(ticket.status);
        head.appendChild(status);
        item.appendChild(head);

        var summary = normalizeText(ticket.summary);
        if (summary) {
          var summaryText = document.createElement('span');
          summaryText.textContent = summary;
          item.appendChild(summaryText);
        }
        // What still has to happen only matters while the ticket is open.
        var action = normalizeText(ticket.actionRequired);
        if (action && isOpen) {
          var actionText = document.createElement('small');
          actionText.textContent = 'Action required: ' + action;
          item.appendChild(actionText);
        }
        list.appendChild(item);
      });
      holder.appendChild(list);

      var hidden = asNumber(entry.total, tickets.length) - tickets.length;
      if (hidden > 0) {
        var more = document.createElement('p');
        more.className = 'asset-tickets__more';
        more.textContent = formatNumber(hidden) + ' older ticket' + (hidden === 1 ? '' : 's') +
          ' on this asset are not shown.';
        holder.appendChild(more);
      }
    }

    function updateObservedLocationVisibility() {
      var required = Boolean(state.selectedAsset && (!state.selectedAsset.location || byId('location-incorrect').checked));
      byId('observed-location-wrap').hidden = !required;
      byId('observed-location').required = required;
      if (!required) {
        byId('observed-location').value = '';
        clearFieldError('observed-location', 'observed-location-error');
      }
    }

    function applyAssessmentShortcut() {
      if (byId('assessment-result').value !== 'No findings') return;
      if (!normalizeText(byId('asset-findings').value)) byId('asset-findings').value = 'No findings';
      if (!normalizeText(byId('action-taken').value)) byId('action-taken').value = 'No action required';
      if (!normalizeText(byId('recommendation').value)) byId('recommendation').value = 'None';
    }

    function updateReview() {
      if (!byId('review-asset')) return;
      byId('review-asset').textContent = state.selectedAsset ? state.selectedAsset.tag : (normalizeTag(byId('asset-tag').value) || 'Not selected');
      var derived = deriveCycle(byId('maintenance-date').value);
      byId('review-cycle').textContent = derived ? derived.cycleId : 'Not selected';
      byId('review-asset-type').textContent = normalizeText(byId('infra-asset-type').value) || 'Not selected';
      byId('review-evidence').textContent = evidenceReadyCount() + ' of 2 ready';
    }

    /**
     * Gate for leaving a step on the way forward.
     *
     * Only forward navigation is gated. Going back and Save progress stay open
     * so a part-finished record is never trapped behind a requirement — the
     * technician can always park a draft and come back to it.
     *
     * These helpers deliberately do not navigate; setStep decides where to land
     * so that a stepper jump reports the first step that actually blocked.
     */
    function validateStep(step, focusFirst) {
      if (step === 1) return validateCoreFields(focusFirst);
      if (step === 2) {
        // Peripherals are optional, so Service Desk has nothing to satisfy here.
        return isInfraSection() ? validateEvidenceStep(focusFirst) : true;
      }
      if (step === 3) return validateChecklistComplete(focusFirst);
      return true;
    }

    function validateEvidenceStep(focusFirst) {
      var unsupported = '';
      var missing = [];
      ['firmware', 'backup'].forEach(function (kind) {
        if (!validateEvidenceFile(kind, true)) {
          unsupported = unsupported || kind;
          return;
        }
        if (evidenceReady(kind)) {
          clearEvidenceError(kind);
          return;
        }
        missing.push(kind);
        setEvidenceError(kind, 'Attach this evidence before continuing.');
      });
      if (unsupported) {
        showFormAlert('Choose supported evidence files that are within the size limit.');
        if (focusFirst) evidenceInput(unsupported).focus();
        return false;
      }
      if (missing.length) {
        showFormAlert('Attach both firmware and backup evidence before continuing to the checklist.');
        if (focusFirst) evidenceInput(missing[0]).focus();
        return false;
      }
      return true;
    }

    /**
     * Every checklist item must be ticked, except the ones the schema marks as
     * not done, and an item marked not done needs its reason filled in.
     */
    function validateChecklistComplete(focusFirst) {
      var outstanding = [];
      allChecklistItems().forEach(function (item) {
        if (!checklistAnswered(item.key)) outstanding.push(item);
      });

      document.querySelectorAll('.checklist-item.is-missing').forEach(function (row) {
        row.classList.remove('is-missing');
      });
      if (!outstanding.length) return true;

      var firstRow = null;
      outstanding.forEach(function (item) {
        var row = document.querySelector('[data-checklist-item="' + CSS.escape(item.key) + '"]');
        if (!row) return;
        row.classList.add('is-missing');
        firstRow = firstRow || row;
      });
      showFormAlert(outstanding.length === 1
        ? 'One check still needs an answer: ' + outstanding[0].label + '.'
        : outstanding.length + ' checks still need an answer, starting with ' + outstanding[0].label + '.');
      if (focusFirst && firstRow) {
        var checkbox = firstRow.querySelector('input[type="checkbox"]');
        if (checkbox) checkbox.focus();
        firstRow.scrollIntoView({ block: 'center' });
      }
      return false;
    }

    function setStep(nextStep, validate) {
      var target = Math.max(1, Math.min(4, Number(nextStep)));
      // Moving forward has to satisfy every step being left behind, so a jump
      // from the stepper cannot slip past a gate that Continue would enforce.
      if (validate !== false && target > state.currentStep) {
        for (var step = state.currentStep; step < target; step += 1) {
          if (validateStep(step, true)) continue;
          // Land on the step that blocked, which may not be the current one.
          if (step !== state.currentStep) setStep(step, false);
          return false;
        }
        // Navigation succeeded, so any gate message from a previous attempt is
        // stale and would otherwise sit on the next step.
        clearFormAlert();
      }
      state.currentStep = target;
      document.querySelectorAll('.form-step').forEach(function (step) {
        step.hidden = Number(step.dataset.step) !== target;
      });
      document.querySelectorAll('[data-step-target]').forEach(function (button) {
        var number = Number(button.dataset.stepTarget);
        button.classList.toggle('is-current', number === target);
        button.classList.toggle('is-complete', number < target);
        if (number === target) button.setAttribute('aria-current', 'step');
        else button.removeAttribute('aria-current');
      });
      byId('previous-step').hidden = target === 1;
      byId('next-step').hidden = target === 4;
      byId('complete-pms').hidden = target !== 4;
      byId('questionnaire-body').scrollTop = 0;
      updateFooterActions();
      var heading = byId('step-' + target + '-title');
      if (heading) heading.focus && heading.focus();
      return true;
    }

    function updateFooterActions() {
      if (!byId('complete-pms')) return;
      var progress = calculateFormProgress();
      // A findings assessment cannot be completed until its repair is ticketed,
      // so the button reflects that rather than failing on click.
      var ticketMissing = recordNeedsTicket() && recordTicketCount() === 0;
      byId('complete-pms').disabled = state.busy || progress.percent !== 100 || ticketMissing;
      byId('complete-pms').title = progress.percent !== 100
        ? (isInfraSection() ? 'Complete all checks and attach both evidence files first' : 'Complete all applicable checklist items first')
        : ticketMissing
          ? 'File the findings ticket first'
          : 'Finalize and synchronize this PMS record';
    }

    function setFieldError(inputId, errorId, message) {
      var input = byId(inputId);
      var error = byId(errorId);
      if (error) {
        error.textContent = normalizeText(message);
        error.hidden = false;
      }
      if (input) {
        input.setAttribute('aria-invalid', 'true');
        var wrapper = input.closest('.field') || input.closest('.search-input');
        if (wrapper) wrapper.classList.add('has-error');
      }
    }

    function clearFieldError(inputId, errorId) {
      var input = byId(inputId);
      var error = byId(errorId);
      if (error) {
        error.hidden = true;
        error.textContent = '';
      }
      if (input) {
        input.removeAttribute('aria-invalid');
        var wrapper = input.closest('.field') || input.closest('.search-input');
        if (wrapper) wrapper.classList.remove('has-error');
      }
    }

    function showFormAlert(message) {
      byId('form-alert-message').textContent = normalizeText(message);
      byId('form-alert').hidden = false;
      byId('form-alert').focus();
    }

    function clearFormAlert() {
      byId('form-alert').hidden = true;
      byId('form-alert-message').textContent = '';
    }

    function validateCoreFields(focusFirst) {
      clearFormAlert();
      var valid = true;
      var first = null;
      var date = byId('maintenance-date').value;
      var derived = deriveCycle(date);
      clearFieldError('maintenance-date', 'maintenance-date-error');
      clearFieldError('asset-tag', 'asset-error');
      clearFieldError('observed-location', 'observed-location-error');
      clearFieldError('infra-asset-type', 'infra-asset-type-error');

      if (!derived) {
        valid = false;
        first = first || byId('maintenance-date');
        setFieldError('maintenance-date', 'maintenance-date-error', 'Choose the date maintenance was performed.');
      } else if (date > currentManilaDate()) {
        valid = false;
        first = first || byId('maintenance-date');
        setFieldError('maintenance-date', 'maintenance-date-error', 'Maintenance date cannot be in the future.');
      }

      if (isInfraSection() && !normalizeText(byId('infra-asset-type').value)) {
        valid = false;
        first = first || byId('infra-asset-type');
        setFieldError('infra-asset-type', 'infra-asset-type-error', 'Select the IT-IS asset type.');
      }

      selectAsset(byId('asset-tag').value, true);
      if (!state.selectedAsset) {
        valid = false;
        first = first || byId('asset-tag');
        if (!normalizeTag(byId('asset-tag').value)) setFieldError('asset-tag', 'asset-error', 'Select an asset tag.');
      } else if (state.selectedAsset.tag !== state.loadedAssetTag && (assetCompletedForCycle(state.selectedAsset, derived) || !assetMatchesInfraType(state.selectedAsset))) {
        valid = false;
        first = first || byId('asset-tag');
        setFieldError('asset-tag', 'asset-error', 'Select an asset that is eligible for this cycle and asset type.');
      }

      var observedRequired = state.selectedAsset && (!state.selectedAsset.location || byId('location-incorrect').checked);
      if (observedRequired && !normalizeText(byId('observed-location').value)) {
        valid = false;
        first = first || byId('observed-location');
        setFieldError('observed-location', 'observed-location-error', 'Enter the asset’s observed location.');
      }

      if (!valid) {
        showFormAlert(isInfraSection() ? 'Add a valid maintenance date, IT-IS asset type, eligible asset, and any required observed location.' : 'Add a valid maintenance date, eligible asset, and any required observed location.');
        if (focusFirst && first) first.focus();
      }
      return valid;
    }

    function validateAssessment(focusFirst) {
      var fields = [
        ['assessment-result', 'assessment-result-error', 'Select an assessment result.'],
        ['asset-findings', 'asset-findings-error', 'Document the asset findings or enter “No findings”.'],
        ['action-taken', 'action-taken-error', 'Document the action taken or enter “No action required”.'],
        ['recommendation', 'recommendation-error', 'Enter a recommendation or “None”.']
      ];
      var valid = true;
      var first = null;
      fields.forEach(function (definition) {
        clearFieldError(definition[0], definition[1]);
        if (!normalizeText(byId(definition[0]).value)) {
          valid = false;
          first = first || byId(definition[0]);
          setFieldError(definition[0], definition[1], definition[2]);
        }
      });

      if (byId('assessment-result').value === 'No findings' && normalizeText(byId('asset-findings').value).toLowerCase() !== 'no findings') {
        valid = false;
        first = first || byId('asset-findings');
        setFieldError('asset-findings', 'asset-findings-error', 'Use the exact entry “No findings” for this assessment result.');
      }

      if (!valid) {
        showFormAlert('Complete the assessment before finalizing PMS.');
        if (focusFirst && first) first.focus();
      }
      return valid;
    }

    function commitAllPeripheralInputs() {
      document.querySelectorAll('#peripheral-grid input[data-peripheral-key]').forEach(function (input) {
        commitPeripheralInput(input);
      });
    }

    function buildPayload() {
      commitAllPeripheralInputs();
      var peripherals = {};
      state.peripherals.forEach(function (peripheral) {
        peripherals[peripheral.key] = (state.peripheralValues[peripheral.key] || []).slice();
      });
      var checklist = {};
      allChecklistItems().forEach(function (item) {
        // The reason rides inside the value, in the grammar the sheet stores.
        checklist[item.key] = formatChecklistValue(checklistEntry(item.key));
      });
      return {
        recordId: state.recordId || undefined,
        idempotencyKey: state.idempotencyKey,
        formType: sectionKey(),
        maintenanceDate: byId('maintenance-date').value,
        assetType: isInfraSection() ? normalizeText(byId('infra-asset-type').value) : '',
        assetTag: state.selectedAsset ? state.selectedAsset.tag : normalizeTag(byId('asset-tag').value),
        observedLocation: normalizeText(byId('observed-location').value),
        locationDiscrepancy: Boolean(state.selectedAsset && (!state.selectedAsset.location || byId('location-incorrect').checked)),
        peripherals: peripherals,
        checklist: checklist,
        evidence: isInfraSection() ? {
          firmware: state.infraEvidence.firmware || null,
          backup: state.infraEvidence.backup || null
        } : {},
        assessment: {
          result: byId('assessment-result').value,
          findings: normalizeText(byId('asset-findings').value),
          actionTaken: normalizeText(byId('action-taken').value),
          recommendation: normalizeText(byId('recommendation').value)
        }
      };
    }

    function validateSelectedEvidenceFiles() {
      var valid = true;
      var firstInvalid = null;
      ['firmware', 'backup'].forEach(function (kind) {
        if (!validateEvidenceFile(kind, true)) {
          valid = false;
          firstInvalid = firstInvalid || evidenceInput(kind);
        }
      });
      if (!valid) {
        setStep(2, false);
        showFormAlert('Choose supported evidence files that are within the size limit.');
        if (firstInvalid) firstInvalid.focus();
      }
      return valid;
    }

    function validateInfraCompletionEvidence() {
      var missing = [];
      ['firmware', 'backup'].forEach(function (kind) {
        if (evidenceReady(kind)) {
          clearEvidenceError(kind);
          return;
        }
        missing.push(kind);
        setEvidenceError(kind, 'Attach this evidence before completing PMS.');
      });
      if (!missing.length) return true;
      setStep(2, false);
      showFormAlert('Attach both required evidence files before completing PMS.');
      evidenceInput(missing[0]).focus();
      return false;
    }

    function prepareEvidenceUploadForm(kind) {
      var form = byId('infra-evidence-upload-form');
      byId('infra-upload-record-id').value = state.recordId;
      byId('infra-upload-idempotency-key').value = state.idempotencyKey;
      byId('infra-upload-asset-tag').value = state.selectedAsset ? state.selectedAsset.tag : normalizeTag(byId('asset-tag').value);
      byId('infra-upload-asset-type').value = normalizeText(byId('infra-asset-type').value);
      byId('infra-upload-maintenance-date').value = byId('maintenance-date').value;
      byId('infra-upload-evidence-kind').value = kind;
      return form;
    }

    function uploadInfraEvidence(kind) {
      var input = evidenceInput(kind);
      var file = evidenceFile(kind);
      if (!file) return Promise.resolve(state.infraEvidence[kind] || null);

      var form = prepareEvidenceUploadForm(kind);
      var originalParent = input.parentNode;
      var originalNextSibling = input.nextSibling;
      var originalName = input.getAttribute('name');
      input.setAttribute('name', 'file');
      form.appendChild(input);

      return serverCall('PMS_apiUploadInfraEvidence', form)
        .then(function (result) {
          var descriptor = evidenceDescriptor(result && result.descriptor, kind);
          if (!descriptor) {
            throw clientError('The upload completed without a valid evidence receipt. Try uploading the file again.', 'EVIDENCE_RECEIPT_INVALID');
          }
          state.infraEvidence[kind] = descriptor;
          input.value = '';
          clearEvidenceError(kind);
          return descriptor;
        })
        .finally(function () {
          if (originalNextSibling && originalNextSibling.parentNode === originalParent) {
            originalParent.insertBefore(input, originalNextSibling);
          } else {
            originalParent.appendChild(input);
          }
          if (originalName === null) input.removeAttribute('name');
          else input.setAttribute('name', originalName);
          renderEvidenceUI();
        });
    }

    function uploadSelectedInfraEvidence() {
      var kinds = ['firmware', 'backup'].filter(function (kind) { return Boolean(evidenceFile(kind)); });
      return kinds.reduce(function (chain, kind, index) {
        return chain.then(function () {
          var config = evidenceConfig(kind);
          setBusy(true, 'Uploading ' + config.label + ' (' + (index + 1) + ' of ' + kinds.length + ')\u2026');
          return uploadInfraEvidence(kind);
        });
      }, Promise.resolve());
    }

    function finishSuccessfulSave(result, mode) {
      // A saved record changes the completed list and can change ticket counts.
      clearListCaches();
      state.recordId = normalizeText(result.recordId) || state.recordId;
      state.submittedCompletion = normalizeText(result.pmsCompletion);
      state.loadedAssetTag = state.selectedAsset ? state.selectedAsset.tag : state.loadedAssetTag;
      state.dirty = false;
      applySaveResultToDashboard(result);
      var decision = completionDecision(result.pmsCompletion || result.syncStatus || (mode === 'COMPLETE' ? 'COMPLETED' : 'INCOMPLETE'));
      var defaultMessage = mode === 'COMPLETE' ? ('Record ' + state.recordId + ' was finalized.') : ('Draft ' + state.recordId + ' was saved.');
      showToast(mode === 'COMPLETE' ? (decision.label === 'COMPLETED' ? 'PMS completed' : 'PMS saved for synchronization') : 'Progress saved', normalizeText(result.message) || defaultMessage, decision.label === 'COMPLETED' || mode === 'SAVE' ? 'success' : 'warning', 8500);
      requestCloseModal(true);
    }

    function saveServiceDeskRecord(mode) {
      return serverCall('PMS_apiSaveRecord', buildPayload(), mode)
        .then(function (result) { finishSuccessfulSave(result, mode); });
    }

    function saveInfraRecord(mode) {
      // File inputs must be sent as the sole google.script.run form argument.
      // Persist a draft first so each evidence upload has a stable record ID.
      return serverCall('PMS_apiSaveRecord', buildPayload(), 'SAVE')
        .then(function (draft) {
          state.recordId = normalizeText(draft.recordId) || state.recordId;
          state.loadedAssetTag = state.selectedAsset ? state.selectedAsset.tag : state.loadedAssetTag;
          state.submittedCompletion = normalizeText(draft.pmsCompletion);
          if (!state.recordId) {
            throw clientError('The draft was saved without a record ID. Reload and try again.', 'DRAFT_ID_MISSING');
          }
          byId('record-save-state').textContent = 'Draft ' + state.recordId + ' saved';
          return uploadSelectedInfraEvidence();
        })
        .then(function () {
          setBusy(true, mode === 'COMPLETE' ? 'Finalizing and synchronizing PMS\u2026' : 'Saving evidence and draft\u2026');
          return serverCall('PMS_apiSaveRecord', buildPayload(), mode);
        })
        .then(function (result) { finishSuccessfulSave(result, mode); });
    }

    function saveRecord(mode) {
      clearFormAlert();
      if (!validateCoreFields(true)) {
        setStep(1, false);
        return;
      }
      if (isInfraSection() && !validateSelectedEvidenceFiles()) return;
      if (mode === 'COMPLETE') {
        if (isInfraSection() && !validateInfraCompletionEvidence()) return;
        var progress = calculateFormProgress();
        if (progress.percent !== 100) {
          setStep(3, false);
          showFormAlert(isInfraSection()
            ? 'Complete all four maintenance checks and attach both evidence files before finalizing PMS.'
            : 'Complete every applicable checklist item before finalizing PMS.');
          return;
        }
        if (!validateAssessment(true)) {
          setStep(4, false);
          return;
        }
        // Belt and braces alongside the disabled button, and it opens the panel
        // so the required action is in front of the technician.
        if (recordNeedsTicket() && recordTicketCount() === 0) {
          setStep(4, false);
          updateRecordTicketRequirement();
          if (byId('record-ticket-body').hidden) toggleRecordTicket();
          showFormAlert('This assessment needs follow-up. File the findings ticket below before completing PMS.');
          return;
        }
      }

      var request = isInfraSection() ? saveInfraRecord(mode) : saveServiceDeskRecord(mode);
      setBusy(true, mode === 'COMPLETE' ? 'Finalizing and synchronizing PMS…' : 'Saving your progress…');
      request
        .catch(function (error) {
          // Preserve successful uploads and the saved draft so a partial
          // failure can be retried without uploading the first file again.
          state.dirty = true;
          renderEvidenceUI();
          showFormAlert(errorMessage(error));
          showToast(mode === 'COMPLETE' ? 'Could not complete PMS' : 'Could not save progress', errorMessage(error), 'danger', 8500);
        })
        .finally(function () { setBusy(false); });
    }

    function applySaveResultToDashboard(result) {
      if (result.metrics) state.bootstrap.metrics = result.metrics;
      if (Array.isArray(result.recentRecords)) state.bootstrap.recentRecords = result.recentRecords;
      renderDashboard();
    }

    function trapModalFocus(event) {
      if (!state.modalOpen || state.legacyImport.open) return;
      if (event.key === 'Escape') {
        event.preventDefault();
        requestCloseModal(false);
        return;
      }
      if (event.key !== 'Tab') return;
      var focusable = Array.prototype.slice.call(byId('questionnaire-modal').querySelectorAll('button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [href], [tabindex]:not([tabindex="-1"])'))
        .filter(function (element) { return !element.hidden && element.offsetParent !== null; });
      if (!focusable.length) return;
      var first = focusable[0];
      var last = focusable[focusable.length - 1];
      if (event.shiftKey && document.activeElement === first) {
        event.preventDefault();
        last.focus();
      } else if (!event.shiftKey && document.activeElement === last) {
        event.preventDefault();
        first.focus();
      }
    }

        button.addEventListener('click', function () { setStep(Number(button.dataset.stepTarget), true); });
      });
      byId('save-progress').addEventListener('click', function () { saveRecord('SAVE'); });
      byId('questionnaire-form').addEventListener('submit', function (event) {
        event.preventDefault();
        saveRecord('COMPLETE');
      });
      byId('fill-no-findings').addEventListener('click', function () {
        byId('asset-findings').value = 'No findings';
        markDirty();
      });
      byId('fill-no-action').addEventListener('click', function () {
        byId('action-taken').value = 'No action required';
        markDirty();
      });
      byId('fill-no-recommendation').addEventListener('click', function () {
        byId('recommendation').value = 'None';
        markDirty();
      });
      byId('record-ticket-toggle').addEventListener('click', toggleRecordTicket);
      byId('record-ticket-submit').addEventListener('click', submitRecordTicket);
      byId('checklist-skip-toggle').addEventListener('click', toggleChecklistSkip);
      byId('checklist-skip-confirm').addEventListener('click', applyChecklistSkip);
      byId('rollover-dry-run').addEventListener('click', runRolloverDryRun);
      byId('rollover-year').addEventListener('input', resetRolloverReview);
      byId('rollover-reviewed').addEventListener('change', updateRolloverConfirmation);
      byId('rollover-confirmation').addEventListener('input', updateRolloverConfirmation);
      byId('rollover-execute').addEventListener('click', executeRollover);

      byId('reset-preview').addEventListener('click', runResetPreview);
      byId('reset-reviewed').addEventListener('change', updateResetConfirmation);
      byId('reset-confirmation').addEventListener('input', updateResetConfirmation);
      byId('reset-execute').addEventListener('click', executeReset);
      byId('retry-pending-sync').addEventListener('click', retryPendingSynchronization);
      document.addEventListener('keydown', trapLegacyImportFocus);
      document.addEventListener('keydown', trapModalFocus);
      window.addEventListener('beforeunload', function (event) {
        var questionnaireDirty = state.modalOpen && state.dirty;
        var importDirty = state.legacyImport.open && (state.legacyImport.dirty || state.legacyImport.busy);
        if (!questionnaireDirty && !importDirty) return;
        event.preventDefault();
        event.returnValue = '';
      });
    }

    function init() {
      bindEvents();
      byId('maintenance-date').max = currentManilaDate();
      byId('legacy-import-maintenance-date').max = currentManilaDate();
      syncBodyModalState();
      loadBootstrap().catch(function () {});
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  }());
</script>
