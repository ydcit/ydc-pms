    /** Same contract as loadCompletedRecords: silent warms, refresh bypasses. */
    function loadTickets(overrides, options) {
      var settings = options || {};
      var request = ticketsRequest(overrides);
      if (settings.refresh) request.refresh = true;
      state.tickets.page = asNumber(request.page, 1) || 1;

      if (!settings.refresh) {
        var cached = readListCache(state.tickets.cache, request);
        if (cached) {
          state.tickets.token += 1;
          if (!settings.silent) renderTickets(cached);
          return Promise.resolve(cached);
        }
      }

      state.tickets.token += 1;
      var token = state.tickets.token;
      if (!settings.silent) setTicketsBusy(true);
      return serverCall('PMS_apiTickets', request)
        .then(function (data) {
          writeListCache(state.tickets.cache, request, data);
          if (settings.silent || token !== state.tickets.token) return data;
          renderTickets(data);
          return data;
        })
        .catch(function (error) {
          if (settings.silent) {
            console.warn('Tickets could not be pre-fetched: ' + errorMessage(error));
            return;
          }
          if (token !== state.tickets.token) return;
          setTicketsBusy(false);
          byId('tickets-empty').hidden = false;
          byId('tickets-empty-title').textContent = 'Tickets could not be loaded';
          byId('tickets-empty-message').textContent = errorMessage(error);
          showToast('Tickets failed', errorMessage(error), 'danger');
        });
    }

    function renderTicketTabs(counts) {
      var container = byId('ticket-tabs');
      container.replaceChildren();
      TICKET_TABS.forEach(function (tab) {
        var count = tab.value === '' ? counts.TOTAL : counts[tab.value];
        var button = document.createElement('button');
        button.type = 'button';
        button.className = 'ticket-tab' + (state.tickets.status === tab.value ? ' is-active' : '');
        button.setAttribute('role', 'tab');
        // Mirrors the filter onto the DOM so the active bucket is visible when
        // inspecting the page, not just held in the closure.
        button.setAttribute('data-status', tab.value || 'ALL');
        button.setAttribute('aria-selected', state.tickets.status === tab.value ? 'true' : 'false');
        var label = document.createElement('span');
        label.textContent = tab.label;
        button.appendChild(label);
        var badge = document.createElement('span');
        badge.className = 'ticket-tab__count';
        badge.textContent = formatNumber(asNumber(count, 0));
        button.appendChild(badge);
        button.addEventListener('click', function () {
          if (state.tickets.status === tab.value) return;
          state.tickets.status = tab.value;
          loadTickets({ page: 1 });
        });
        container.appendChild(button);
      });
    }

    function renderTickets(data) {
      var payload = data || {};
      var rows = toArray(payload.rows);
      var counts = payload.counts || {};
      state.tickets.page = asNumber(payload.page, 1) || 1;
      state.tickets.totalPages = asNumber(payload.totalPages, 1) || 1;
      state.tickets.statuses = toArray(payload.filters && payload.filters.statuses);
      if (payload.filters && payload.filters.statusLabels) {
        state.tickets.statusLabels = payload.filters.statusLabels;
      }

      setTicketsBusy(false);
      renderTicketTabs(counts);
      updateTicketsBadge(counts);

      // Section options are static (renderTicketSectionOptions, from config),
      // not derived from this query's results, so the filter never disappears
      // just because today's results happen to sit in one section.

      if (normalizeText(payload.sort)) byId('tickets-sort').value = payload.sort;
      state.tickets.direction = payload.direction === 'ASC' ? 'ASC' : 'DESC';
      renderTicketsDirection();

      byId('tickets-eyebrow').textContent = payload.scope === 'OWN_SECTION'
        ? 'Findings tickets · your section'
        : 'Findings tickets · all sections';
      byId('tickets-summary').textContent = payload.totalInScope
        ? (formatNumber(asNumber(counts.ACTIVE, 0)) + ' needing attention · ' +
           formatNumber(asNumber(counts.TOTAL, 0)) + ' total' +
           (payload.total !== payload.totalInScope ? ' · ' + formatNumber(payload.total) + ' matching' : ''))
        : 'No tickets have been filed yet.';

      var body = byId('tickets-tbody');
      body.replaceChildren();
      rows.forEach(function (ticket) { body.appendChild(ticketRow(ticket)); });

      var hasRows = rows.length > 0;
      byId('tickets-table-wrap').hidden = !hasRows;
      byId('tickets-empty').hidden = hasRows;
      if (!hasRows) {
        var filtered = Boolean(payload.totalInScope);
        byId('tickets-empty-title').textContent = filtered ? 'No matches' : 'No tickets yet';
        byId('tickets-empty-message').textContent = filtered
          ? 'No ticket matches the current status, filters, or search.'
          : 'File a ticket when an asset needs fixing so the repair can be tracked to completion.';
      }

      var showingAll = payload.pageSizeMode === 'ALL';
      byId('tickets-range').textContent = payload.total
        ? ('Showing ' + formatNumber(payload.rangeStart) + '–' + formatNumber(payload.rangeEnd) +
           ' of ' + formatNumber(payload.total) +
           (showingAll ? '' : ' · page ' + state.tickets.page + ' of ' + state.tickets.totalPages))
        : 'No tickets to show';
      byId('tickets-truncated').hidden = !payload.truncated;
      if (payload.truncated) {
        byId('tickets-truncated').textContent = 'Showing the first ' + formatNumber(payload.cap) +
          ' tickets. Narrow the search or use a page size to see the rest.';
      }
      byId('tickets-jump').hidden = showingAll || state.tickets.totalPages <= 1;
      byId('tickets-prev').hidden = showingAll;
      byId('tickets-next').hidden = showingAll;
      byId('tickets-prev').disabled = state.tickets.page <= 1;
      byId('tickets-next').disabled = state.tickets.page >= state.tickets.totalPages;
      byId('tickets-page-input').max = String(state.tickets.totalPages);
      byId('tickets-page-input').value = String(state.tickets.page);
      byId('tickets-page-total').textContent = 'of ' + formatNumber(state.tickets.totalPages);
    }

    function ticketRow(ticket) {
      var row = document.createElement('tr');
      var id = normalizeText(ticket.ticketId);

      var idCell = labelledCell('Ticket');
      var idWrap = document.createElement('div');
      idWrap.className = 'archive-asset';
      var idStrong = document.createElement('strong');
      idStrong.textContent = id || '—';
      idWrap.appendChild(idStrong);
      var summary = document.createElement('small');
      summary.textContent = normalizeText(ticket.summary);
      idWrap.appendChild(summary);
      idCell.appendChild(idWrap);

      var assetCell = labelledCell('Asset');
      var assetWrap = document.createElement('div');
      assetWrap.className = 'archive-asset';
      var tag = document.createElement('strong');
      tag.textContent = normalizeText(ticket.assetTag) || '—';
      assetWrap.appendChild(tag);
      var where = document.createElement('small');
      where.textContent = normalizeText(ticket.location) || 'Location not recorded';
      assetWrap.appendChild(where);
      assetCell.appendChild(assetWrap);

      var statusCell = labelledCell('Status');
      statusCell.appendChild(ticketChip(ticket.status, TICKET_STATUS_CHIP, 'status-chip--neutral'));

      var sectionCell = labelledCell('IT section');
      sectionCell.textContent = sectionLabel(normalizeText(ticket.section));

      var updatedCell = labelledCell('Last update');
      var updatedWrap = document.createElement('div');
      updatedWrap.className = 'archive-asset';
      var when = document.createElement('span');
      when.textContent = formatDate(String(ticket.updatedAt || '').slice(0, 10));
      updatedWrap.appendChild(when);
      var who = document.createElement('small');
      who.textContent = normalizeText(ticket.updatedByName) || normalizeText(ticket.updatedBy);
      updatedWrap.appendChild(who);
      updatedCell.appendChild(updatedWrap);

      var actionCell = labelledCell('');
      var actions = document.createElement('div');
      actions.className = 'table-actions';
      var open = document.createElement('button');
      open.className = 'table-action';
      open.type = 'button';
      open.textContent = 'Open';
      open.addEventListener('click', function () { openTicketDetail(id); });
      actions.appendChild(open);
      actionCell.appendChild(actions);

      [idCell, assetCell, statusCell, sectionCell, updatedCell, actionCell]
        .forEach(function (cell) { row.appendChild(cell); });
      return row;
    }

    function updateTicketsBadge(counts) {
      var badge = byId('tickets-badge');
      if (!badge) return;
      var active = asNumber(counts && counts.ACTIVE, 0);
      badge.textContent = formatNumber(active);
      badge.hidden = active <= 0;
    }

    /** Fetched after the dashboard paints so it cannot delay first load. */
    function loadTicketSummary() {
      return serverCall('PMS_apiTicketSummary')
        .then(function (data) { updateTicketsBadge((data && data.counts) || {}); })
        .catch(function () { /* the badge is informational; stay quiet */ });
    }

    function jumpToTicketsPage() {
      var input = byId('tickets-page-input');
      var requested = Math.round(asNumber(input.value, state.tickets.page));
      var target = Math.max(1, Math.min(state.tickets.totalPages, requested));
      input.value = String(target);
      if (target === state.tickets.page) return;
      loadTickets({ page: target });
    }

    /* ------------------------------------------------------------- detail */

    function openTicketDetail(ticketId) {
      var id = normalizeText(ticketId);
      if (!id) return;
      state.tickets.currentId = id;
      setBusy(true, 'Loading ticket…');
      serverCall('PMS_apiTicketDetail', id)
        .then(function (data) {
          renderTicketDetail(data);
          showTicketsView('detail');
        })
        .catch(function (error) {
          showToast('Ticket unavailable', errorMessage(error), 'danger');
        })
        .finally(function () { setBusy(false); });
    }

    function renderTicketDetail(data) {
      var payload = data || {};
      var ticket = payload.ticket || {};
      state.tickets.currentId = normalizeText(ticket.ticketId);

      byId('ticket-detail-id').textContent = normalizeText(ticket.ticketId) || '—';
      byId('ticket-detail-summary').textContent = normalizeText(ticket.summary) || 'Findings ticket';

      var statusHolder = byId('ticket-detail-status');
      statusHolder.className = 'status-chip ' +
        (TICKET_STATUS_CHIP[normalizeText(ticket.status).toUpperCase()] || 'status-chip--neutral');
      statusHolder.textContent = ticketLabel(ticket.status);

      byId('ticket-detail-asset').textContent = normalizeText(ticket.assetTag) || '—';
      byId('ticket-detail-section').textContent = sectionLabel(normalizeText(ticket.section));
      byId('ticket-detail-location').textContent = normalizeText(ticket.location) || 'Not recorded';
      byId('ticket-detail-source').textContent = normalizeText(ticket.sourceRecordId) || 'Filed manually';
      byId('ticket-detail-cycle').textContent = normalizeText(ticket.cycleId) || '—';
      byId('ticket-detail-created').textContent = (normalizeText(ticket.createdByName) || normalizeText(ticket.createdBy) || '—') +
        ' · ' + formatDate(String(ticket.createdAt || '').slice(0, 10));

      var findings = normalizeText(ticket.findings);
      byId('ticket-detail-findings').textContent = findings || 'No findings text was recorded.';
      byId('ticket-detail-findings-block').hidden = false;
      var action = normalizeText(ticket.actionRequired);
      byId('ticket-detail-action').textContent = action || 'No action was specified.';
      byId('ticket-detail-action-block').hidden = !action;

      fillTicketSelect(byId('ticket-update-status'), toArray(payload.statuses), ticket.status);
      byId('ticket-update-remarks').value = '';
      clearFieldError('ticket-update-remarks', 'ticket-update-remarks-error');

      renderTicketHistory(toArray(payload.history));
    }

    function fillTicketSelect(select, values, selected) {
      select.replaceChildren();
      var options = toArray(values).slice();
      // A ticket still carrying a retired status must not show a blank control,
      // so its own value is offered alongside the current vocabulary.
      var current = normalizeText(selected);
      if (current && options.indexOf(current) < 0) options.unshift(current);
      options.forEach(function (value) {
        var option = document.createElement('option');
        option.value = value;
        option.textContent = ticketLabel(value);
        select.appendChild(option);
      });
      select.value = normalizeText(selected);
    }

    function renderTicketHistory(entries) {
      var list = byId('ticket-history');
      list.replaceChildren();
      if (!entries.length) {
        var empty = document.createElement('li');
        empty.className = 'ticket-history__empty';
        empty.textContent = 'No history recorded yet.';
        list.appendChild(empty);
        return;
      }
      entries.forEach(function (entry) {
        var item = document.createElement('li');
        item.className = 'ticket-history__item';

        var marker = document.createElement('span');
        marker.className = 'ticket-history__marker';
        marker.setAttribute('aria-hidden', 'true');
        marker.appendChild(iconSvg(entry.action === 'CREATED' ? 'plus'
          : entry.action === 'COMMENT' ? 'info' : 'refresh'));
        item.appendChild(marker);

        var content = document.createElement('div');
        var head = document.createElement('div');
        head.className = 'ticket-history__head';
        var actor = document.createElement('strong');
        actor.textContent = normalizeText(entry.changedByName) || normalizeText(entry.changedBy) || 'Unknown user';
        head.appendChild(actor);
        var when = document.createElement('span');
        when.textContent = normalizeText(entry.changedAt).replace('T', ' ').slice(0, 16);
        head.appendChild(when);
        content.appendChild(head);

        if (entry.action === 'STATUS_CHANGED') {
          var transition = document.createElement('p');
          transition.className = 'ticket-history__transition';
          transition.appendChild(ticketChip(entry.fromStatus, TICKET_STATUS_CHIP, 'status-chip--neutral'));
          var arrow = document.createElement('span');
          arrow.appendChild(iconSvg('arrow-right'));
          transition.appendChild(arrow);
          transition.appendChild(ticketChip(entry.toStatus, TICKET_STATUS_CHIP, 'status-chip--neutral'));
          content.appendChild(transition);
        } else {
          var badge = document.createElement('p');
          badge.className = 'ticket-history__transition';
          var kind = document.createElement('span');
          kind.className = 'status-chip status-chip--neutral';
          kind.textContent = entry.action === 'CREATED' ? 'Ticket filed' : 'Progress note';
          badge.appendChild(kind);
          content.appendChild(badge);
        }

        var remarks = document.createElement('p');
        remarks.className = 'ticket-history__remarks';
        remarks.textContent = normalizeText(entry.remarks);
        content.appendChild(remarks);

        item.appendChild(content);
        list.appendChild(item);
      });
    }

    function submitTicketUpdate(event) {
      event.preventDefault();
      var remarks = normalizeText(byId('ticket-update-remarks').value);
      clearFieldError('ticket-update-remarks', 'ticket-update-remarks-error');
      // Checked here as well as on the server so the user is told immediately.
      if (remarks.length < 3) {
        setFieldError('ticket-update-remarks', 'ticket-update-remarks-error',
          'Remarks are required. Describe what changed so the history stays auditable.');
        byId('ticket-update-remarks').focus();
        return;
      }
      setBusy(true, 'Saving ticket update…');
      // One call: the response carries the updated ticket, its history and the
      // refreshed list, so the current list request goes along with the write.
      serverCall('PMS_apiUpdateTicket', {
        ticketId: state.tickets.currentId,
        status: byId('ticket-update-status').value,
        remarks: remarks
      }, ticketsRequest({}))
        .then(function (result) {
          var changed = result && result.statusChanged;
          showToast(changed ? 'Status updated' : 'Note added',
            changed ? 'The ticket moved to ' + ticketLabel(result.ticket.status) + '.' : 'Your note was added to the history.',
            'success');
          return applyTicketWriteResult(result);
        })
        .catch(function (error) {
          setFieldError('ticket-update-remarks', 'ticket-update-remarks-error', errorMessage(error));
        })
        .finally(function () { setBusy(false); });
    }

    /**
     * Renders a write response that already contains everything.
     *
     * Falls back to separate fetches only when the server could not build the
     * refresh, so a partial response still leaves the screen consistent.
     */
    function applyTicketWriteResult(result) {
      var payload = result || {};
      // Rows, counts and totals have all just moved. The response carries the
      // page the user is looking at, but every other cached page is now a lie.
      clearListCaches();
      if (payload.history && payload.ticket) {
        renderTicketDetail({
          ticket: payload.ticket,
          history: payload.history,
          statuses: payload.statuses
        });
      }
      if (payload.list) {
        // renderTickets also refreshes the tabs and the dashboard badge.
        renderTickets(payload.list);
        return Promise.resolve(payload);
      }
      var ticketId = payload.ticket ? normalizeText(payload.ticket.ticketId) : '';
      return Promise.all([
        ticketId ? serverCall('PMS_apiTicketDetail', ticketId).then(renderTicketDetail) : Promise.resolve(),
        loadTickets({})
      ]).then(function () { return payload; });
    }

    /* ------------------------------------------------------------- create */

    var TICKET_ASSET_LIMIT = 50;

    function ticketCreateFieldIds() {
      return ['ticket-create-asset', 'ticket-create-summary', 'ticket-create-findings', 'ticket-create-action'];
    }

    function showTicketCreate(prefill) {
      var source = prefill || {};
      state.tickets.sourceRecordId = normalizeText(source.recordId);
      byId('ticket-create-form').reset();
      ticketCreateFieldIds().forEach(function (id) { clearFieldError(id, id + '-error'); });
      byId('ticket-create-error').hidden = true;

      var sections = state.sections.map(function (item) { return item.key; });
      fillTicketSelect(byId('ticket-create-section'), sections, normalizeText(source.section) || sectionKey());
      // Section labels read better than the raw keys in this form.
      Array.prototype.slice.call(byId('ticket-create-section').options).forEach(function (option) {
        option.textContent = sectionLabel(option.value);
      });

      byId('ticket-create-asset').value = normalizeText(source.assetTag);
      byId('ticket-create-location').value = normalizeText(source.location);
      byId('ticket-create-findings').value = normalizeText(source.findings);
      byId('ticket-create-action').value = normalizeText(source.actionRequired);
      byId('ticket-create-summary').value = normalizeText(source.summary);
      byId('ticket-create-context').textContent = state.tickets.sourceRecordId
        ? ('Linked to record ' + state.tickets.sourceRecordId + '. The asset, section and cycle come from that record.')
        : 'Use this when an asset needs fixing so the repair can be tracked to completion.';
      // A linked record is authoritative on the server, so these are read-only.
      byId('ticket-create-asset').readOnly = Boolean(state.tickets.sourceRecordId);
      byId('ticket-create-section').disabled = Boolean(state.tickets.sourceRecordId);
      byId('ticket-asset-combobox-toggle').disabled = Boolean(state.tickets.sourceRecordId);
      byId('ticket-create-section-help').hidden = Boolean(state.tickets.sourceRecordId);
      byId('ticket-create-status-help').textContent = normalizeText(source.assessmentResult) === 'PMS not performed'
        ? 'Filed as Deferred, since PMS could not be performed on this asset. The status is changed on the ticket itself.'
        : 'Filed as In Progress. The status is changed on the ticket itself.';

      showTicketsView('create');
      // A linked record already names the asset, so there is nothing to load.
      if (!state.tickets.sourceRecordId) loadTicketAssets(byId('ticket-create-section').value);
      else byId('ticket-create-asset-help').textContent = 'Taken from record ' + state.tickets.sourceRecordId + '.';
      window.setTimeout(function () {
        byId(state.tickets.sourceRecordId ? 'ticket-create-summary' : 'ticket-create-asset').focus();
      }, 0);
    }

    /* ------------------------------------------------------------------------
       Ticket asset picker

       Same ARIA listbox behaviour and styles as the questionnaire's picker, but
       a separate implementation on purpose: this one filters by the ticket's
       section rather than by maintenance cycle, and the questionnaire's picker
       sits on the critical path of every record, so it is left untouched.
       ------------------------------------------------------------------------ */

    function ticketAssetCombobox() {
      return {
        wrap: byId('ticket-asset-combobox'),
        input: byId('ticket-create-asset'),
        panel: byId('ticket-asset-listbox')
      };
    }

    function loadTicketAssets(sectionKey) {
      var key = normalizeText(sectionKey) || 'ALL';
      state.tickets.assetSection = key;
      if (state.tickets.assetCache[key]) {
        state.tickets.assets = state.tickets.assetCache[key];
        renderTicketAssetHelp();
        return Promise.resolve(state.tickets.assets);
      }
      state.tickets.assetsLoading = true;
      byId('ticket-create-asset-help').textContent = 'Loading assets…';
      return serverCall('PMS_apiAssetOptions', key)
        .then(function (payload) {
          var assets = toArray(payload && payload.assets).map(function (asset) {
            return {
              tag: normalizeTag(pick(asset, ['tag', 'assetTag'], '')),
              location: normalizeText(pick(asset, ['location'], '')),
              section: normalizeText(pick(asset, ['section'], ''))
            };
          }).filter(function (asset) { return Boolean(asset.tag); });
          state.tickets.assetCache[key] = assets;
          // Discard a response that a later section change has superseded.
          if (state.tickets.assetSection === key) state.tickets.assets = assets;
          renderTicketAssetHelp();
          return assets;
        })
        .catch(function (error) {
          byId('ticket-create-asset-help').textContent = 'Assets could not be loaded: ' + errorMessage(error);
          return [];
        })
        .finally(function () { state.tickets.assetsLoading = false; });
    }

    function renderTicketAssetHelp() {
      if (state.tickets.sourceRecordId) return;
      var count = state.tickets.assets.length;
      byId('ticket-create-asset-help').textContent = count
        ? ('Choose from ' + formatNumber(count) + ' assets in ' + sectionLabel(state.tickets.assetSection) + '.')
        : 'No assets are available for this section.';
    }

    function matchingTicketAssets(query) {
      var term = normalizeTag(query);
      var assets = state.tickets.assets;
      if (!term) return assets;
      var starts = [];
      var contains = [];
      assets.forEach(function (asset) {
        var position = asset.tag.indexOf(term);
        if (position === 0) starts.push(asset);
        else if (position > 0) contains.push(asset);
        else if (String(asset.location || '').toUpperCase().indexOf(term) >= 0) contains.push(asset);
      });
      return starts.concat(contains);
    }

    function renderTicketAssetList(query) {
      var parts = ticketAssetCombobox();
      var matches = matchingTicketAssets(query === undefined ? parts.input.value : query);
      state.tickets.assetCombobox.matches = matches;
      parts.panel.replaceChildren();

      if (!matches.length) {
        var empty = document.createElement('p');
        empty.className = 'combobox__empty';
        empty.textContent = state.tickets.assetsLoading
          ? 'Loading assets…'
          : (state.tickets.assets.length ? 'No asset matches that search.' : 'No assets are available for this section.');
        parts.panel.appendChild(empty);
        return;
      }

      var shown = matches.slice(0, TICKET_ASSET_LIMIT);
      if (matches.length > shown.length) {
        var count = document.createElement('p');
        count.className = 'combobox__count';
        count.textContent = 'Showing ' + shown.length + ' of ' + formatNumber(matches.length);
        parts.panel.appendChild(count);
      }

      shown.forEach(function (asset, index) {
        var option = document.createElement('button');
        option.type = 'button';
        option.className = 'combobox__option';
        option.id = 'ticket-asset-option-' + index;
        option.tabIndex = -1;
        option.setAttribute('role', 'option');
        option.setAttribute('aria-selected', asset.tag === normalizeTag(parts.input.value) ? 'true' : 'false');
        option.dataset.index = String(index);

        var tag = document.createElement('span');
        tag.className = 'combobox__option-tag';
        tag.textContent = asset.tag;
        var meta = document.createElement('span');
        meta.className = 'combobox__option-meta';
        meta.textContent = asset.location || 'Location not recorded';
        option.appendChild(tag);
        option.appendChild(meta);

        // mousedown, not click: keeps focus in the input so the blur handler
        // cannot close the panel before the selection is committed.
        option.addEventListener('mousedown', function (event) {
          event.preventDefault();
          commitTicketAsset(asset);
        });
        parts.panel.appendChild(option);
      });
    }

    function positionTicketAssetPanel() {
      if (!state.tickets.assetCombobox.open) return;
      var parts = ticketAssetCombobox();
      var rect = parts.wrap.getBoundingClientRect();
      var panel = parts.panel;
      var gap = 6;
      var margin = 12;
      var spaceBelow = window.innerHeight - rect.bottom - margin;
      var spaceAbove = rect.top - margin;
      var flipUp = spaceBelow < 170 && spaceAbove > spaceBelow;
      var available = Math.max(120, Math.min(288, flipUp ? spaceAbove : spaceBelow));
      panel.style.left = Math.round(rect.left) + 'px';
      panel.style.width = Math.round(rect.width) + 'px';
      panel.style.maxHeight = Math.round(available) + 'px';
      if (flipUp) {
        panel.style.top = 'auto';
        panel.style.bottom = Math.round(window.innerHeight - rect.top + gap) + 'px';
      } else {
        panel.style.bottom = 'auto';
        panel.style.top = Math.round(rect.bottom + gap) + 'px';
      }
    }

    function openTicketAssetList(refilter) {
      if (byId('ticket-create-asset').readOnly) return;
      var parts = ticketAssetCombobox();
      if (refilter !== false) renderTicketAssetList();
      parts.panel.hidden = false;
      parts.wrap.classList.add('is-open');
      parts.input.setAttribute('aria-expanded', 'true');
      state.tickets.assetCombobox.open = true;
      positionTicketAssetPanel();
      window.addEventListener('scroll', positionTicketAssetPanel, true);
      window.addEventListener('resize', positionTicketAssetPanel);
    }

    function closeTicketAssetList() {
      var parts = ticketAssetCombobox();
      parts.panel.hidden = true;
      parts.wrap.classList.remove('is-open');
      parts.input.setAttribute('aria-expanded', 'false');
      parts.input.removeAttribute('aria-activedescendant');
      state.tickets.assetCombobox.open = false;
      state.tickets.assetCombobox.activeIndex = -1;
      window.removeEventListener('scroll', positionTicketAssetPanel, true);
      window.removeEventListener('resize', positionTicketAssetPanel);
    }

    function highlightTicketAssetOption(index) {
      var parts = ticketAssetCombobox();
      var options = parts.panel.querySelectorAll('.combobox__option');
      if (!options.length) return;
      var bounded = Math.max(0, Math.min(options.length - 1, index));
      options.forEach(function (option) { option.classList.remove('is-active'); });
      var active = options[bounded];
      active.classList.add('is-active');
      active.scrollIntoView({ block: 'nearest' });
      parts.input.setAttribute('aria-activedescendant', active.id);
      state.tickets.assetCombobox.activeIndex = bounded;
    }

    function commitTicketAsset(asset) {
      byId('ticket-create-asset').value = asset.tag;
      // The asset master knows where it is; the field stays editable because a
      // broken asset is often not where the master says it is.
      if (asset.location && !normalizeText(byId('ticket-create-location').value)) {
        byId('ticket-create-location').value = asset.location;
      }
      clearFieldError('ticket-create-asset', 'ticket-create-asset-error');
      closeTicketAssetList();
    }

    function onTicketAssetKeydown(event) {
      var key = event.key;
      var combobox = state.tickets.assetCombobox;
      if (key === 'ArrowDown' || key === 'ArrowUp') {
        event.preventDefault();
        if (!combobox.open) {
          openTicketAssetList();
          highlightTicketAssetOption(key === 'ArrowDown' ? 0 : combobox.matches.length - 1);
          return;
        }
        highlightTicketAssetOption(combobox.activeIndex + (key === 'ArrowDown' ? 1 : -1));
        return;
      }
      if (key === 'Enter' && combobox.open && combobox.activeIndex >= 0) {
        event.preventDefault();
        var chosen = combobox.matches[combobox.activeIndex];
        if (chosen) commitTicketAsset(chosen);
        return;
      }
      if (key === 'Escape' && combobox.open) {
        event.preventDefault();
        // Otherwise Escape would also close the tickets dialog.
        event.stopPropagation();
        closeTicketAssetList();
      }
    }

    function findTicketAsset(tag) {
      var wanted = normalizeTag(tag);
      if (!wanted) return null;
      for (var index = 0; index < state.tickets.assets.length; index += 1) {
        if (state.tickets.assets[index].tag === wanted) return state.tickets.assets[index];
      }
      return null;
    }

    function fileTicketFromRecord(record) {
      var source = record || {};
      var summary = normalizeText(source.assessmentResult);
      showTicketCreate({
        recordId: normalizeText(source.recordId),
        assetTag: normalizeText(source.assetTag),
        section: normalizeText(source.section),
        location: normalizeText(source.location),
        summary: summary ? summary + ' on ' + normalizeText(source.assetTag) : '',
        assessmentResult: normalizeText(source.assessmentResult)
      });
      closeArchiveModal();
      if (!state.tickets.open) openTicketsModal('create');
    }

    function submitTicketCreate(event) {
      event.preventDefault();
      var assetTag = normalizeTag(byId('ticket-create-asset').value);
      var summary = normalizeText(byId('ticket-create-summary').value);
      var findings = normalizeText(byId('ticket-create-findings').value);
      var actionRequired = normalizeText(byId('ticket-create-action').value);
      ticketCreateFieldIds().forEach(function (id) { clearFieldError(id, id + '-error'); });
      byId('ticket-create-error').hidden = true;

      // Mirrors the server's requirements so the user is told immediately.
      if (!state.tickets.sourceRecordId) {
        if (!assetTag) {
          setFieldError('ticket-create-asset', 'ticket-create-asset-error', 'Choose the asset that needs fixing.');
          byId('ticket-create-asset').focus();
          return;
        }
        // The field is a picker, so a tag that is not on the list is a typo.
        if (state.tickets.assets.length && !findTicketAsset(assetTag)) {
          setFieldError('ticket-create-asset', 'ticket-create-asset-error',
            'Select an asset from the list. ' + assetTag + ' is not in ' + sectionLabel(byId('ticket-create-section').value) + '.');
          byId('ticket-create-asset').focus();
          return;
        }
      }
      if (!summary) {
        setFieldError('ticket-create-summary', 'ticket-create-summary-error', 'Describe what needs fixing.');
        byId('ticket-create-summary').focus();
        return;
      }
      // With a linked record the server fills these from the record itself when
      // they are left blank, so only an unlinked ticket can be checked here.
      // The server enforces the requirement either way.
      if (!state.tickets.sourceRecordId) {
        if (!findings) {
          setFieldError('ticket-create-findings', 'ticket-create-findings-error', 'Record what was found on the asset.');
          byId('ticket-create-findings').focus();
          return;
        }
        if (!actionRequired) {
          setFieldError('ticket-create-action', 'ticket-create-action-error', 'State what has to happen before this can be closed.');
          byId('ticket-create-action').focus();
          return;
        }
      }

      setBusy(true, 'Filing ticket…');
      // Every new ticket is In progress, so it belongs in the "needs attention"
      // bucket. Switching the filter before the call means the list that comes
      // back with the response already contains it.
      state.tickets.status = 'ACTIVE';
      // No status is sent: the server files as In Progress, and closing happens
      // from the ticket's own page.
      serverCall('PMS_apiCreateTicket', {
        sourceRecordId: state.tickets.sourceRecordId,
        assetTag: assetTag,
        section: byId('ticket-create-section').value,
        location: normalizeText(byId('ticket-create-location').value),
        summary: summary,
        findings: findings,
        actionRequired: actionRequired,
        remarks: normalizeText(byId('ticket-create-remarks').value)
      }, ticketsRequest({ page: 1 }))
        .then(function (result) {
          var ticket = (result && result.ticket) || {};
          var ticketId = normalizeText(ticket.ticketId);
          showToast('Ticket filed', ticketId + ' is now tracked as ' + ticketLabel(ticket.status) + '.', 'success');
          return applyTicketWriteResult(result).then(function () {
            showTicketsView(ticketId && result.history ? 'detail' : 'list');
            if (ticketId && !result.history) openTicketDetail(ticketId);
          });
        })
        .catch(function (error) {
          var target = byId('ticket-create-error');
          target.hidden = false;
          target.textContent = errorMessage(error);
        })
        .finally(function () { setBusy(false); });
    }

    /* ------------------------------------------------------------------------
       Filing a ticket from the questionnaire

       Step 4 is where findings get written, so it is also where a repair ticket
       is raised. The ticket is posted from inside the questionnaire rather than
       by opening the tickets dialog: layering that dialog on top would put a
       second focus trap on the page and cost the technician their place in the
       form mid-assessment.
       ------------------------------------------------------------------------ */

    function resetRecordTicket() {
      if (!byId('record-ticket-body')) return;
      state.recordTickets = [];
      closeRecordTicketForm('File a ticket');
      byId('record-ticket-remarks').value = '';
      byId('record-ticket-error').hidden = true;
      renderRecordTicketsFiled();
      updateRecordTicketRequirement();
    }

    /**
     * "Follow-up required" and "PMS not performed" both leave work outstanding
     * — one on the asset, one on the visit itself — so both force a ticket.
     * "Findings resolved" was dealt with during the maintenance, and
     * "No findings" had nothing to deal with.
     */
    function recordNeedsTicket() {
      var result = normalizeText(byId('assessment-result').value);
      return result === 'Follow-up required' || result === 'PMS not performed';
    }

    /**
     * Whether filing is worth offering at all. "Findings resolved" may still be
     * worth tracking, so the panel stays available without being demanded.
     */
    function recordAllowsTicket() {
      var result = normalizeText(byId('assessment-result').value);
      return result === 'Follow-up required' || result === 'Findings resolved' || result === 'PMS not performed';
    }

    function recordTicketCount() {
      return (state.recordTickets || []).length;
    }

    /**
     * A findings assessment must be backed by a ticket, so the panel changes
     * from an option into a requirement as soon as the result says findings.
     * The server enforces the same rule at completion.
     */
    function updateRecordTicketRequirement() {
      if (!byId('record-ticket')) return;
      var needed = recordNeedsTicket();
      var offered = recordAllowsTicket();
      var filed = recordTicketCount() > 0;
      var notPerformed = normalizeText(byId('assessment-result').value) === 'PMS not performed';
      // Hidden for a clean assessment unless a ticket was filed anyway.
      byId('record-ticket').hidden = !offered && !filed;
      byId('record-ticket-eyebrow').textContent = needed && !filed ? 'Required before completing' : 'Findings ticket';
      byId('record-ticket').classList.toggle('record-ticket--required', needed && !filed);
      byId('record-ticket-title').textContent = filed
        ? (notPerformed ? 'This revisit is being tracked' : 'This repair is being tracked')
        : needed
          ? (notPerformed ? 'Track the revisit before completing' : 'Track the repair before completing')
          : 'Track this repair as well?';
      byId('record-ticket-intro').textContent = filed
        ? 'The ticket below carries this finding. Any user can move it along, and the section tracker follows its status.'
        : needed
          ? (notPerformed
            ? 'PMS could not be performed on this asset, so PMS cannot be completed until a ticket exists to track the revisit.'
            : 'This assessment needs follow-up, so PMS cannot be completed until a ticket exists to follow the repair.')
          : 'The findings were resolved during maintenance, so a ticket is optional. File one only if something still needs watching.';
      byId('record-ticket-toggle-label').textContent = byId('record-ticket-body').hidden
        ? (filed ? 'File another ticket' : 'File a ticket')
        : 'Hide ticket form';
      renderRecordTicketDerived();
    }

    /**
     * Echoes what the server will copy out of this record. Read-only on purpose:
     * the assessment fields above are the single place this text is edited.
     */
    function renderRecordTicketDerived() {
      var target = byId('record-ticket-derived');
      if (!target) return;
      var findings = normalizeText(byId('asset-findings').value);
      var action = normalizeText(byId('recommendation').value);
      target.replaceChildren();
      var intro = document.createElement('p');
      intro.textContent = 'The ticket copies these from the assessment above:';
      target.appendChild(intro);
      var list = document.createElement('dl');
      [['Findings', findings, 'Add the asset findings above.'],
       ['Action required', action, 'Add a recommendation above.']].forEach(function (entry) {
        var wrap = document.createElement('div');
        var term = document.createElement('dt');
        term.textContent = entry[0];
        var value = document.createElement('dd');
        value.textContent = entry[1] || entry[2];
        if (!entry[1]) value.className = 'is-missing';
        wrap.appendChild(term);
        wrap.appendChild(value);
        list.appendChild(wrap);
      });
      target.appendChild(list);
    }

    function closeRecordTicketForm(label) {
      byId('record-ticket-body').hidden = true;
      byId('record-ticket-toggle').setAttribute('aria-expanded', 'false');
      byId('record-ticket-toggle-label').textContent = label;
    }

    function toggleRecordTicket() {
      var body = byId('record-ticket-body');
      if (!body.hidden) {
        closeRecordTicketForm(state.recordTickets.length ? 'File another ticket' : 'File a ticket');
        return;
      }
      body.hidden = false;
      byId('record-ticket-toggle').setAttribute('aria-expanded', 'true');
      byId('record-ticket-toggle-label').textContent = 'Hide ticket form';
      renderRecordTicketDerived();
      window.setTimeout(function () { byId('record-ticket-remarks').focus(); }, 0);
    }

    function renderRecordTicketsFiled() {
      var list = byId('record-ticket-filed');
      var filed = state.recordTickets || [];
      list.replaceChildren();
      list.hidden = !filed.length;
      filed.forEach(function (ticket) {
        var item = document.createElement('li');
        var id = document.createElement('strong');
        id.textContent = ticket.ticketId;
        item.appendChild(id);
        item.appendChild(ticketChip(ticket.status, TICKET_STATUS_CHIP, 'status-chip--neutral'));
        var summary = document.createElement('span');
        summary.textContent = ticket.summary;
        item.appendChild(summary);
        list.appendChild(item);
      });
    }

    function submitRecordTicket() {
      byId('record-ticket-error').hidden = true;
      clearFieldError('asset-findings', 'asset-findings-error');
      clearFieldError('recommendation', 'recommendation-error');
      clearFormAlert();

      // The ticket carries the asset, section and cycle of this record, so the
      // record has to be complete enough to persist as a draft first.
      if (!validateCoreFields(true)) {
        setStep(1, false);
        return;
      }

      // The server copies the ticket's findings and required action out of the
      // record, so the errors belong on the assessment fields themselves rather
      // than on duplicates inside this panel.
      var findings = normalizeText(byId('asset-findings').value);
      var action = normalizeText(byId('recommendation').value);
      if (!findings) {
        setFieldError('asset-findings', 'asset-findings-error', 'Describe the findings before filing a ticket. The ticket copies this text.');
        byId('asset-findings').focus();
        renderRecordTicketDerived();
        return;
      }
      if (!action) {
        setFieldError('recommendation', 'recommendation-error', 'State the recommendation before filing a ticket. It becomes the ticket’s required action.');
        byId('recommendation').focus();
        renderRecordTicketDerived();
        return;
      }

      var assetTag = state.selectedAsset ? state.selectedAsset.tag : normalizeTag(byId('asset-tag').value);
      var result = normalizeText(byId('assessment-result').value);
      setBusy(true, 'Saving draft and filing ticket…');
      /*
        One round trip instead of two: PMS_apiFileTicketForRecord saves the
        draft and files the ticket against it server-side, in that order,
        under its own two locks. Filing this way used to cost two sequential
        google.script.run calls, and each one pays roughly half a second of
        Apps Script round-trip overhead before any work even starts — most of
        what made this feel slow. Only the record link and optional remarks
        are sent for the ticket half; the server copies the findings and the
        required action from the record, and picks its starting status from
        the assessment (Deferred for "PMS not performed", In Progress
        otherwise). A tiny page is requested because only the counts are
        needed here, for the dashboard badge.
      */
      serverCall('PMS_apiFileTicketForRecord', buildPayload(), {
        summary: (result ? result + ' on ' : 'Needs fixing: ') + assetTag,
        remarks: normalizeText(byId('record-ticket-remarks').value)
      }, { page: 1, pageSize: 5, status: 'ACTIVE' })
        .then(function (payload) {
          state.recordId = normalizeText(payload.recordId) || state.recordId;
          state.loadedAssetTag = assetTag || state.loadedAssetTag;
          state.submittedCompletion = normalizeText(payload.pmsCompletion);
          if (!state.recordId) {
            throw clientError('The draft was saved without a record ID. Save progress and try again.', 'DRAFT_ID_MISSING');
          }
          byId('record-save-state').textContent = 'Draft ' + state.recordId + ' saved';
          // Everything the payload carries is now persisted.
          state.dirty = false;

          var ticket = payload.ticket || {};
          state.recordTickets = (state.recordTickets || []).concat([{
            ticketId: normalizeText(ticket.ticketId),
            status: normalizeText(ticket.status),
            summary: normalizeText(ticket.summary)
          }]);
          renderRecordTicketsFiled();
          closeRecordTicketForm('File another ticket');
          clearListCaches();
          byId('record-ticket-remarks').value = '';
          updateRecordTicketRequirement();
          updateFooterActions();
          showToast('Ticket filed',
            normalizeText(ticket.ticketId) + ' is now tracking ' + assetTag + ' as ' + ticketLabel(ticket.status) + '.', 'success');
          // The counts came back with the write, so the badge needs no extra call.
          if (payload.list && payload.list.counts) updateTicketsBadge(payload.list.counts);
          else loadTicketSummary();
        })
        .catch(function (error) {
          var target = byId('record-ticket-error');
          target.hidden = false;
          target.textContent = errorMessage(error);
          state.dirty = true;
        })
        .finally(function () { setBusy(false); });
    }

    /* ------------------------------------------------------------------------
       Administrator legacy PMS import

       Files are parsed locally; the server receives only normalized form data.
       Preview and execution remain server-authoritative and admin-scoped.
       ------------------------------------------------------------------------ */

    function syncBodyModalState() {
      var importOpen = Boolean(state.legacyImport && state.legacyImport.open);
      var ticketsOpen = Boolean(state.tickets && state.tickets.open);
      document.body.classList.toggle('modal-open', Boolean(state.modalOpen || state.archive.open || importOpen || ticketsOpen));
    }

    function modalFocusable(root) {
      if (!root) return [];
      return Array.prototype.slice.call(root.querySelectorAll(
        'button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [href], [tabindex]:not([tabindex="-1"])'
      )).filter(function (element) {
        return !element.hidden && element.offsetParent !== null;
      });
    }

    function renderLegacyImportOptions() {
      var select = byId('legacy-import-section');
      if (!select) return;
      var isAdmin = userIsAdmin();
      // A technician can import only their own registered section — the
      // server enforces this regardless, but there is no point offering a
      // choice that will always be rejected.
      var offered = isAdmin ? state.sections : state.sections.filter(function (section) {
        return section.key === sectionKey();
      });
      while (select.options.length > 1) select.remove(1);
      offered.forEach(function (section) {
        var option = document.createElement('option');
        option.value = section.key;
        option.textContent = section.label;
        select.appendChild(option);
      });
      if (offered.some(function (section) { return section.key === sectionKey(); })) {
        select.value = sectionKey();
      }
      select.disabled = !isAdmin;
      byId('legacy-import-eyebrow').textContent = isAdmin ? 'Administrator tool' : 'Legacy PMS';
      byId('legacy-import-scope-note').textContent = isAdmin
        ? 'As an administrator, you can import into any section, including a year other than the currently open tracker year.'
        : 'Scoped to ' + sectionLabel(sectionKey()) + ' in the currently open tracker year. Ask an administrator for a different section or an older year.';
    }

    function clearLegacyImportAlert() {
      byId('legacy-import-alert').hidden = true;
      byId('legacy-import-alert-title').textContent = 'Review the import details';
      byId('legacy-import-alert-message').textContent = '';
    }

    function showLegacyImportAlert(title, message) {
      byId('legacy-import-alert-title').textContent = normalizeText(title) || 'Legacy PMS import needs attention';
      byId('legacy-import-alert-message').textContent = normalizeText(message);
      byId('legacy-import-alert').hidden = false;
      byId('legacy-import-alert').focus();
    }

    function clearLegacyImportFieldErrors() {
      [
        ['legacy-import-section', 'legacy-import-section-error'],
        ['legacy-import-maintenance-date', 'legacy-import-maintenance-date-error'],
        ['legacy-import-tags', 'legacy-import-tags-error'],
        ['legacy-import-file', 'legacy-import-file-error'],
        ['legacy-import-confirmation-input', 'legacy-import-confirmation-error']
      ].forEach(function (ids) { clearFieldError(ids[0], ids[1]); });
    }

    function legacyImportHeader(value) {
      return ['ASSET TAG', 'ASSET_TAG', 'ASSETTAG', 'TAG', 'TAGGING'].indexOf(normalizeTag(value)) >= 0;
    }

    function parseLegacyImportTags(text) {
      var source = String(text || '').replace(/^\uFEFF/, '');
      var values = source.split(/[\r\n,;\t]+/);
      var unique = [];
      var duplicates = [];
      var duplicateCount = 0;
      var seen = {};
      values.forEach(function (value, index) {
        var tag = normalizeTag(value);
        if (!tag || legacyImportHeader(tag)) return;
        if (seen[tag] !== undefined) {
          duplicateCount += 1;
          if (duplicates.length < LEGACY_IMPORT_TABLE_CAP) {
            duplicates.push({ assetTag: tag, inputIndex: index + 1, firstIndex: seen[tag] });
          }
          return;
        }
        seen[tag] = index + 1;
        unique.push(tag);
      });
      return {
        uniqueTags: unique,
        duplicateRows: duplicates,
        duplicateCount: duplicateCount
      };
    }

    function updateLegacyImportLocalCount() {
      var parsed = parseLegacyImportTags(byId('legacy-import-tags').value);
      var label = parsed.uniqueTags.length + ' unique tag' + (parsed.uniqueTags.length === 1 ? '' : 's');
      if (parsed.duplicateCount) label += ' · ' + parsed.duplicateCount + ' duplicate' + (parsed.duplicateCount === 1 ? '' : 's');
      byId('legacy-import-tag-count').textContent = label;
      return parsed;
    }

    function updateLegacyImportCycle() {
      var derived = deriveCycle(byId('legacy-import-maintenance-date').value);
      byId('legacy-import-cycle-value').textContent = derived ? derived.cycleId : 'Choose a date';
      var detail = derived
        ? 'Every valid asset will be recorded in ' + derived.cycleId + '. The server preview will confirm tracker impact.'
        : 'The server will confirm whether this updates the live tracker or creates a historical record only.';
      if (!userIsAdmin()) {
        detail += ' A date outside the currently open tracker year requires an administrator.';
      }
      byId('legacy-import-cycle-detail').textContent = detail;
    }

    function csvFirstColumn(text) {
      return String(text || '').replace(/^\uFEFF/, '').split(/\r?\n/).map(function (line) {
        var value = '';
        var quoted = false;
        for (var index = 0; index < line.length; index += 1) {
          var character = line.charAt(index);
          if (character === '"') {
            if (quoted && line.charAt(index + 1) === '"') {
              value += '"';
              index += 1;
            } else {
              quoted = !quoted;
            }
          } else if (character === ',' && !quoted) {
            break;
          } else {
            value += character;
          }
        }
        return value.trim();
      }).filter(function (value) { return value && !legacyImportHeader(value); }).join('\n');
    }

    function readLocalTextFile(file) {
      if (file && typeof file.text === 'function') return file.text();
      return new Promise(function (resolve, reject) {
        var reader = new FileReader();
        reader.onload = function () { resolve(String(reader.result || '')); };
        reader.onerror = function () { reject(new Error('The selected file could not be read.')); };
        reader.readAsText(file);
      });
    }

    function invalidateLegacyImportPreview() {
      state.legacyImport.requestToken += 1;
      state.legacyImport.request = null;
      state.legacyImport.preview = null;
      state.legacyImport.confirmationToken = '';
      state.legacyImport.execution = null;
      byId('legacy-import-review-confirm').checked = false;
      byId('legacy-import-confirmation-input').value = '';
    }

    function markLegacyImportDirty() {
      if (!state.legacyImport.open || state.legacyImport.stage !== 'PREPARE') return;
      state.legacyImport.dirty = true;
      invalidateLegacyImportPreview();
      clearLegacyImportAlert();
      updateLegacyImportConfirmState();
    }

    function resetLegacyImport() {
      var lastFocus = state.legacyImport.lastFocus;
      var open = state.legacyImport.open;
      state.legacyImport = {
        open: open,
        stage: 'PREPARE',
        dirty: false,
        busy: false,
        requestToken: (state.legacyImport.requestToken || 0) + 1,
        lastFocus: lastFocus,
        request: null,
        preview: null,
        confirmationToken: '',
        execution: null
      };
      byId('legacy-import-form').reset();
      renderLegacyImportOptions();
      byId('legacy-import-maintenance-date').max = currentManilaDate();
      byId('legacy-import-preview-body').replaceChildren();
      byId('legacy-import-results-body').replaceChildren();
      byId('legacy-import-file-status').querySelector('span').textContent = 'No local file selected';
      byId('legacy-import-preview-truncated').hidden = true;
      byId('legacy-import-results-truncated').hidden = true;
      byId('legacy-import-state').textContent = '';
      clearLegacyImportAlert();
      clearLegacyImportFieldErrors();
      updateLegacyImportLocalCount();
      updateLegacyImportCycle();
      setLegacyImportStage('PREPARE', false);
    }

    function setLegacyImportStage(stage, focusStage) {
      var next = ['PREPARE', 'REVIEW', 'RESULTS'].indexOf(stage) >= 0 ? stage : 'PREPARE';
      state.legacyImport.stage = next;
      document.querySelectorAll('[data-legacy-import-panel]').forEach(function (panel) {
        panel.hidden = panel.dataset.legacyImportPanel !== next;
      });
      document.querySelectorAll('[data-legacy-import-stage]').forEach(function (item) {
        var current = item.dataset.legacyImportStage === next;
        var order = ['PREPARE', 'REVIEW', 'RESULTS'];
        item.classList.toggle('is-current', current);
        item.classList.toggle('is-complete', order.indexOf(item.dataset.legacyImportStage) < order.indexOf(next));
        if (current) item.setAttribute('aria-current', 'step');
        else item.removeAttribute('aria-current');
      });
      var prepare = next === 'PREPARE';
      var review = next === 'REVIEW';
      var results = next === 'RESULTS';
      byId('legacy-import-cancel').hidden = results;
      byId('legacy-import-edit').hidden = !review;
      byId('legacy-import-preview-button').hidden = !prepare;
      byId('legacy-import-confirm').hidden = !review;
      byId('legacy-import-again').hidden = !results;
      byId('legacy-import-done').hidden = !results;
      updateLegacyImportConfirmState();
      byId('legacy-import-dialog-body').scrollTop = 0;
      if (focusStage !== false) {
        window.setTimeout(function () {
          var target = byId(next === 'PREPARE' ? 'legacy-import-section' : next === 'REVIEW' ? 'legacy-import-review' : 'legacy-import-results');
          if (target && typeof target.focus === 'function') target.focus();
        }, 0);
      }
    }

    function setLegacyImportBusy(isBusy, message) {
      state.legacyImport.busy = Boolean(isBusy);
      byId('legacy-import-modal').setAttribute('aria-busy', state.legacyImport.busy ? 'true' : 'false');
      byId('legacy-import-spinner').hidden = !state.legacyImport.busy;
      byId('legacy-import-state').textContent = normalizeText(message);
      byId('legacy-import-close').disabled = state.legacyImport.busy;
      byId('legacy-import-form').querySelectorAll('button, input, select, textarea').forEach(function (control) {
        control.disabled = state.legacyImport.busy;
      });
      if (!state.legacyImport.busy) updateLegacyImportConfirmState();
    }

    function openLegacyImport() {
      if (state.modalOpen || state.archive.open || state.legacyImport.open) return;
      state.legacyImport.lastFocus = document.activeElement;
      state.legacyImport.open = true;
      resetLegacyImport();
      byId('legacy-import-modal').hidden = false;
      syncBodyModalState();
      window.setTimeout(function () { byId('legacy-import-section').focus(); }, 0);
    }

    function requestCloseLegacyImport(force) {
      if (!state.legacyImport.open || state.legacyImport.busy) return;
      if (!force && state.legacyImport.dirty &&
          !window.confirm('Close this legacy PMS import? The prepared batch and preview will be lost.')) return;
      var target = state.legacyImport.lastFocus;
      state.legacyImport.open = false;
      state.legacyImport.dirty = false;
      state.legacyImport.requestToken += 1;
      byId('legacy-import-modal').hidden = true;
      syncBodyModalState();
      if (target && typeof target.focus === 'function') target.focus();
    }

    function onLegacyImportFileChange() {
      var input = byId('legacy-import-file');
      var file = input.files && input.files.length ? input.files[0] : null;
      clearFieldError('legacy-import-file', 'legacy-import-file-error');
      if (!file) {
        byId('legacy-import-file-status').querySelector('span').textContent = 'No local file selected';
        return;
      }
      if (file.size <= 0 || file.size > LEGACY_IMPORT_FILE_MAX_BYTES) {
        var sizeMessage = file.size <= 0 ? 'Choose a non-empty CSV or TXT file.' : 'Choose a file no larger than 2 MiB.';
        setFieldError('legacy-import-file', 'legacy-import-file-error', sizeMessage);
        input.value = '';
        byId('legacy-import-file-status').querySelector('span').textContent = 'Local file was not loaded';
        return;
      }
      var extension = normalizeText(file.name).toLowerCase();
      if (!/\.(csv|txt)$/.test(extension) && ['text/csv', 'text/plain', ''].indexOf(normalizeText(file.type).toLowerCase()) < 0) {
        setFieldError('legacy-import-file', 'legacy-import-file-error', 'Choose a CSV or TXT file.');
        input.value = '';
        return;
      }
      var fileReadToken = state.legacyImport.requestToken + 1;
      state.legacyImport.requestToken = fileReadToken;
      setLegacyImportBusy(true, 'Reading ' + file.name + ' locally...');
      byId('legacy-import-file-status').querySelector('span').textContent = 'Reading ' + file.name + '…';
      readLocalTextFile(file).then(function (content) {
        if (!state.legacyImport.open || fileReadToken !== state.legacyImport.requestToken) return;
        var importedText = /\.csv$/i.test(file.name) ? csvFirstColumn(content) : String(content || '').replace(/^\uFEFF/, '');
        var parsed = parseLegacyImportTags(importedText);
        if (!parsed.uniqueTags.length) throw new Error('No asset tags were found in the selected file.');
        var textarea = byId('legacy-import-tags');
        textarea.value = [textarea.value.trim(), importedText.trim()].filter(Boolean).join('\n');
        byId('legacy-import-file-status').querySelector('span').textContent = file.name + ' · ' + parsed.uniqueTags.length + ' tag' + (parsed.uniqueTags.length === 1 ? '' : 's') + ' added';
        markLegacyImportDirty();
        updateLegacyImportLocalCount();
      }).catch(function (error) {
        if (!state.legacyImport.open || fileReadToken !== state.legacyImport.requestToken) return;
        setFieldError('legacy-import-file', 'legacy-import-file-error', errorMessage(error));
        input.value = '';
        byId('legacy-import-file-status').querySelector('span').textContent = 'Local file was not loaded';
      }).finally(function () {
        if (state.legacyImport.open) setLegacyImportBusy(false, '');
      });
    }

    function legacyImportNumeric(source, keys) {
      var object = source || {};
      for (var index = 0; index < keys.length; index += 1) {
        var value = object[keys[index]];
        if (value === '' || value === null || value === undefined) continue;
        var number = Number(value);
        if (Number.isFinite(number)) return Math.max(0, Math.round(number));
      }
      return null;
    }

    function legacyImportObject(source, keys) {
      var value = pick(source, keys, null);
      return value && typeof value === 'object' && !Array.isArray(value) ? value : null;
    }

    function canonicalLegacyPreviewStatus(value) {
      var status = normalizeText(value).toUpperCase().replace(/[\s-]+/g, '_');
      if (/DUPLICATE|REPEATED/.test(status)) return 'DUPLICATE';
      if (/ALREADY|COMPLETED|EXISTING|PREVIOUSLY_DONE/.test(status)) return 'ALREADY_COMPLETED';
      if (/READY|RESUMABLE|VALID|ELIGIBLE|IMPORTABLE|WILL_IMPORT/.test(status)) return 'READY';
      return 'INVALID';
    }

    function canonicalLegacyResultStatus(value) {
      var status = normalizeText(value).toUpperCase().replace(/[\s-]+/g, '_');
      if (/SYNC_FAILED|FAIL|ERROR|REJECT/.test(status)) return 'FAILED';
      if (/RESUMED|RESUME/.test(status)) return 'RESUMED';
      if (/SKIP|ALREADY|DUPLICATE|UNCHANGED/.test(status)) return 'SKIPPED';
      if (/IMPORT|SAVED|CREATED|COMPLETE|SUCCESS/.test(status)) return 'IMPORTED';
      return status || 'SKIPPED';
    }

    function legacyImportRows(source, resultMode) {
      var data = source || {};
      var direct = pick(data, ['rows', 'items', 'results', 'classifications', 'records'], null);
      var rows = Array.isArray(direct) ? direct.slice() : [];
      if (!rows.length && !resultMode) {
        [
          ['readyRows', 'ready'],
          ['validRows', 'ready'],
          ['invalidRows', 'invalid'],
          ['duplicateRows', 'duplicate'],
          ['alreadyCompletedRows', 'already_completed'],
          ['completedRows', 'already_completed']
        ].forEach(function (entry) {
          toArray(data[entry[0]]).forEach(function (row) {
            if (row && typeof row === 'object') rows.push(Object.assign({ classification: entry[1] }, row));
            else rows.push({ assetTag: row, classification: entry[1] });
          });
        });
      }
      return rows.map(function (row) {
        if (row && typeof row === 'object') return row;
        return { assetTag: row };
      });
    }

    function legacyImportRowTag(row) {
      return normalizeTag(pick(row, ['assetTag', 'tag', 'asset', 'input', 'rawTag', 'tagging'], ''));
    }

    function legacyPreviewStatus(row) {
      return canonicalLegacyPreviewStatus(pick(row, ['classification', 'status', 'result', 'outcome', 'category'], ''));
    }

    function legacyResultStatus(row) {
      return canonicalLegacyResultStatus(pick(row, ['result', 'status', 'outcome', 'classification'], ''));
    }

    function legacyImportReason(row) {
      var message = normalizeText(pick(row, ['reason', 'message', 'detail', 'details', 'explanation', 'note'], ''));
      var warnings = toArray(row && row.warnings).map(function (warning) {
        if (warning && typeof warning === 'object') return normalizeText(pick(warning, ['message', 'detail', 'warning'], ''));
        return normalizeText(warning);
      }).filter(Boolean);
      return [message, warnings.join(' | ')].filter(Boolean).join(' | ');
    }

    function legacyImportAssetDetails(row) {
      var details = [];
      var type = normalizeText(pick(row, ['assetType', 'type', 'category'], ''));
      var location = normalizeText(pick(row, ['location', 'site', 'assignedLocation'], ''));
      var assetStatus = normalizeText(pick(row, ['assetStatus', 'productionStatus', 'trackerStatus'], ''));
      if (type) details.push(type);
      if (location) details.push(location);
      if (assetStatus) details.push(assetStatus);
      return details.join(' | ') || 'No additional details';
    }

    function statusChip(status, resultMode) {
      var chip = document.createElement('span');
      var tone;
      if (resultMode) {
        tone = status === 'IMPORTED' || status === 'RESUMED' ? 'success' : status === 'FAILED' ? 'danger' : 'neutral';
      } else {
        tone = status === 'READY' ? 'success' : status === 'INVALID' ? 'danger' : status === 'DUPLICATE' ? 'warning' : 'neutral';
      }
      chip.className = 'status-chip status-chip--' + tone;
      chip.textContent = status.replace(/_/g, ' ');
      return chip;
    }

    function legacyPreviewCounts(data, rows, localDuplicates) {
      var nested = legacyImportObject(data, ['counts', 'summary', 'totals']) || data || {};
      var calculated = { ready: 0, invalid: 0, duplicate: 0, completed: 0 };
      rows.forEach(function (row) {
        var status = legacyPreviewStatus(row);
        if (status === 'READY') calculated.ready += 1;
        else if (status === 'DUPLICATE') calculated.duplicate += 1;
        else if (status === 'ALREADY_COMPLETED') calculated.completed += 1;
        else calculated.invalid += 1;
      });
      var ready = legacyImportNumeric(nested, ['ready', 'valid', 'eligible', 'toImport', 'importable']);
      if (ready === null) {
        var newRecords = legacyImportNumeric(nested, ['newRecords']);
        var resumable = legacyImportNumeric(nested, ['resumable']);
        if (newRecords !== null || resumable !== null) ready = (newRecords || 0) + (resumable || 0);
      }
      var invalid = legacyImportNumeric(nested, ['invalid', 'notFound', 'rejected', 'ineligible']);
      var duplicate = legacyImportNumeric(nested, ['duplicate', 'duplicates', 'duplicateInput', 'repeated']);
      var completed = legacyImportNumeric(nested, ['alreadyCompleted', 'completed', 'existing', 'previouslyCompleted']);
      return {
        ready: ready === null ? calculated.ready : ready,
        invalid: invalid === null ? calculated.invalid : invalid,
        duplicate: (duplicate === null ? calculated.duplicate : duplicate) + localDuplicates,
        completed: completed === null ? calculated.completed : completed
      };
    }

    function normalizeLegacyPreview(data, request, parsed) {
      var response = data || {};
      var rows = legacyImportRows(response, false);
      var totalRows = rows.length + parsed.duplicateCount;
      parsed.duplicateRows.forEach(function (duplicate) {
        rows.push({
          assetTag: duplicate.assetTag,
          classification: 'DUPLICATE',
          reason: 'Repeated in the pasted or loaded list; only the first occurrence was sent for validation.'
        });
      });
      var confirmation = legacyImportObject(response, ['confirmation', 'authorization']) || {};
      var rawMode = normalizeText(pick(response, ['mode', 'trackerMode', 'writeMode', 'impactMode'], pick(confirmation, ['mode'], ''))).toUpperCase();
      var historical = response.historicalOnly === true || response.updatesTracker === false || /HISTORICAL|RECORD_ONLY|NO_TRACKER/.test(rawMode);
      var tracker = response.updatesTracker === true || /TRACKER|CURRENT_CYCLE|CURRENT_YEAR/.test(rawMode);
      var counts = legacyPreviewCounts(response, rows.filter(function (row) {
        return legacyPreviewStatus(row) !== 'DUPLICATE' || !/Repeated in the pasted/.test(legacyImportReason(row));
      }), parsed.duplicateCount);
      return {
        raw: response,
        request: request,
        rows: rows,
        totalRows: totalRows,
        counts: counts,
        confirmationToken: normalizeText(pick(response, ['confirmationToken', 'previewToken', 'token'], pick(confirmation, ['token', 'confirmationToken'], ''))),
        confirmationPhrase: normalizeText(pick(response, ['confirmationPhrase', 'phrase'], pick(confirmation, ['phrase', 'confirmationPhrase'], ''))),
        mode: historical ? 'HISTORICAL' : tracker ? 'TRACKER' : 'UNKNOWN',
        modeLabel: normalizeText(pick(response, ['modeLabel', 'trackerModeLabel', 'impactLabel'], '')),
        cycleId: normalizeText(pick(response, ['cycleId', 'maintenanceCycle', 'cycle'], deriveCycle(request.maintenanceDate).cycleId)),
        trackerYear: legacyImportNumeric(response, ['trackerYear', 'currentTrackerYear', 'activeYear'])
      };
    }

    function appendLegacyPreviewRow(body, row) {
      var status = legacyPreviewStatus(row);
      var tableRow = document.createElement('tr');
      var tagCell = labelledCell('Asset tag');
      var detailCell = labelledCell('Asset details');
      var resultCell = labelledCell('Result');
      var reasonCell = labelledCell('Explanation');
      tagCell.textContent = legacyImportRowTag(row) || 'Unknown tag';
      detailCell.textContent = legacyImportAssetDetails(row);
      resultCell.appendChild(statusChip(status, false));
      reasonCell.textContent = legacyImportReason(row) || (
        status === 'READY' ? 'Eligible for legacy PMS import.' :
          status === 'ALREADY_COMPLETED' ? 'A completed record already exists for this cycle.' :
            status === 'DUPLICATE' ? 'Repeated input.' : 'This tag cannot be imported.'
      );
      [tagCell, detailCell, resultCell, reasonCell].forEach(function (cell) { tableRow.appendChild(cell); });
      body.appendChild(tableRow);
    }

    function renderLegacyImportImpact(preview) {
      var notice = byId('legacy-import-impact-notice');
      notice.classList.remove('notice--info', 'notice--warning');
      var derived = deriveCycle(preview.request.maintenanceDate);
      if (preview.mode === 'HISTORICAL') {
        notice.classList.add('notice--warning');
        byId('legacy-import-impact-title').textContent = preview.modeLabel || 'Historical records only';
        byId('legacy-import-impact-detail').textContent = 'These records use ' + preview.cycleId + ', but the live ' +
          (preview.trackerYear || derived.year) + ' tracker will not be changed.';
      } else if (preview.mode === 'TRACKER') {
        notice.classList.add('notice--info');
        byId('legacy-import-impact-title').textContent = preview.modeLabel || 'Records and live tracker';
        byId('legacy-import-impact-detail').textContent = 'Imported assets will be recorded as completed and their ' +
          derived.cycle + ' tracker status and remarks will be synchronized.';
      } else {
        notice.classList.add('notice--warning');
        byId('legacy-import-impact-title').textContent = preview.modeLabel || 'Tracker impact not identified';
        byId('legacy-import-impact-detail').textContent = 'Review the server classifications carefully. The preview did not identify a tracker or historical-only mode.';
      }
    }

    function renderLegacyImportPreview(preview) {
      byId('legacy-import-count-ready').textContent = formatNumber(preview.counts.ready);
      byId('legacy-import-count-invalid').textContent = formatNumber(preview.counts.invalid);
      byId('legacy-import-count-duplicate').textContent = formatNumber(preview.counts.duplicate);
      byId('legacy-import-count-completed').textContent = formatNumber(preview.counts.completed);
      byId('legacy-import-review-subtitle').textContent = sectionLabel(preview.request.section) + ' | ' +
        formatDate(preview.request.maintenanceDate) + ' | ' + preview.cycleId;
      renderLegacyImportImpact(preview);

      var body = byId('legacy-import-preview-body');
      body.replaceChildren();
      var statusPriority = { INVALID: 0, DUPLICATE: 1, ALREADY_COMPLETED: 2, READY: 4 };
      var displayRows = preview.rows.map(function (row, index) {
        var priority = statusPriority[legacyPreviewStatus(row)];
        if (legacyPreviewStatus(row) === 'READY' && toArray(row.warnings).length) priority = 3;
        return { row: row, index: index, priority: priority === undefined ? 3 : priority };
      }).sort(function (left, right) {
        return left.priority - right.priority || left.index - right.index;
      }).map(function (entry) { return entry.row; });
      displayRows.slice(0, LEGACY_IMPORT_TABLE_CAP).forEach(function (row) { appendLegacyPreviewRow(body, row); });
      if (!preview.rows.length) {
        var emptyRow = document.createElement('tr');
        var emptyCell = document.createElement('td');
        emptyCell.colSpan = 4;
        emptyCell.className = 'legacy-import-table__empty';
        emptyCell.textContent = 'The server returned summary counts without row-level details.';
        emptyRow.appendChild(emptyCell);
        body.appendChild(emptyRow);
      }
      var truncated = byId('legacy-import-preview-truncated');
      truncated.hidden = preview.totalRows <= LEGACY_IMPORT_TABLE_CAP;
      truncated.textContent = truncated.hidden ? '' : 'Showing the first ' + formatNumber(LEGACY_IMPORT_TABLE_CAP) +
        ' of ' + formatNumber(preview.totalRows) + ' classified rows, with exceptions shown first.';

      byId('legacy-import-review-confirm').checked = false;
      byId('legacy-import-review-confirm-label').textContent = 'I reviewed all exceptions and approve ' +
        formatNumber(preview.counts.ready) + ' ready record' + (preview.counts.ready === 1 ? '' : 's') + '.';
      byId('legacy-import-confirmation-phrase').textContent = preview.confirmationPhrase || 'the server phrase';
      byId('legacy-import-confirmation-input').value = '';
      clearFieldError('legacy-import-confirmation-input', 'legacy-import-confirmation-error');
      updateLegacyImportConfirmState();
    }

    function updateLegacyImportConfirmState() {
      var button = byId('legacy-import-confirm');
      if (!button) return;
      var preview = state.legacyImport.preview;
      var phrase = preview ? normalizeText(preview.confirmationPhrase) : '';
      var typed = normalizeText(byId('legacy-import-confirmation-input').value);
      var approved = byId('legacy-import-review-confirm').checked;
      var ready = preview ? preview.counts.ready : 0;
      button.querySelector('span').textContent = ready ? 'Import ' + formatNumber(ready) + ' record' + (ready === 1 ? '' : 's') : 'Confirm import';
      button.disabled = state.legacyImport.busy || !preview || ready < 1 || !preview.confirmationToken || !phrase || !approved || typed !== phrase;
    }

    function validateLegacyImportRequest() {
      clearLegacyImportFieldErrors();
      clearLegacyImportAlert();
      var section = normalizeText(byId('legacy-import-section').value);
      var maintenanceDate = normalizeText(byId('legacy-import-maintenance-date').value);
      var parsed = updateLegacyImportLocalCount();
      var sourceNote = normalizeText(byId('legacy-import-source-note').value);
      var valid = true;
      if (!section || !state.sections.some(function (entry) { return entry.key === section; })) {
        setFieldError('legacy-import-section', 'legacy-import-section-error', 'Choose the tracker section for these assets.');
        valid = false;
      }
      if (!parseDateParts(maintenanceDate)) {
        setFieldError('legacy-import-maintenance-date', 'legacy-import-maintenance-date-error', 'Choose a valid maintenance date.');
        valid = false;
      } else if (maintenanceDate > currentManilaDate()) {
        setFieldError('legacy-import-maintenance-date', 'legacy-import-maintenance-date-error', 'The maintenance date cannot be in the future.');
        valid = false;
      }
      if (!parsed.uniqueTags.length) {
        setFieldError('legacy-import-tags', 'legacy-import-tags-error', 'Paste or load at least one asset tag.');
        valid = false;
      } else if (parsed.uniqueTags.length > LEGACY_IMPORT_MAX_LOCAL_TAGS) {
        setFieldError('legacy-import-tags', 'legacy-import-tags-error', 'Use at most ' +
          formatNumber(LEGACY_IMPORT_MAX_LOCAL_TAGS) + ' unique tags in one batch.');
        valid = false;
      }
      if (!valid) {
        var firstInvalid = byId('legacy-import-form').querySelector('[aria-invalid="true"]');
        if (firstInvalid) firstInvalid.focus();
        return null;
      }
      return {
        request: {
          section: section,
          maintenanceDate: maintenanceDate,
          assetTags: parsed.uniqueTags.slice(),
          sourceNote: sourceNote
        },
        parsed: parsed
      };
    }

    function previewLegacyImport(event) {
      if (event) event.preventDefault();
      if (!state.legacyImport.open || state.legacyImport.busy || state.legacyImport.stage !== 'PREPARE') return;
      var prepared = validateLegacyImportRequest();
      if (!prepared) return;
      var requestToken = state.legacyImport.requestToken + 1;
      state.legacyImport.requestToken = requestToken;
      state.legacyImport.request = prepared.request;
      state.legacyImport.dirty = true;
      setLegacyImportBusy(true, 'Validating ' + formatNumber(prepared.request.assetTags.length) + ' unique tags...');
      serverCall('PMS_apiPreviewLegacyImport', prepared.request)
        .then(function (data) {
          if (!state.legacyImport.open || requestToken !== state.legacyImport.requestToken) return;
          var preview = normalizeLegacyPreview(data, prepared.request, prepared.parsed);
          state.legacyImport.preview = preview;
          state.legacyImport.confirmationToken = preview.confirmationToken;
          renderLegacyImportPreview(preview);
          var missingConfirmation = preview.counts.ready > 0 && (!preview.confirmationToken || !preview.confirmationPhrase);
          var noReadyRows = !preview.counts.ready;
          setLegacyImportStage('REVIEW', !missingConfirmation && !noReadyRows);
          if (missingConfirmation) {
            showLegacyImportAlert('Preview cannot be confirmed', 'The server did not return the confirmation token and phrase required for this exact preview. Run the preview again or contact an administrator.');
          } else if (noReadyRows) {
            showLegacyImportAlert('Nothing is ready to import', 'Review the invalid, duplicate, and already-completed rows, then edit the list if needed.');
          }
        })
        .catch(function (error) {
          if (!state.legacyImport.open || requestToken !== state.legacyImport.requestToken) return;
          showLegacyImportAlert('Preview failed', errorMessage(error));
        })
        .finally(function () {
