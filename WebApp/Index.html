<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <title>YDC Preventive Maintenance</title>

  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>

    <!--
      Icon sprite. Every icon is a 24x24 stroke glyph so the whole product shares
      one visual language; stroke, width, and caps are set once in CSS on .icon.
      Using <symbol> keeps the markup free of duplicated path data.
    -->
    <svg class="icon-sprite" aria-hidden="true" focusable="false" width="0" height="0">
      <defs>
        <symbol id="i-shield" viewBox="0 0 24 24">
          <path d="M12 3l7.5 3.5v5.2c0 4.4-3 8.3-7.5 9.3-4.5-1-7.5-4.9-7.5-9.3V6.5L12 3Z"></path>
          <path d="m9 12 2.2 2.2L15.5 10"></path>
        </symbol>
        <symbol id="i-plus" viewBox="0 0 24 24">
          <path d="M12 5v14M5 12h14"></path>
        </symbol>
        <symbol id="i-close" viewBox="0 0 24 24">
          <path d="M18 6 6 18M6 6l12 12"></path>
        </symbol>
        <symbol id="i-check" viewBox="0 0 24 24">
          <path d="m20 6-11 11-5-5"></path>
        </symbol>
        <symbol id="i-check-circle" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9"></circle>
          <path d="m8.5 12 2.5 2.5 4.5-5"></path>
        </symbol>
        <symbol id="i-clock" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9"></circle>
          <path d="M12 7.5V12l3 1.8"></path>
        </symbol>
        <symbol id="i-layers" viewBox="0 0 24 24">
          <path d="m12 3 8 4.5-8 4.5-8-4.5L12 3Z"></path>
          <path d="m4 12 8 4.5 8-4.5"></path>
          <path d="m4 16.5 8 4.5 8-4.5"></path>
        </symbol>
        <symbol id="i-trending-up" viewBox="0 0 24 24">
          <path d="m3 17 6-6 4 4 8-8"></path>
          <path d="M15 7h6v6"></path>
        </symbol>
        <symbol id="i-map-pin" viewBox="0 0 24 24">
          <path d="M19 10c0 5.2-7 11-7 11s-7-5.8-7-11a7 7 0 1 1 14 0Z"></path>
          <circle cx="12" cy="10" r="2.5"></circle>
        </symbol>
        <symbol id="i-alert-triangle" viewBox="0 0 24 24">
          <path d="M10.3 4.3 2.8 17a2 2 0 0 0 1.7 3h15a2 2 0 0 0 1.7-3l-7.5-12.7a2 2 0 0 0-3.4 0Z"></path>
          <path d="M12 9.5v4M12 17h.01"></path>
        </symbol>
        <symbol id="i-alert-circle" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9"></circle>
          <path d="M12 7.5v5M12 16.5h.01"></path>
        </symbol>
        <symbol id="i-info" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9"></circle>
          <path d="M12 11v5.5M12 7.8h.01"></path>
        </symbol>
        <symbol id="i-refresh" viewBox="0 0 24 24">
          <path d="M20 11a8 8 0 0 0-13.7-4.6L4 8.5"></path>
          <path d="M4 5v3.5h3.5"></path>
          <path d="M4 13a8 8 0 0 0 13.7 4.6L20 15.5"></path>
          <path d="M20 19v-3.5h-3.5"></path>
        </symbol>
        <symbol id="i-user-check" viewBox="0 0 24 24">
          <path d="M15 20v-1.5a3.5 3.5 0 0 0-3.5-3.5h-4A3.5 3.5 0 0 0 4 18.5V20"></path>
          <circle cx="9.5" cy="8" r="3.5"></circle>
          <path d="m16 11.5 1.8 1.8 3.2-3.6"></path>
        </symbol>
        <symbol id="i-inbox" viewBox="0 0 24 24">
          <path d="M4 13h4l1.5 2.5h5L16 13h4"></path>
          <path d="M5.6 5h12.8l1.6 8v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-5l1.6-8Z"></path>
        </symbol>
        <symbol id="i-search" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="6.5"></circle>
          <path d="m20 20-4.4-4.4"></path>
        </symbol>
        <symbol id="i-chevron-down" viewBox="0 0 24 24">
          <path d="m6 9.5 6 6 6-6"></path>
        </symbol>
        <symbol id="i-arrow-left" viewBox="0 0 24 24">
          <path d="M19 12H5M11 6l-6 6 6 6"></path>
        </symbol>
        <symbol id="i-arrow-right" viewBox="0 0 24 24">
          <path d="M5 12h14M13 6l6 6-6 6"></path>
        </symbol>
        <symbol id="i-arrow-down" viewBox="0 0 24 24">
          <path d="M12 5v14M6 13l6 6 6-6"></path>
        </symbol>
        <symbol id="i-arrow-up" viewBox="0 0 24 24">
          <path d="M12 19V5M6 11l6-6 6 6"></path>
        </symbol>
        <symbol id="i-database" viewBox="0 0 24 24">
          <ellipse cx="12" cy="6" rx="7.5" ry="3"></ellipse>
          <path d="M4.5 6v6c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3V6"></path>
          <path d="M4.5 12v6c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3v-6"></path>
        </symbol>
      </defs>
    </svg>

    <div class="app-shell" id="app-shell">
      <header class="topbar" id="topbar" hidden>
        <div class="topbar__inner">
          <a class="brand" href="#" id="brand-home" aria-label="YDC Preventive Maintenance home">
            <span class="brand__mark" aria-hidden="true">
              <svg class="icon" aria-hidden="true"><use href="#i-shield"></use></svg>
            </span>
            <span class="brand__text">
              <span class="brand__eyebrow">YDC IT</span>
              <span class="brand__name">Preventive Maintenance</span>
            </span>
          </a>

          <div class="topbar__context" aria-label="Current application context">
            <span class="context-pill" id="header-cycle" hidden></span>
            <span class="context-pill context-pill--muted" id="header-section" hidden></span>
            <div class="user-menu" id="user-summary" hidden>
              <span class="avatar" id="header-avatar" aria-hidden="true">IT</span>
              <span class="user-menu__text">
                <strong id="header-name"></strong>
                <span id="header-email"></span>
              </span>
            </div>
          </div>
        </div>
      </header>

      <main id="main-content" tabindex="-1">
        <!--
          Boot screen shows the real dashboard silhouette instead of a bare
          spinner, so the first paint matches the layout that replaces it.
        -->
        <section class="boot-screen" id="boot-screen" aria-live="polite" aria-busy="true">
          <div class="page-container">
            <div class="boot-screen__status">
              <span class="spinner" aria-hidden="true"></span>
              <div>
                <strong>Preparing your workspace</strong>
                <span>Checking your YDC account and loading section assets.</span>
              </div>
            </div>

            <div class="skeleton-page" aria-hidden="true">
              <div class="skeleton-row">
                <div class="skeleton skeleton--title"></div>
                <div class="skeleton skeleton--button"></div>
              </div>
              <div class="skeleton skeleton--banner"></div>
              <div class="skeleton-grid">
                <div class="skeleton skeleton--card"></div>
                <div class="skeleton skeleton--card"></div>
                <div class="skeleton skeleton--card"></div>
                <div class="skeleton skeleton--card"></div>
              </div>
              <div class="skeleton-grid skeleton-grid--halves">
                <div class="skeleton skeleton--panel"></div>
                <div class="skeleton skeleton--panel"></div>
              </div>
            </div>
          </div>
        </section>

        <section class="fatal-state" id="fatal-state" hidden aria-labelledby="fatal-title">
          <div class="state-card">
            <span class="state-card__icon state-card__icon--danger" aria-hidden="true">
              <svg class="icon" aria-hidden="true"><use href="#i-alert-circle"></use></svg>
            </span>
            <p class="eyebrow">Unable to open PMS</p>
            <h1 id="fatal-title">We couldn’t load your workspace</h1>
            <p id="fatal-message">Please refresh and try again.</p>
            <button class="button button--primary" id="retry-bootstrap" type="button">
              <svg class="icon" aria-hidden="true"><use href="#i-refresh"></use></svg>
              <span>Try again</span>
            </button>
          </div>
        </section>

        <?!= PMS_include('Register'); ?>
        <?!= PMS_include('Dashboard'); ?>
      </main>
    </div>

    <?!= PMS_include('Questionnaire'); ?>
    <?!= PMS_include('Archive'); ?>

    <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>

    <div class="busy-overlay" id="busy-overlay" hidden aria-live="assertive" aria-busy="true">
      <div class="busy-overlay__card">
        <span class="spinner" aria-hidden="true"></span>
        <p id="busy-message">Working…</p>
      </div>
    </div>

    <noscript>
      <div class="noscript-message">JavaScript is required to use the Preventive Maintenance web app.</div>
    </noscript>

    <?!= PMS_include('Client'); ?>
  </body>
</html>
