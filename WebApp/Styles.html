<style>
  /* ==========================================================================
     YDC PMS design system
     One neutral ramp, one accent, a 4px spacing rhythm, and a single stroke
     icon language. Semantic colours are reserved for state only, so the
     interface stays quiet until something needs attention.
     ========================================================================== */

  :root {
    color-scheme: light;

    --gray-50: #f8fafc;
    --gray-100: #f1f5f9;
    --gray-200: #e8edf3;
    --gray-300: #cfd8e3;
    --gray-400: #94a3b8;
    --gray-500: #64748b;
    --gray-600: #475569;
    --gray-700: #334155;
    --gray-800: #1e293b;
    --gray-900: #0f172a;

    --bg: #f7f8fa;
    --surface: #ffffff;
    --surface-soft: #fafbfc;
    --surface-sunken: var(--gray-100);
    --ink: #0f172a;
    --ink-soft: #475569;
    --muted: #64748b;
    --faint: #94a3b8;
    --line: #e9edf2;
    --line-strong: #dae1ea;

    --accent: #4f46e5;
    --accent-hover: #4338ca;
    --accent-press: #3730a3;
    --accent-soft: #eef2ff;
    --accent-line: #c7d2fe;
    --on-accent: #ffffff;

    --success: #047857;
    --success-soft: #ecfdf5;
    --success-line: #a7f3d0;
    --warning: #b45309;
    --warning-soft: #fffbeb;
    --warning-line: #fde68a;
    --danger: #dc2626;
    --danger-dark: #b91c1c;
    --danger-soft: #fef2f2;
    --danger-line: #fecaca;
    --info: #0284c7;
    --info-soft: #f0f9ff;
    --info-line: #bae6fd;

    --r-xs: 6px;
    --r-sm: 8px;
    --r-md: 10px;
    --r-lg: 14px;
    --r-xl: 20px;
    --r-full: 999px;

    --shadow-xs: 0 1px 2px rgba(15, 23, 42, 0.04);
    --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04), 0 1px 3px rgba(15, 23, 42, 0.05);
    --shadow-md: 0 4px 6px -2px rgba(15, 23, 42, 0.06), 0 2px 4px -2px rgba(15, 23, 42, 0.05);
    --shadow-lg: 0 12px 24px -8px rgba(15, 23, 42, 0.12), 0 4px 8px -4px rgba(15, 23, 42, 0.05);
    --shadow-xl: 0 32px 64px -16px rgba(15, 23, 42, 0.22);

    --ring: 0 0 0 3px rgba(79, 70, 229, 0.16);
    --ring-danger: 0 0 0 3px rgba(220, 38, 38, 0.16);

    --control-h: 40px;
    --content: 1200px;
    --ease: cubic-bezier(0.2, 0, 0.2, 1);
  }

  *,
  *::before,
  *::after {
    box-sizing: border-box;
  }

  html {
    min-height: 100%;
    background: var(--bg);
    -webkit-text-size-adjust: 100%;
  }

  body {
    min-height: 100vh;
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 14px;
    line-height: 1.55;
    letter-spacing: -0.006em;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  body.modal-open {
    overflow: hidden;
  }

  h1, h2, h3, h4 {
    margin: 0;
    color: var(--ink);
    font-weight: 640;
    letter-spacing: -0.021em;
    line-height: 1.25;
  }

  h1 { font-size: 24px; }
  h2 { font-size: 17px; }
  h3 { font-size: 15px; }

  p { margin: 0; }

  button,
  input,
  select,
  textarea {
    font: inherit;
    letter-spacing: inherit;
  }

  button {
    color: inherit;
  }

  button,
  a,
  input,
  select,
  textarea {
    outline: none;
  }

  button:focus-visible,
  a:focus-visible,
  input:focus-visible,
  select:focus-visible,
  textarea:focus-visible,
  [tabindex]:focus-visible {
    box-shadow: var(--ring);
    border-color: var(--accent);
  }

  /* --------------------------------------------------------------------------
     Icons. Every glyph is a 24x24 stroke symbol; geometry is set once here so
     no icon can drift from the others.
     -------------------------------------------------------------------------- */

  .icon-sprite {
    position: absolute;
    width: 0;
    height: 0;
    overflow: hidden;
  }

  .icon {
    width: 18px;
    height: 18px;
    flex: none;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.75;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* --------------------------------------------------------------------------
     Utilities
     -------------------------------------------------------------------------- */

  /*
    Component rules below set display on elements that are toggled with the
    hidden attribute, and a class selector outranks the user-agent
    [hidden] { display: none } rule. This restores it explicitly.
  */
  [hidden] {
    display: none !important;
  }

  .sr-only {
    position: absolute !important;
    width: 1px !important;
    height: 1px !important;
    padding: 0 !important;
    margin: -1px !important;
    overflow: hidden !important;
    clip: rect(0, 0, 0, 0) !important;
    white-space: nowrap !important;
    border: 0 !important;
  }

  .skip-link {
    position: absolute;
    top: -60px;
    left: 16px;
    z-index: 200;
    padding: 10px 16px;
    border-radius: var(--r-sm);
    background: var(--ink);
    color: #fff;
    font-weight: 550;
    text-decoration: none;
    transition: top 160ms var(--ease);
  }

  .skip-link:focus {
    top: 16px;
  }

  .eyebrow {
    margin: 0 0 4px;
    color: var(--muted);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.07em;
    text-transform: uppercase;
  }

  .noscript-message {
    margin: 40px auto;
    max-width: 520px;
    padding: 16px 20px;
    border: 1px solid var(--warning-line);
    border-radius: var(--r-md);
    background: var(--warning-soft);
    color: var(--warning);
    text-align: center;
  }

  /* --------------------------------------------------------------------------
     Shell and top bar
     -------------------------------------------------------------------------- */

  .app-shell {
    display: flex;
    min-height: 100vh;
    flex-direction: column;
  }

  .topbar {
    position: sticky;
    top: 0;
    z-index: 50;
    border-bottom: 1px solid var(--line);
    background: rgba(255, 255, 255, 0.88);
    backdrop-filter: saturate(1.6) blur(12px);
  }

  .topbar__inner {
    display: flex;
    max-width: var(--content);
    margin: 0 auto;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 12px 24px;
  }

  .brand {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    color: inherit;
    text-decoration: none;
    border-radius: var(--r-sm);
  }

  .brand__mark {
    display: grid;
    width: 32px;
    height: 32px;
    place-items: center;
    border-radius: var(--r-sm);
    background: var(--accent);
    color: var(--on-accent);
    box-shadow: var(--shadow-xs);
  }

  .brand__mark--large {
    width: 44px;
    height: 44px;
    border-radius: var(--r-md);
  }

  .brand__mark--large .icon {
    width: 24px;
    height: 24px;
  }

  .brand__text {
    display: grid;
    line-height: 1.2;
  }

  .brand__eyebrow {
    color: var(--muted);
    font-size: 10px;
    font-weight: 650;
    letter-spacing: 0.09em;
    text-transform: uppercase;
  }

  .brand__name {
    font-size: 14px;
    font-weight: 620;
    letter-spacing: -0.015em;
  }

  .topbar__context {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .user-menu {
    display: flex;
    align-items: center;
    gap: 9px;
    padding-left: 10px;
    margin-left: 2px;
    border-left: 1px solid var(--line);
  }

  .avatar {
    display: grid;
    width: 32px;
    height: 32px;
    place-items: center;
    border-radius: var(--r-full);
    background: var(--accent-soft);
    color: var(--accent-press);
    font-size: 11px;
    font-weight: 650;
    letter-spacing: 0.02em;
  }

  .user-menu__text {
    display: grid;
    line-height: 1.3;
  }

  .user-menu__text strong {
    font-size: 13px;
    font-weight: 600;
  }

  .user-menu__text span {
    color: var(--muted);
    font-size: 11.5px;
  }

  /* --------------------------------------------------------------------------
     Pills, chips, badges
     -------------------------------------------------------------------------- */

  .context-pill,
  .status-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    height: 24px;
    padding: 0 9px;
    border: 1px solid var(--accent-line);
    border-radius: var(--r-full);
    background: var(--accent-soft);
    color: var(--accent-press);
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.01em;
    white-space: nowrap;
  }

  .context-pill--muted,
  .status-chip--neutral {
    border-color: var(--line-strong);
    background: var(--surface-sunken);
    color: var(--ink-soft);
  }

  .status-chip--success {
    border-color: var(--success-line);
    background: var(--success-soft);
    color: var(--success);
  }

  .status-chip--warning {
    border-color: var(--warning-line);
    background: var(--warning-soft);
    color: var(--warning);
  }

  .status-chip--danger {
    border-color: var(--danger-line);
    background: var(--danger-soft);
    color: var(--danger);
  }

  .status-chip--info {
    border-color: var(--info-line);
    background: var(--info-soft);
    color: var(--info);
  }

  .cycle-badge {
    display: grid;
    width: 44px;
    height: 44px;
    place-items: center;
    border-radius: var(--r-md);
    background: var(--accent);
    color: var(--on-accent);
    font-size: 15px;
    font-weight: 680;
    letter-spacing: 0.01em;
  }

  /* --------------------------------------------------------------------------
     Buttons
     -------------------------------------------------------------------------- */

  .button {
    display: inline-flex;
    min-height: var(--control-h);
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 0 15px;
    border: 1px solid transparent;
    border-radius: var(--r-sm);
    background: none;
    font-size: 13.5px;
    font-weight: 570;
    letter-spacing: -0.008em;
    white-space: nowrap;
    cursor: pointer;
    transition: background 130ms var(--ease), border-color 130ms var(--ease),
                color 130ms var(--ease), box-shadow 130ms var(--ease), transform 90ms var(--ease);
  }

  .button:active:not(:disabled) {
    transform: translateY(0.5px);
  }

  .button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .button__icon {
    display: inline-grid;
    place-items: center;
  }

  .button--primary {
    background: var(--accent);
    color: var(--on-accent);
    box-shadow: var(--shadow-xs);
  }

  .button--primary:hover:not(:disabled) {
    background: var(--accent-hover);
  }

  .button--primary:active:not(:disabled) {
    background: var(--accent-press);
  }

  .button--secondary {
    border-color: var(--line-strong);
    background: var(--surface);
    color: var(--ink);
    box-shadow: var(--shadow-xs);
  }

  .button--secondary:hover:not(:disabled) {
    border-color: var(--gray-300);
    background: var(--surface-soft);
  }

  .button--quiet {
    color: var(--ink-soft);
  }

  .button--quiet:hover:not(:disabled) {
    background: var(--surface-sunken);
    color: var(--ink);
  }

  .button--danger {
    background: var(--danger);
    color: #fff;
    box-shadow: var(--shadow-xs);
  }

  .button--danger:hover:not(:disabled) {
    background: var(--danger-dark);
  }

  .button--small {
    min-height: 32px;
    padding: 0 11px;
    font-size: 12.5px;
  }

  .button--small .icon {
    width: 15px;
    height: 15px;
  }

  .button--full {
    width: 100%;
  }

  .button--new-record {
    flex: none;
  }

  .icon-button {
    display: grid;
    width: 34px;
    height: 34px;
    place-items: center;
    border: 1px solid transparent;
    border-radius: var(--r-sm);
    background: none;
    color: var(--muted);
    cursor: pointer;
    transition: background 130ms var(--ease), color 130ms var(--ease);
  }

  .icon-button:hover {
    background: var(--surface-sunken);
    color: var(--ink);
  }

  .text-button {
    padding: 0;
    border: 0;
    background: none;
    color: var(--accent);
    font-size: 12.5px;
    font-weight: 570;
    cursor: pointer;
    border-radius: 4px;
  }

  .text-button:hover {
    color: var(--accent-press);
    text-decoration: underline;
    text-underline-offset: 2px;
  }

  /* --------------------------------------------------------------------------
     Loading: spinner, skeletons, boot screen
     -------------------------------------------------------------------------- */

  .spinner {
    display: block;
    width: 18px;
    height: 18px;
    flex: none;
    border: 2px solid var(--accent-line);
    border-top-color: var(--accent);
    border-radius: var(--r-full);
    animation: spin 620ms linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .boot-screen {
    padding: 28px 0 64px;
  }

  .boot-screen__status {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 28px;
    padding: 14px 16px;
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    background: var(--surface);
    box-shadow: var(--shadow-xs);
  }

  .boot-screen__status div {
    display: grid;
    line-height: 1.4;
  }

  .boot-screen__status strong {
    font-size: 13.5px;
    font-weight: 600;
  }

  .boot-screen__status span {
    color: var(--muted);
    font-size: 12.5px;
  }

  .skeleton-page {
    display: grid;
    gap: 20px;
  }

  .skeleton-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  .skeleton-grid {
    display: grid;
    gap: 16px;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  }

  .skeleton-grid--halves {
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
  }

  .skeleton {
    position: relative;
    overflow: hidden;
    border-radius: var(--r-md);
    background: var(--gray-200);
  }

  .skeleton::after {
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.7), transparent);
    animation: shimmer 1.4s infinite;
    content: "";
  }

  @keyframes shimmer {
    100% { transform: translateX(100%); }
  }

  .skeleton--title { width: 260px; height: 34px; }
  .skeleton--button { width: 190px; height: 40px; border-radius: var(--r-sm); }
  .skeleton--banner { height: 92px; border-radius: var(--r-lg); }
  .skeleton--card { height: 116px; }
  .skeleton--panel { height: 244px; border-radius: var(--r-lg); }

  @media (prefers-reduced-motion: reduce) {
    .skeleton::after { animation: none; }
    .spinner { animation-duration: 1.6s; }
  }

  /* --------------------------------------------------------------------------
     Fatal state
     -------------------------------------------------------------------------- */

  .fatal-state {
    display: grid;
    min-height: 74vh;
    place-items: center;
    padding: 40px 20px;
  }

  .boot-card,
  .state-card {
    width: min(100%, 440px);
    padding: 32px;
    border: 1px solid var(--line);
    border-radius: var(--r-xl);
    background: var(--surface);
    box-shadow: var(--shadow-lg);
    text-align: center;
  }

  .state-card__icon {
    display: grid;
    width: 44px;
    height: 44px;
    margin: 0 auto 18px;
    place-items: center;
    border-radius: var(--r-full);
    background: var(--surface-sunken);
    color: var(--ink-soft);
  }

  .state-card__icon .icon {
    width: 22px;
    height: 22px;
  }

  .state-card__icon--danger {
    background: var(--danger-soft);
    color: var(--danger);
  }

  .state-card h1 {
    margin-bottom: 8px;
    font-size: 20px;
  }

  .state-card p {
    color: var(--ink-soft);
  }

  .state-card .button {
    margin-top: 22px;
  }

  /* --------------------------------------------------------------------------
     Forms
     -------------------------------------------------------------------------- */

  input,
  select,
  textarea {
    width: 100%;
    min-height: var(--control-h);
    border: 1px solid var(--line-strong);
    border-radius: var(--r-sm);
    background: var(--surface);
    color: var(--ink);
    padding: 9px 12px;
    transition: border-color 130ms var(--ease), box-shadow 130ms var(--ease), background 130ms var(--ease);
  }

  input::placeholder,
  textarea::placeholder {
    color: var(--faint);
  }

  input:hover:not(:disabled):not([readonly]),
  select:hover:not(:disabled),
  textarea:hover:not(:disabled) {
    border-color: var(--gray-300);
  }

  input:focus,
  select:focus,
  textarea:focus {
    border-color: var(--accent);
    box-shadow: var(--ring);
  }

  input[readonly] {
    border-color: var(--line);
    background: var(--surface-sunken);
    color: var(--ink-soft);
  }

  textarea {
    min-height: 96px;
    padding: 11px 12px;
    line-height: 1.6;
    resize: vertical;
  }

  input[type="checkbox"] {
    width: 17px;
    height: 17px;
    min-height: 0;
    flex: none;
    margin: 0;
    padding: 0;
    accent-color: var(--accent);
    cursor: pointer;
  }

  .field {
    display: grid;
    gap: 6px;
  }

  .field > label,
  .field__label-row label {
    color: var(--ink);
    font-size: 12.5px;
    font-weight: 570;
  }

  .field__label-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
  }

  .field-help,
  .field-error {
    margin: 0;
    font-size: 12px;
  }

  .field-help {
    color: var(--muted);
  }

  .field-error {
    color: var(--danger);
    font-weight: 520;
  }

  .field.has-error input,
  .field.has-error select,
  .field.has-error textarea,
  .search-input.has-error input,
  .combobox.has-error .combobox__control {
    border-color: var(--danger);
    box-shadow: var(--ring-danger);
  }

  .required-mark {
    color: var(--danger);
    font-weight: 600;
  }

  .field-grid {
    display: grid;
    gap: 16px;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  }

  .field-grid--stack {
    grid-template-columns: 1fr;
  }

  /* Native select keeps its accessibility; the chevron is ours. */
  .select-wrap {
    position: relative;
  }

  .select-wrap select {
    appearance: none;
    -webkit-appearance: none;
    padding-right: 38px;
    cursor: pointer;
  }

  .select-wrap__chevron {
    position: absolute;
    top: 50%;
    right: 12px;
    color: var(--muted);
    pointer-events: none;
    transform: translateY(-50%);
  }

  .readonly-field,
  .search-input {
    position: relative;
    display: flex;
    align-items: center;
  }

  .readonly-field__icon,
  .search-input > span {
    position: absolute;
    left: 12px;
    display: grid;
    place-items: center;
    color: var(--faint);
    font-size: 13px;
    pointer-events: none;
  }

  .readonly-field input,
  .search-input input {
    padding-left: 34px;
  }

  .check-control {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    color: var(--ink-soft);
    font-size: 13px;
    cursor: pointer;
  }

  .check-control input {
    margin-top: 2px;
  }

  .check-control--boxed {
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: var(--r-sm);
    background: var(--surface-soft);
  }

  .check-control--boxed:hover {
    border-color: var(--line-strong);
  }

  /* --------------------------------------------------------------------------
     Combobox: replaces the native datalist, which cannot be styled and renders
     its popup detached from the field.
     -------------------------------------------------------------------------- */

  .combobox {
    position: relative;
  }

  .combobox__control {
    position: relative;
    display: flex;
    align-items: center;
    border: 1px solid var(--line-strong);
    border-radius: var(--r-sm);
    background: var(--surface);
    transition: border-color 130ms var(--ease), box-shadow 130ms var(--ease);
  }

  .combobox__control:hover {
    border-color: var(--gray-300);
  }

  .combobox__control:focus-within {
    border-color: var(--accent);
    box-shadow: var(--ring);
  }

  .combobox__icon {
    position: absolute;
    left: 12px;
    color: var(--faint);
    pointer-events: none;
  }

  .combobox input {
    border: 0;
    background: none;
    box-shadow: none;
    padding-left: 38px;
    padding-right: 40px;
  }

  .combobox input:focus {
    border: 0;
    box-shadow: none;
  }

  .combobox__toggle {
    position: absolute;
    right: 4px;
    display: grid;
    width: 32px;
    height: 32px;
    place-items: center;
    border: 0;
    border-radius: var(--r-xs);
    background: none;
    color: var(--muted);
    cursor: pointer;
    transition: background 130ms var(--ease), color 130ms var(--ease), transform 160ms var(--ease);
  }

  .combobox__toggle:hover {
    background: var(--surface-sunken);
    color: var(--ink);
  }

  .combobox.is-open .combobox__toggle {
    transform: rotate(180deg);
  }

  /*
    Fixed rather than absolute: the panel would otherwise be clipped by the
    modal body's overflow-y scroll container. Position is measured in JS.
  */
  .combobox__panel {
    position: fixed;
    z-index: 120;
    max-height: 288px;
    overflow-y: auto;
    overscroll-behavior: contain;
    padding: 5px;
    border: 1px solid var(--line-strong);
    border-radius: var(--r-md);
    background: var(--surface);
    box-shadow: var(--shadow-lg);
  }

  .combobox__option {
    display: flex;
    width: 100%;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    padding: 8px 10px;
    border: 0;
    border-radius: var(--r-xs);
    background: none;
    text-align: left;
    cursor: pointer;
    transition: background 90ms var(--ease);
  }

  .combobox__option:hover,
  .combobox__option.is-active {
    background: var(--accent-soft);
  }

  .combobox__option[aria-selected="true"] {
    background: var(--accent-soft);
    box-shadow: inset 0 0 0 1px var(--accent-line);
  }

  .combobox__option-tag {
    color: var(--ink);
    font-size: 13px;
    font-weight: 570;
    font-variant-numeric: tabular-nums;
  }

  .combobox__option-meta {
    flex: 1 1 auto;
    overflow: hidden;
    color: var(--muted);
    font-size: 12px;
    text-align: right;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .combobox__empty {
    padding: 18px 12px;
    color: var(--muted);
    font-size: 12.5px;
    text-align: center;
  }

  .combobox__count {
    padding: 7px 10px 5px;
    color: var(--faint);
    font-size: 10.5px;
    font-weight: 620;
    letter-spacing: 0.07em;
    text-transform: uppercase;
  }

  /* --------------------------------------------------------------------------
     Registration
     -------------------------------------------------------------------------- */

  .register-view {
    display: grid;
    min-height: 100vh;
    place-items: center;
    padding: 48px 24px;
  }

  .register-layout {
    display: grid;
    width: min(100%, 980px);
    gap: 48px;
    grid-template-columns: 1fr 1fr;
    align-items: center;
  }

  .register-intro__badge {
    display: grid;
    width: 44px;
    height: 44px;
    margin-bottom: 22px;
    place-items: center;
    border-radius: var(--r-md);
    background: var(--accent);
    color: var(--on-accent);
    box-shadow: var(--shadow-sm);
  }

  .register-intro__badge .icon {
    width: 23px;
    height: 23px;
  }

  .register-intro h1 {
    margin-bottom: 12px;
    font-size: 30px;
  }

  .register-intro > p:not(.eyebrow) {
    color: var(--ink-soft);
    font-size: 14.5px;
  }

  .feature-list {
    display: grid;
    gap: 11px;
    margin: 26px 0 0;
    padding: 0;
    list-style: none;
  }

  .feature-list li {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--ink-soft);
    font-size: 13.5px;
  }

  .feature-list li span {
    display: grid;
    width: 20px;
    height: 20px;
    flex: none;
    place-items: center;
    border-radius: var(--r-full);
    background: var(--success-soft);
    color: var(--success);
  }

  .feature-list li span .icon {
    width: 13px;
    height: 13px;
    stroke-width: 2.4;
  }

  .register-card {
    padding: 30px;
    border: 1px solid var(--line);
    border-radius: var(--r-xl);
    background: var(--surface);
    box-shadow: var(--shadow-lg);
  }

  .register-card__header {
    margin-bottom: 22px;
  }

  .register-card__header h2 {
    margin-bottom: 6px;
    font-size: 19px;
  }

  .register-card__header > p:last-child {
    color: var(--muted);
    font-size: 12.5px;
  }

  .register-card .button {
    margin-top: 24px;
  }

  /* --------------------------------------------------------------------------
     Dashboard
     -------------------------------------------------------------------------- */

  .dashboard-view {
    padding: 28px 0 72px;
  }

  .page-container {
    max-width: var(--content);
    margin: 0 auto;
    padding: 0 24px;
  }

  .page-heading,
  .section-heading,
  .panel__header,
  .progress-card__header,
  .cycle-banner,
  .cycle-banner__content,
  .asset-snapshot__header,
  .review-card__header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  .page-heading {
    margin-bottom: 24px;
    align-items: flex-end;
  }

  .page-heading h1 {
    font-size: 26px;
  }

  .page-heading > div > p:last-child {
    margin-top: 5px;
    color: var(--muted);
    font-size: 13.5px;
  }

  .cycle-banner {
    margin-bottom: 32px;
    padding: 18px 22px;
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    background: var(--surface);
    box-shadow: var(--shadow-sm);
  }

  .cycle-banner__content {
    gap: 16px;
    justify-content: flex-start;
  }

  .cycle-banner h2 {
    font-size: 17px;
  }

  .cycle-banner p:last-child {
    margin-top: 2px;
    color: var(--muted);
    font-size: 12.5px;
  }

  .cycle-banner__deadline {
    display: grid;
    flex: none;
    justify-items: end;
    padding-left: 20px;
    border-left: 1px solid var(--line);
    text-align: right;
  }

  .cycle-banner__deadline > span:last-child {
    color: var(--muted);
    font-size: 11.5px;
    font-weight: 550;
  }

  .cycle-banner__days {
    color: var(--ink);
    font-size: 26px;
    font-weight: 660;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.03em;
    line-height: 1.1;
  }

  .section-heading {
    margin-bottom: 14px;
    align-items: flex-end;
  }

  .section-note,
  .panel__meta {
    color: var(--muted);
    font-size: 12px;
  }

  .metric-grid {
    display: grid;
    gap: 14px;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    margin-bottom: 14px;
  }

  .metric-card,
  .panel,
  .progress-card {
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    background: var(--surface);
    box-shadow: var(--shadow-sm);
  }

  .metric-card {
    display: grid;
    gap: 3px;
    padding: 16px 18px 18px;
    transition: border-color 140ms var(--ease), box-shadow 140ms var(--ease), transform 140ms var(--ease);
  }

  .metric-card:hover {
    border-color: var(--line-strong);
    box-shadow: var(--shadow-md);
    transform: translateY(-1px);
  }

  .metric-card--accent {
    border-color: var(--accent-line);
    background: linear-gradient(180deg, var(--accent-soft), var(--surface) 72%);
  }

  .metric-card__top {
    display: flex;
    align-items: center;
    gap: 9px;
    margin-bottom: 8px;
  }

  .metric-icon {
    display: grid;
    width: 30px;
    height: 30px;
    flex: none;
    place-items: center;
    border-radius: var(--r-sm);
  }

  .metric-icon .icon {
    width: 16px;
    height: 16px;
  }

  .metric-icon--neutral {
    background: var(--surface-sunken);
    color: var(--ink-soft);
  }

  .metric-icon--success {
    background: var(--success-soft);
    color: var(--success);
  }

  .metric-icon--warning {
    background: var(--warning-soft);
    color: var(--warning);
  }

  .metric-icon--accent {
    background: var(--accent);
    color: var(--on-accent);
  }

  .metric-card__label {
    color: var(--ink-soft);
    font-size: 12.5px;
    font-weight: 550;
  }

  .metric-card__value {
    color: var(--ink);
    font-size: 30px;
    font-weight: 660;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.035em;
    line-height: 1.15;
  }

  .metric-card__detail {
    color: var(--muted);
    font-size: 12px;
  }

  .progress-card {
    padding: 18px 20px;
    margin-bottom: 32px;
  }

  .progress-card__header {
    margin-bottom: 12px;
    align-items: flex-end;
  }

  .progress-card__header div {
    display: grid;
    gap: 2px;
  }

  .progress-card__header strong {
    font-size: 13.5px;
    font-weight: 600;
  }

  .progress-card__header span {
    color: var(--muted);
    font-size: 12.5px;
  }

  .progress-card__header > strong:last-child {
    font-size: 19px;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }

  .progress-track {
    position: relative;
    overflow: hidden;
    height: 6px;
    border-radius: var(--r-full);
    background: var(--gray-200);
  }

  .progress-track--large {
    height: 8px;
  }

  .progress-fill {
    display: block;
    height: 100%;
    border-radius: var(--r-full);
    background: var(--accent);
    transition: width 420ms var(--ease);
  }

  .progress-fill.is-complete {
    background: var(--success);
  }

  .insight-grid {
    display: grid;
    gap: 16px;
    grid-template-columns: 1.35fr 1fr;
    align-items: start;
    margin-bottom: 32px;
  }

  .panel {
    padding: 20px;
  }

  .panel__header {
    margin-bottom: 16px;
    align-items: flex-start;
  }

  .panel__header--rollover {
    padding-bottom: 16px;
    border-bottom: 1px solid var(--line);
  }

  .panel__header--rollover p:last-child {
    margin-top: 6px;
    max-width: 62ch;
    color: var(--muted);
    font-size: 12.5px;
  }

  .location-list {
    display: grid;
    gap: 14px;
  }

  .location-row {
    display: grid;
    gap: 6px;
  }

  .location-row__top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 6px;
  }

  .location-row__name {
    overflow: hidden;
    color: var(--ink);
    font-size: 13px;
    font-weight: 550;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .location-row__count {
    flex: none;
    color: var(--muted);
    font-size: 12px;
    font-variant-numeric: tabular-nums;
  }

  .attention-list {
    display: grid;
    gap: 10px;
  }

  .attention-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 14px;
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    background: var(--surface-soft);
  }

  .attention-item div {
    display: grid;
    gap: 1px;
  }

  .attention-item__icon {
    display: grid;
    width: 32px;
    height: 32px;
    flex: none;
    place-items: center;
    border-radius: var(--r-sm);
  }

  .attention-item__icon .icon {
    width: 17px;
    height: 17px;
  }

  .attention-item__icon--amber {
    background: var(--warning-soft);
    color: var(--warning);
  }

  .attention-item__icon--red {
    background: var(--danger-soft);
    color: var(--danger);
  }

  .attention-item__icon--blue {
    background: var(--accent-soft);
    color: var(--accent-press);
  }

  .attention-item strong {
    font-size: 17px;
    font-weight: 640;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }

  .attention-item div > span {
    color: var(--muted);
    font-size: 12.5px;
  }

  /* --------------------------------------------------------------------------
     Tables
     -------------------------------------------------------------------------- */

  .recent-panel {
    margin-bottom: 32px;
  }

  .table-wrap {
    margin: 0 -20px -20px;
    overflow-x: auto;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  thead th {
    padding: 9px 20px;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    background: var(--surface-soft);
    color: var(--muted);
    font-size: 11px;
    font-weight: 620;
    letter-spacing: 0.055em;
    text-align: left;
    text-transform: uppercase;
    white-space: nowrap;
  }

  tbody td {
    padding: 12px 20px;
    border-bottom: 1px solid var(--line);
    vertical-align: middle;
  }

  tbody tr:last-child td {
    border-bottom: 0;
  }

  tbody tr {
    transition: background 110ms var(--ease);
  }

  tbody tr:hover {
    background: var(--surface-soft);
  }

  tbody td strong {
    font-weight: 570;
    font-variant-numeric: tabular-nums;
  }

  .table-action {
    min-height: 30px;
    padding: 0 11px;
    border: 1px solid var(--line-strong);
    border-radius: var(--r-xs);
    background: var(--surface);
    color: var(--ink);
    font-size: 12.5px;
    font-weight: 550;
    cursor: pointer;
    transition: border-color 130ms var(--ease), background 130ms var(--ease);
  }

  .table-action:hover {
    border-color: var(--accent-line);
    background: var(--accent-soft);
    color: var(--accent-press);
  }

  /* --------------------------------------------------------------------------
     Empty states and notices
     -------------------------------------------------------------------------- */

  .empty-state {
    display: grid;
    justify-items: center;
    padding: 44px 24px;
    text-align: center;
  }

  .empty-state--compact {
    padding: 28px 20px;
  }

  .empty-state__art {
    display: grid;
    width: 44px;
    height: 44px;
    margin-bottom: 14px;
    place-items: center;
    border-radius: var(--r-full);
    background: var(--surface-sunken);
    color: var(--faint);
  }

  .empty-state__art .icon {
    width: 21px;
    height: 21px;
  }

  .empty-state h3 {
    margin-bottom: 5px;
  }

  .empty-state p {
    max-width: 42ch;
    color: var(--muted);
    font-size: 13px;
  }

  .empty-state .button {
    margin-top: 18px;
  }

  .notice {
    display: flex;
    align-items: flex-start;
    gap: 11px;
    padding: 13px 15px;
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    background: var(--surface-soft);
  }

  .notice div {
    display: grid;
    gap: 2px;
  }

  .notice strong {
    font-size: 13px;
    font-weight: 600;
  }

  .notice p {
    color: var(--ink-soft);
    font-size: 12.5px;
  }

  .notice__icon {
    display: grid;
    width: 22px;
    height: 22px;
    flex: none;
    place-items: center;
    border-radius: var(--r-full);
    margin-top: 1px;
  }

  .notice__icon .icon {
    width: 15px;
    height: 15px;
  }

  .notice--info {
    border-color: var(--info-line);
    background: var(--info-soft);
  }

  .notice--info .notice__icon {
    color: var(--info);
  }

  .notice--warning {
    border-color: var(--warning-line);
    background: var(--warning-soft);
  }

  .notice--warning .notice__icon {
    color: var(--warning);
  }

  /* --------------------------------------------------------------------------
     Completed maintenance archive
     -------------------------------------------------------------------------- */

  .page-heading__actions {
    display: flex;
    flex: none;
    align-items: center;
    gap: 10px;
  }

  .archive-dialog {
    position: relative;
    display: flex;
    width: min(100%, 1080px);
    max-height: min(92vh, 900px);
    flex-direction: column;
    overflow: hidden;
    border-radius: var(--r-xl);
    background: var(--surface);
    box-shadow: var(--shadow-xl);
    animation: pop-in 220ms var(--ease);
  }

  .archive-dialog__header {
    flex: none;
    padding: 22px 26px 16px;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
  }

  .archive-dialog__title-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 18px;
  }

  .archive-dialog__title-row h1 {
    font-size: 21px;
  }

  .archive-dialog__summary {
    margin-top: 5px;
    color: var(--muted);
    font-size: 12.5px;
  }

  .archive-dialog__header-actions {
    display: flex;
    flex: none;
    align-items: center;
    gap: 6px;
  }

  .archive-dialog__body {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    background: var(--surface-soft);
  }

  .archive-dialog__body .table-wrap {
    margin: 0;
  }

  .archive-dialog__body thead th {
    position: sticky;
    top: 0;
    z-index: 2;
  }

  .archive-dialog__footer {
    display: flex;
    flex: none;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 13px 26px;
    border-top: 1px solid var(--line);
    background: var(--surface);
  }

  .archive-toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    gap: 10px;
  }

  .archive-toolbar--secondary {
    justify-content: space-between;
    margin-top: 10px;
    padding-top: 12px;
    border-top: 1px dashed var(--line);
  }

  .archive-control {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .archive-control--end {
    margin-left: auto;
  }

  .archive-control label {
    color: var(--muted);
    font-size: 12px;
    font-weight: 550;
    white-space: nowrap;
  }

  .archive-direction {
    white-space: nowrap;
  }

  .select-wrap--compact {
    width: 82px;
  }

  .archive-toolbar__search {
    flex: 1 1 260px;
    min-width: 200px;
  }

  .archive-toolbar__filter {
    flex: 0 0 auto;
    width: 148px;
  }

  .archive-toolbar .search-input input {
    min-height: 36px;
  }

  .archive-toolbar select {
    min-height: 36px;
    padding-top: 0;
    padding-bottom: 0;
  }

  .archive-loading {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 32px 20px;
    color: var(--muted);
    font-size: 13px;
  }

  .archive-pager__left {
    display: grid;
    gap: 2px;
    min-width: 0;
  }

  .archive-pager__status {
    color: var(--ink-soft);
    font-size: 12.5px;
    font-variant-numeric: tabular-nums;
  }

  .archive-pager__notice {
    color: var(--warning);
    font-size: 11.5px;
  }

  .archive-pager__controls {
    display: flex;
    flex: none;
    align-items: center;
    gap: 8px;
  }

  .archive-jump {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--muted);
    font-size: 12px;
    white-space: nowrap;
  }

  .archive-jump input {
    width: 62px;
    min-height: 32px;
    padding: 0 8px;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }

  .location-flag {
    display: inline-flex;
    align-items: center;
    margin-left: 6px;
    color: var(--warning);
    vertical-align: -2px;
  }

  .location-flag .icon {
    width: 14px;
    height: 14px;
  }

  .archive-asset {
    display: grid;
    gap: 1px;
  }

  .archive-asset small {
    color: var(--muted);
    font-size: 11.5px;
  }

  @media (max-width: 860px) {
    .archive-dialog {
      width: 100%;
      height: 100vh;
      max-height: 100vh;
      border-radius: 0;
    }

    .archive-dialog__header {
      padding: 18px 18px 14px;
    }

    .archive-dialog__footer {
      flex-direction: column;
      align-items: stretch;
      padding: 12px 18px;
    }

    .archive-toolbar__filter {
      width: calc(50% - 5px);
    }

    .archive-toolbar--secondary {
      flex-direction: column;
      align-items: stretch;
    }

    .archive-control--end {
      margin-left: 0;
    }

    .archive-pager__controls {
      justify-content: space-between;
    }

    .page-heading__actions {
      width: 100%;
      flex-direction: column;
    }

    .page-heading__actions .button {
      width: 100%;
    }
  }

  /* --------------------------------------------------------------------------
     Rollover administration
     -------------------------------------------------------------------------- */

  .rollover-panel {
    border-color: var(--line-strong);
  }

  .sync-recovery {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin: 16px 0;
    padding: 15px 16px;
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    background: var(--surface-soft);
  }

  .sync-recovery__content {
    display: grid;
    gap: 6px;
    min-width: 0;
  }

  .sync-recovery__heading {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .sync-recovery__heading h3 {
    font-size: 14px;
  }

  .sync-recovery p {
    color: var(--muted);
    font-size: 12.5px;
  }

  .sync-recovery--success {
    border-color: var(--success-line);
    background: var(--success-soft);
  }

  .sync-recovery--attention {
    border-color: var(--warning-line);
    background: var(--warning-soft);
  }

  .sync-recovery--running {
    border-color: var(--info-line);
    background: var(--info-soft);
  }

  .rollover-form {
    display: flex;
    align-items: flex-end;
    gap: 12px;
    margin-top: 16px;
  }

  .rollover-form .field {
    max-width: 200px;
  }

  .rollover-review {
    display: grid;
    gap: 16px;
    margin-top: 20px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
  }

  .rollover-stats {
    display: grid;
    gap: 12px;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    margin: 0;
  }

  .rollover-stats > div {
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    background: var(--surface-soft);
  }

  .rollover-stats dt {
    color: var(--muted);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  .rollover-stats dd {
    margin: 4px 0 0;
    font-size: 17px;
    font-weight: 640;
    font-variant-numeric: tabular-nums;
  }

  .confirmation-box {
    display: grid;
    gap: 14px;
    padding: 18px;
    border: 1px solid var(--danger-line);
    border-radius: var(--r-md);
    background: var(--danger-soft);
  }

  /* --------------------------------------------------------------------------
     Modal
     -------------------------------------------------------------------------- */

  .modal-layer {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: grid;
    place-items: center;
    padding: 24px;
  }

  .modal-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(15, 23, 42, 0.5);
    backdrop-filter: blur(3px);
    animation: fade-in 180ms var(--ease);
  }

  @keyframes fade-in {
    from { opacity: 0; }
  }

  @keyframes pop-in {
    from { opacity: 0; transform: translateY(10px) scale(0.99); }
  }

  .questionnaire {
    position: relative;
    display: flex;
    width: min(100%, 940px);
    max-height: min(92vh, 940px);
    flex-direction: column;
    overflow: hidden;
    border-radius: var(--r-xl);
    background: var(--surface);
    box-shadow: var(--shadow-xl);
    animation: pop-in 220ms var(--ease);
  }

  .questionnaire__header {
    flex: none;
    padding: 22px 26px 0;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
  }

  .questionnaire__title-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
  }

  .questionnaire__title-row h1 {
    font-size: 21px;
  }

  .stepper {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 20px;
  }

  .stepper__item {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    padding: 5px 9px 5px 5px;
    border: 0;
    border-radius: var(--r-full);
    background: none;
    color: var(--muted);
    cursor: pointer;
    transition: background 130ms var(--ease), color 130ms var(--ease);
  }

  .stepper__item:hover {
    background: var(--surface-sunken);
    color: var(--ink);
  }

  .stepper__number {
    display: grid;
    width: 26px;
    height: 26px;
    flex: none;
    place-items: center;
    border: 1px solid var(--line-strong);
    border-radius: var(--r-full);
    background: var(--surface);
    color: var(--muted);
    font-size: 12px;
    font-weight: 620;
    transition: background 140ms var(--ease), border-color 140ms var(--ease), color 140ms var(--ease);
  }

  .stepper__number .icon {
    width: 14px;
    height: 14px;
    stroke-width: 2.6;
  }

  .stepper__tick {
    display: none;
  }

  .stepper__label {
    font-size: 12.5px;
    font-weight: 550;
    white-space: nowrap;
  }

  .stepper__item.is-current {
    color: var(--ink);
  }

  .stepper__item.is-current .stepper__number {
    border-color: var(--accent);
    background: var(--accent);
    color: var(--on-accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  .stepper__item.is-complete {
    color: var(--ink-soft);
  }

  .stepper__item.is-complete .stepper__number {
    border-color: var(--success-line);
    background: var(--success-soft);
    color: var(--success);
  }

  .stepper__item.is-complete .stepper__digit {
    display: none;
  }

  .stepper__item.is-complete .stepper__tick {
    display: block;
  }

  .stepper__line {
    flex: 1 1 auto;
    height: 1px;
    min-width: 12px;
    background: var(--line-strong);
  }

  .modal-progress {
    display: grid;
    gap: 7px;
    padding: 16px 0 14px;
  }

  .modal-progress > div {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
  }

  .modal-progress span {
    color: var(--muted);
    font-size: 12px;
  }

  .modal-progress strong {
    font-size: 12.5px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .questionnaire__form {
    display: flex;
    flex: 1 1 auto;
    min-height: 0;
    flex-direction: column;
  }

  .questionnaire__body {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    padding: 26px;
    background: var(--surface-soft);
  }

  .form-step {
    display: grid;
    gap: 20px;
  }

  .form-step__heading {
    display: flex;
    align-items: flex-start;
    gap: 14px;
  }

  .form-step__icon {
    display: grid;
    width: 34px;
    height: 34px;
    flex: none;
    place-items: center;
    border-radius: var(--r-sm);
    background: var(--accent-soft);
    color: var(--accent-press);
    font-size: 12px;
    font-weight: 660;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em;
  }

  .form-step__heading h2 {
    font-size: 18px;
  }

  .form-step__heading > div > p:last-child {
    margin-top: 4px;
    max-width: 68ch;
    color: var(--muted);
    font-size: 12.5px;
  }

  .form-alert {
    display: flex;
    align-items: flex-start;
    gap: 11px;
    margin-bottom: 20px;
    padding: 13px 15px;
    border: 1px solid var(--danger-line);
    border-radius: var(--r-md);
    background: var(--danger-soft);
  }

  .form-alert div {
    display: grid;
    gap: 2px;
  }

  .form-alert strong {
    color: var(--danger-dark);
    font-size: 13px;
  }

  .form-alert p {
    color: var(--danger-dark);
    font-size: 12.5px;
  }

  .form-alert__icon {
    display: grid;
    flex: none;
    place-items: center;
    color: var(--danger);
    margin-top: 1px;
  }

  .identity-strip,
  .derived-cycle {
    display: grid;
    grid-template-columns: 1fr 1fr;
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    background: var(--surface);
    overflow: hidden;
  }

  .identity-strip > div,
  .derived-cycle > div {
    display: grid;
    gap: 1px;
    padding: 13px 16px;
  }

  .identity-strip > div + div,
  .derived-cycle > div + div {
    border-left: 1px solid var(--line);
  }

  .identity-strip span,
  .derived-cycle span {
    color: var(--muted);
    font-size: 10.5px;
    font-weight: 620;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .identity-strip strong,
  .derived-cycle strong {
    font-size: 14px;
    font-weight: 600;
  }

  .identity-strip small {
    color: var(--muted);
    font-size: 11.5px;
  }

  .derived-cycle strong {
    font-size: 19px;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }

  .field--asset {
    position: relative;
    z-index: 5;
  }

  .asset-snapshot {
    display: grid;
    gap: 16px;
    padding: 18px;
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    background: var(--surface);
  }

  .asset-snapshot__header > div {
    display: grid;
    gap: 1px;
  }

  .asset-snapshot__header span {
    color: var(--muted);
    font-size: 10.5px;
    font-weight: 620;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .asset-snapshot__header strong {
    font-size: 16px;
    font-variant-numeric: tabular-nums;
  }

  .asset-snapshot dl {
    display: grid;
    gap: 12px;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    margin: 0;
  }

  .asset-snapshot dt {
    color: var(--muted);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .asset-snapshot dd {
    margin: 3px 0 0;
    font-size: 13.5px;
    font-weight: 500;
  }

  /* Peripherals and checklist -------------------------------------------------- */

  .peripheral-grid {
    display: grid;
    gap: 14px;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  }

  .peripheral-field {
    display: grid;
    gap: 6px;
    padding: 14px 15px;
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    background: var(--surface);
  }

  .peripheral-field > label {
    font-size: 12.5px;
    font-weight: 570;
  }

  .peripheral-warning {
    color: var(--warning);
    font-size: 11.5px;
  }

  .chip-input {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    min-height: var(--control-h);
    padding: 5px 7px;
    border: 1px solid var(--line-strong);
    border-radius: var(--r-sm);
    background: var(--surface);
    transition: border-color 130ms var(--ease), box-shadow 130ms var(--ease);
  }

  .chip-input:focus-within {
    border-color: var(--accent);
    box-shadow: var(--ring);
  }

  .chip-input input {
    flex: 1 1 90px;
    min-height: 26px;
    min-width: 90px;
    border: 0;
    background: none;
    padding: 0 4px;
  }

  .chip-input input:focus {
    box-shadow: none;
  }

  .tag-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    height: 24px;
    padding: 0 4px 0 9px;
    border: 1px solid var(--accent-line);
    border-radius: var(--r-full);
    background: var(--accent-soft);
    color: var(--accent-press);
    font-size: 11.5px;
    font-weight: 570;
    font-variant-numeric: tabular-nums;
  }

  .tag-chip button {
    display: grid;
    width: 17px;
    height: 17px;
    place-items: center;
    border: 0;
    border-radius: var(--r-full);
    background: none;
    color: inherit;
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
  }

  .tag-chip button .icon {
    width: 12px;
    height: 12px;
    stroke-width: 2.4;
  }

  .tag-chip button:hover {
    background: rgba(79, 70, 229, 0.14);
  }

  .tag-chip--unverified {
    border-color: var(--warning-line);
    background: var(--warning-soft);
    color: var(--warning);
  }

  .tag-chip--unverified button:hover {
    background: rgba(180, 83, 9, 0.14);
  }

  /* Infrastructure evidence uploads ----------------------------------------- */

  .infra-evidence {
    display: grid;
    gap: 16px;
  }

  .evidence-grid {
    display: grid;
    gap: 14px;
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .evidence-card {
    display: grid;
    align-content: start;
    gap: 12px;
    min-width: 0;
    padding: 16px;
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    background: var(--surface);
    transition: border-color 130ms var(--ease), box-shadow 130ms var(--ease);
  }

  .evidence-card.has-selection {
    border-color: var(--accent-line);
    box-shadow: 0 0 0 1px rgba(79, 70, 229, 0.05);
  }

  .evidence-card.has-error {
    border-color: var(--danger);
    box-shadow: var(--ring-danger);
  }

  .evidence-card__header {
    display: flex;
    align-items: flex-start;
    gap: 11px;
  }

  .evidence-card__header > div {
    display: grid;
    gap: 3px;
    min-width: 0;
  }

  .evidence-card__header strong {
    color: var(--ink);
    font-size: 13.5px;
    font-weight: 620;
    line-height: 1.4;
  }

  .evidence-card__header p {
    color: var(--muted);
    font-size: 11.75px;
    line-height: 1.5;
  }

  .evidence-card__icon {
    display: grid;
    width: 30px;
    height: 30px;
    flex: none;
    place-items: center;
    border-radius: var(--r-sm);
    background: var(--accent-soft);
    color: var(--accent-press);
  }

  .evidence-card__icon .icon {
    width: 16px;
    height: 16px;
  }

  .evidence-current {
    display: grid;
    gap: 2px;
    min-width: 0;
    padding: 10px 12px;
    border: 1px solid var(--success-line);
    border-radius: var(--r-sm);
    background: var(--success-soft);
  }

  .evidence-current span {
    color: var(--success);
    font-size: 10.5px;
    font-weight: 620;
    letter-spacing: 0.045em;
    text-transform: uppercase;
  }

  .evidence-current a {
    overflow: hidden;
    color: var(--success);
    font-size: 12.5px;
    font-weight: 570;
    text-decoration: underline;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .evidence-picker {
    position: relative;
    display: grid;
    gap: 2px;
    justify-items: center;
    min-height: 92px;
    padding: 20px 14px;
    border: 1px dashed var(--line-strong);
    border-radius: var(--r-sm);
    background: var(--surface-soft);
    text-align: center;
    cursor: pointer;
    overflow: hidden;
    transition: border-color 130ms var(--ease), background 130ms var(--ease), box-shadow 130ms var(--ease);
  }

  .evidence-picker:hover {
    border-color: var(--accent);
    background: var(--accent-soft);
  }

  .evidence-picker:focus-within {
    border-color: var(--accent);
    box-shadow: var(--ring);
  }

  .evidence-picker__input {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    min-height: 0;
    border: 0;
    opacity: 0;
    cursor: pointer;
  }

  .evidence-picker__action {
    color: var(--accent-press);
    font-size: 12.5px;
    font-weight: 620;
  }

  .evidence-picker small {
    color: var(--muted);
    font-size: 11px;
  }

  .evidence-selection {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    min-width: 0;
  }

  .evidence-selection > div {
    display: grid;
    gap: 1px;
    min-width: 0;
  }

  .evidence-selection strong,
  .evidence-selection span {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .evidence-selection strong {
    color: var(--ink-soft);
    font-size: 12px;
    font-weight: 570;
  }

  .evidence-selection span {
    color: var(--muted);
    font-size: 11px;
  }

  .evidence-selection .text-button {
    flex: none;
    font-size: 11.5px;
  }

  .checklist-groups {
    display: grid;
    gap: 14px;
  }

  .checklist-group {
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    background: var(--surface);
    overflow: hidden;
  }

  .checklist-group__header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 13px 16px;
    border-bottom: 1px solid var(--line);
    background: var(--surface-soft);
  }

  /* Header holds a stacked title block on the left and a count + track pair
     on the right, so both children are their own small layouts. */
  .checklist-group__title {
    display: grid;
    gap: 1px;
    min-width: 0;
  }

  .checklist-group__title strong {
    font-size: 13.5px;
    font-weight: 600;
  }

  .checklist-group__title span {
    color: var(--muted);
    font-size: 11.5px;
  }

  .checklist-group__progress {
    display: grid;
    flex: none;
    gap: 6px;
    justify-items: end;
    width: 118px;
  }

  .checklist-group__count {
    color: var(--muted);
    font-size: 11.5px;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .checklist-group__progress .progress-track {
    width: 100%;
  }

  .checklist-items {
    display: grid;
  }

  .checklist-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 16px;
    transition: background 110ms var(--ease);
  }

  .checklist-item + .checklist-item {
    border-top: 1px solid var(--line);
  }

  .checklist-item:hover {
    background: var(--surface-soft);
  }

  .checklist-item__check {
    display: flex;
    flex: 1 1 auto;
    align-items: center;
    gap: 11px;
    cursor: pointer;
  }

  .checklist-item__label {
    font-size: 13px;
    line-height: 1.5;
  }

  .checklist-item.is-na .checklist-item__label {
    color: var(--faint);
    text-decoration: line-through;
  }

  .checklist-item.is-complete .checklist-item__label {
    color: var(--ink);
  }

  .na-toggle {
    flex: none;
    min-height: 26px;
    padding: 0 9px;
    border: 1px solid var(--line-strong);
    border-radius: var(--r-full);
    background: var(--surface);
    color: var(--muted);
    font-size: 11px;
    font-weight: 620;
    letter-spacing: 0.03em;
    cursor: pointer;
    transition: border-color 130ms var(--ease), background 130ms var(--ease), color 130ms var(--ease);
  }

  .na-toggle:hover {
    border-color: var(--gray-300);
    color: var(--ink);
  }

  .na-toggle.is-active {
    border-color: var(--warning-line);
    background: var(--warning-soft);
    color: var(--warning);
  }

  /* Review card ---------------------------------------------------------------- */

  .review-card {
    display: grid;
    gap: 16px;
    padding: 20px;
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    background: var(--surface);
  }

  .review-grid {
    display: grid;
    gap: 14px;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    margin: 0;
  }

  .review-grid dt {
    color: var(--muted);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.045em;
    text-transform: uppercase;
  }

  .review-grid dd {
    margin: 4px 0 0;
    font-size: 13.5px;
    font-weight: 550;
  }

  .review-card__hint {
    color: var(--muted);
    font-size: 12.5px;
  }

  /* Modal footer -------------------------------------------------------------- */

  .questionnaire__footer {
    display: flex;
    flex: none;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 15px 26px;
    border-top: 1px solid var(--line);
    background: var(--surface);
  }

  .questionnaire__footer-left,
  .questionnaire__footer-actions {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .save-state {
    color: var(--muted);
    font-size: 12px;
  }

  /* --------------------------------------------------------------------------
     Administrator legacy PMS import
     -------------------------------------------------------------------------- */

  .legacy-import-dialog {
    position: relative;
    display: flex;
    width: min(100%, 980px);
    max-height: min(94vh, 940px);
    flex-direction: column;
    overflow: hidden;
    border-radius: var(--r-xl);
    background: var(--surface);
    box-shadow: var(--shadow-xl);
    animation: pop-in 220ms var(--ease);
  }

  .legacy-import-dialog__header {
    flex: none;
    padding: 22px 26px 15px;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
  }

  .legacy-import-dialog__title-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 18px;
  }

  .legacy-import-dialog__title-row h1 {
    font-size: 21px;
  }

  .legacy-import-dialog__summary {
    max-width: 690px;
    margin-top: 5px;
    color: var(--muted);
    font-size: 12.5px;
  }

  .legacy-import-steps {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 18px 0 0;
    padding: 0;
    list-style: none;
  }

  .legacy-import-steps li {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 5px 9px 5px 5px;
    border-radius: var(--r-full);
    color: var(--muted);
    font-size: 12px;
  }

  .legacy-import-steps li > span {
    display: grid;
    width: 25px;
    height: 25px;
    place-items: center;
    border: 1px solid var(--line-strong);
    border-radius: var(--r-full);
    background: var(--surface);
    font-size: 11px;
    font-variant-numeric: tabular-nums;
  }

  .legacy-import-steps li.is-current {
    background: var(--accent-soft);
    color: var(--accent-press);
  }

  .legacy-import-steps li.is-current > span {
    border-color: var(--accent);
    background: var(--accent);
    color: var(--on-accent);
  }

  .legacy-import-steps li.is-complete {
    color: var(--success);
  }

  .legacy-import-steps li.is-complete > span {
    border-color: var(--success-line);
    background: var(--success-soft);
    color: var(--success);
  }

  .legacy-import-dialog__form {
    display: flex;
    min-height: 0;
    flex: 1 1 auto;
    flex-direction: column;
  }

  .legacy-import-dialog__body {
    min-height: 0;
    flex: 1 1 auto;
    padding: 22px 26px 26px;
    overflow: auto;
    overscroll-behavior: contain;
    background: var(--surface-soft);
  }

  .legacy-import-stage {
    display: grid;
    gap: 20px;
  }

  .legacy-import-cycle {
    display: grid;
    gap: 3px;
    padding: 13px 15px;
    border: 1px solid var(--accent-line);
    border-left: 3px solid var(--accent);
    border-radius: var(--r-sm);
    background: var(--accent-soft);
  }

  .legacy-import-cycle span {
    color: var(--accent-press);
    font-size: 11px;
    font-weight: 620;
    letter-spacing: 0.045em;
    text-transform: uppercase;
  }

  .legacy-import-cycle strong {
    font-size: 17px;
    font-variant-numeric: tabular-nums;
  }

  .legacy-import-cycle small {
    color: var(--ink-soft);
    font-size: 12px;
  }

  .legacy-import-local-count {
    color: var(--muted);
    font-size: 11.5px;
    font-weight: 550;
    font-variant-numeric: tabular-nums;
  }

  .field-optional {
    margin-left: 5px;
    color: var(--muted);
    font-size: 10.5px;
    font-weight: 500;
  }
